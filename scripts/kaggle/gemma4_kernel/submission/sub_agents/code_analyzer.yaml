name: code_analyzer
model: gemma-4-12b-it-qat-w4a16-ct
description: Read-only code navigator. It already knows the issue; returns the exact fix location, root cause, fix plan and closest tests.
instruction: !include analyzer.md
tools:
  - run_command
  - read_file
  - get_code_neighbors
  - get_code_subgraph
generate_content_config:
  temperature: 0.1
  top_p: 0.95
  top_k: 40
  max_output_tokens: 2048
  thinking_config:
    include_thoughts: false
