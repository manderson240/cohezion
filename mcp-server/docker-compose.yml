version: '3.8'

services:
  kyutai-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kyutai-mcp-server
    ports:
      - "8361:8361"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8361
      - MCP_LOG_LEVEL=info
      - KYUTAI_CONFIG=/root/.kyutai-mcp/config.yaml
    volumes:
      # Mount configuration directory
      - ~/.kyutai-mcp:/root/.kyutai-mcp
      # Mount audio output directory (optional)
      - kyutai-audio:/tmp/kyutai-audio
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8361/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Phase 2: Uncomment below for TTS API
