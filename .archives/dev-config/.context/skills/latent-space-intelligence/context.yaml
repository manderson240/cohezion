## Key Theorems and Equivalences

### SIGReg ⟷ HIHO Equivalence (LeWM ↔ Cohezion)

LeWM's SIGReg enforces isotropic Gaussian N(0,I) on latent embeddings ⟹ maximum entropy
Cohezion's coherence_score() = 1 - 4·var(brane_dims) peaks at 0.5 ⟹ maximum Shannon entropy

Both prove: **maximum information density = minimum computational cost = computational ground state**

SIGReg: SIGReg(Z) → 0 ⟺ P_Z → N(0,I) ⟹ differential entropy is maximized
HIHO: all dims at 0.5 ⟹ H = -Σ p·log(p) maximized ⟹ computation is cheapest

### Temporal Straightening ⟷ Geodesic Efficiency

LeWM discovers: cosine similarity of consecutive velocity vectors → 1 during training
Cohezion encodes: on flat manifold (Γ=0), geodesics are straight lines

Both: **straight paths = flat geometry = minimum computational work**

### Prediction Loss ⟷ Yang-Mills Action

LeWM: ℒ_pred = ‖ẑ_{t+1} - z_{t+1}‖² (next-state prediction MSE)
Cohezion: S_YM = ‖F‖² (gauge field strength energy)

Both: **prediction error in latent space = energy = cost of being wrong about the future**

