name: Skill Validation

on:
  pull_request:
    paths:
      - '**.md'
      - '.claude/skills.json'
  push:
    branches: [main]
    paths:
      - '**.md'
      - '.claude/skills.json'
  workflow_dispatch:

jobs:
  validate-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate skill registry JSON
        run: |
          python3 << 'EOF'
          import json
          import sys
          from pathlib import Path

          skills_file = Path('.claude/skills.json')
          if not skills_file.exists():
              print("No skills.json found, skipping validation")
              sys.exit(0)

          try:
              data = json.loads(skills_file.read_text())

              # Validate structure
              if not isinstance(data, dict):
                  print("ERROR: skills.json must be a dictionary")
                  sys.exit(1)

              if 'skills' not in data:
                  print("ERROR: skills.json must have a 'skills' key")
                  sys.exit(1)

              skills = data['skills']
              if not isinstance(skills, list):
                  print("ERROR: skills must be a list")
                  sys.exit(1)

              # Validate each skill
              required_fields = ['name', 'description']
              errors = []

              for i, skill in enumerate(skills):
                  for field in required_fields:
                      if field not in skill:
                          errors.append(f"Skill {i}: missing required field '{field}'")

                  # Check for duplicate names
                  skill_names = [s['name'] for s in skills]
                  if skill_names.count(skill.get('name')) > 1:
                      errors.append(f"Skill {i}: duplicate name '{skill.get('name')}'")

              if errors:
                  for e in errors:
                      print(f"ERROR: {e}")
                  sys.exit(1)

              print(f"Validated {len(skills)} skills")

          except json.JSONDecodeError as e:
              print(f"ERROR: Invalid JSON: {e}")
              sys.exit(1)
          EOF

      - name: Check skill frontmatter
        run: |
          python3 << 'EOF'
          import re
          import sys
          from pathlib import Path

          errors = []
          skill_files = list(Path('.claude').rglob('*.md'))

          for f in skill_files:
              if f.name == 'README.md':
                  continue

              content = f.read_text()

              # Check for frontmatter
              if not content.startswith('---'):
                  errors.append(f"{f}: Missing frontmatter")
                  continue

              # Parse frontmatter
              match = re.match(r'^---\n(.*?)\n---', content, re.DOTALL)
              if not match:
                  errors.append(f"{f}: Invalid frontmatter format")
                  continue

              frontmatter = match.group(1)

              # Check required fields
              required = ['name', 'description']
              for field in required:
                  if f'{field}:' not in frontmatter:
                      errors.append(f"{f}: Missing '{field}' in frontmatter")

          if errors:
              for e in errors:
                  print(f"ERROR: {e}")
              sys.exit(1)

          print(f"Validated {len(skill_files)} skill files")
          EOF
