name: Worktree Lifecycle

on:
  schedule:
    # Run monthly on the 1st at 00:00 UTC
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      days_threshold:
        description: 'Days since last modification to archive'
        required: false
        default: '90'

jobs:
  archive-old-worktrees:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Find and archive old worktrees
        run: |
          python3 << 'EOF'
          import os
          import subprocess
          import sys
          from datetime import datetime, timedelta
          from pathlib import Path

          DAYS_THRESHOLD = int(os.environ.get('DAYS_THRESHOLD', '90'))
          repo_root = Path.cwd()
          worktrees_dir = repo_root / '.worktrees'

          if not worktrees_dir.exists():
              print("No .worktrees directory found")
              sys.exit(0)

          cutoff_date = datetime.now() - timedelta(days=DAYS_THRESHOLD)
          archived = []
          errors = []

          for worktree_path in worktrees_dir.iterdir():
              if not worktree_path.is_dir():
                  continue

              # Get last modification time of manifest
              manifest = worktree_path / 'MANIFEST.md'
              if manifest.exists():
                  mtime = datetime.fromtimestamp(manifest.stat().st_mtime)
              else:
                  mtime = datetime.fromtimestamp(worktree_path.stat().st_mtime)

              if mtime < cutoff_date:
                  print(f"Archiving {worktree_path.name} (last modified: {mtime.date()})")

                  # Run archive script
                  result = subprocess.run(
                      ['python3', 'scripts/worktree-archive.py', str(worktree_path), '--json'],
                      capture_output=True,
                      text=True
                  )

                  if result.returncode == 0:
                      archived.append(worktree_path.name)
                  else:
                      errors.append(f"{worktree_path.name}: {result.stderr}")

          print(f"\nArchived {len(archived)} worktrees")
          if archived:
              for name in archived:
                  print(f"  - {name}")

          if errors:
              print(f"\nErrors ({len(errors)}):")
              for e in errors:
                  print(f"  - {e}")
        env:
          DAYS_THRESHOLD: ${{ github.event.inputs.days_threshold || '90' }}

      - name: Report status
        run: |
          echo "Worktree lifecycle maintenance complete"
