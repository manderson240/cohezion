services:
  notebooks:
    build:
      context: .
      dockerfile: Dockerfile.notebooks
    container_name: cohezion-notebooks
    ports:
      - "2718:2718" # Marimo default port
      - "8080:8080" # Alternative/Quarto
    volumes:
      - ./notebooks:/app/notebooks:rw
      - ./research:/app/research:rw
      - ./src:/app/src:ro
      - ./data:/app/data:rw
      - ./logs:/app/logs:rw
    environment:
      - PYTHONPATH=/app/src
      - MARIMO_SHOW_TRACEBACKS=1
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:2718/" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Optional: Visualization rendering service
  renderer:
    build:
      context: .
      dockerfile: Dockerfile.notebooks
    container_name: cohezion-renderer
    command: [ "python", "-m", "http.server", "8000", "-d", "/app/renders" ]
    ports:
      - "8000:8000"
    volumes:
      - ./renders:/app/renders:rw
      - ./logs:/app/logs:rw
    depends_on:
      - notebooks

networks:
  default:
    name: cohezion-network
