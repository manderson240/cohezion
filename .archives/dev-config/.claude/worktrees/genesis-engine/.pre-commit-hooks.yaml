repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff-format
        entry: ruff format --check
        language: system
        types: [python]

      - id: ruff-check
        name: ruff-check
        entry: ruff check
        language: system
        types: [python]

      - id: skill-validation
        name: Validate Skill Registry
        entry: python3 scripts/validate-skills.py
        language: system
        files: '\.claude/.*\.md$|\.claude/skills\.json$'
        pass_filenames: false

      - id: file-size-check
        name: Check File Sizes
        entry: python3 -c "
import sys
from pathlib import Path

errors = []
for f in sys.argv[1:]:
    p = Path(f)
    if p.suffix == '.py':
        lines = len(p.read_text().split('\n'))
        if lines > 500:
            errors.append(f'{f}: {lines} lines (limit: 500)')

if errors:
    print('File size violations:')
    for e in errors:
        print(f'  {e}')
    sys.exit(1)
"
        language: system
        types: [python]
        pass_filenames: true
