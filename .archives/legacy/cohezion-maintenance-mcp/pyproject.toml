[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cohezion-maintenance-mcp"
version = "0.1.0"
description = "Graph health monitoring and vault maintenance MCP server"
requires-python = "==3.11.*"
dependencies = [
    "mcp[cli]>=1.2.0",
    "surrealdb>=1.0.8",
    "httpx>=0.27.0",
]

[project.scripts]
cohezion-maintenance-mcp = "maintenance_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/maintenance_mcp"]
