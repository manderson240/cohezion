name: deep_research
description: "Deep research workflow with multiple research iterations and synthesis"
version: "1.0"
author: cohezion-meta-generator

agents:
  - name: primary_researcher
    type: ResearchAgent
    config:
      model: "deepseek-r1:7b"
      priority: 5

  - name: secondary_researcher
    type: ResearchAgent
    config:
      model: "phi3:mini"
      priority: 4

  - name: synthesizer
    type: AnalystAgent
    config:
      model: "deepseek-r1:70b"
      priority: 7

steps:
  - name: initial_search
    agent: primary_researcher
    input:
      query: "{{ research_query }}"
      sources: ["arxiv", "semantic_scholar"]
      max_results: 20
    output: "initial_papers"

  - name: secondary_search
    agent: secondary_researcher
    input:
      query: "{{ research_query }}"
      sources: ["web", "wikipedia"]
      max_results: 15
    output: "secondary_sources"

  - name: analyze_papers
    agent: primary_researcher
    input:
      papers: "${steps.initial_search.output}"
      analysis_type: "detailed"
    output: "paper_analysis"

  - name: synthesize_findings
    agent: synthesizer
    input:
      primary: "${steps.analyze_papers.output}"
      secondary: "${steps.secondary_search.output}"
      query: "{{ research_query }}"
    output: "research_synthesis"

  - name: generate_report
    agent: synthesizer
    input:
      synthesis: "${steps.synthesize_findings.output}"
      format: "{{ report_format | default('markdown') }}"
    output: "final_report"

data_flow:
  - from: initial_search
    to: analyze_papers
    field: "output"
  - from: secondary_search
    to: synthesize_findings
    field: "output"
  - from: analyze_papers
    to: synthesize_findings
    field: "output"
  - from: synthesize_findings
    to: generate_report
    field: "output"

parallel:
  - steps: ["initial_search", "secondary_search"]
    max_concurrent: 2

quality_gates:
  - step: analyze_papers
    metric: "papers_analyzed"
    threshold: 5
    action: "stop"

outputs:
  - name: "report"
    source: "${steps.generate_report.output}"
  - name: "citations"
    source: "${steps.analyze_papers.output.citations}"
