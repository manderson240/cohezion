name: code_review
description: "Automated code review with multiple quality checks and suggestions"
version: "1.0"
author: cohezion-meta-generator

agents:
  - name: security_auditor
    type: SecurityAuditorAgent
    config:
      model: "phi3:mini"
      priority: 8

  - name: style_checker
    type: CodeReviewAgent
    config:
      model: "phi3:mini"
      priority: 5

  - name: performance_analyst
    type: PerformanceAgent
    config:
      model: "deepseek-r1:7b"
      priority: 6

  - name: architecture_reviewer
    type: ArchitectAgent
    config:
      model: "deepseek-r1:70b"
      priority: 7

  - name: final_reviewer
    type: CodeReviewAgent
    config:
      model: "deepseek-r1:7b"
      priority: 5

steps:
  - name: security_scan
    agent: security_auditor
    input:
      code: "{{ code_path }}"
      scan_type: "comprehensive"
    output: "security_report"

  - name: style_check
    agent: style_checker
    input:
      code: "{{ code_path }}"
      standards: "{{ coding_standard | default('pep8') }}"
    output: "style_report"

  - name: performance_analysis
    agent: performance_analyst
    input:
      code: "{{ code_path }}"
      benchmarks: "{{ include_benchmarks | default(false) }}"
    output: "performance_report"

  - name: architecture_review
    agent: architecture_reviewer
    input:
      code: "{{ code_path }}"
      patterns: "{{ expected_patterns | default([]) }}"
    output: "architecture_report"

  - name: consolidate_feedback
    agent: final_reviewer
    input:
      security: "${steps.security_scan.output}"
      style: "${steps.style_check.output}"
      performance: "${steps.performance_analysis.output}"
      architecture: "${steps.architecture_review.output}"
    output: "consolidated_review"

  - name: generate_suggestions
    agent: final_reviewer
    input:
      review: "${steps.consolidate_feedback.output}"
      auto_fix: "{{ auto_fix_safe | default(false) }}"
    output: "final_report"

data_flow:
  - from: security_scan
    to: consolidate_feedback
    field: "output"
  - from: style_check
    to: consolidate_feedback
    field: "output"
  - from: performance_analysis
    to: consolidate_feedback
    field: "output"
  - from: architecture_review
    to: consolidate_feedback
    field: "output"
  - from: consolidate_feedback
    to: generate_suggestions
    field: "output"

parallel:
  - steps: ["security_scan", "style_check", "performance_analysis", "architecture_review"]
    max_concurrent: 4

quality_gates:
  - step: security_scan
    metric: "critical_issues"
    threshold: 0
    action: "stop"
  - step: consolidate_feedback
    metric: "overall_score"
    threshold: 0.7
    action: "warn"

outputs:
  - name: "report"
    source: "${steps.generate_suggestions.output}"
  - name: "security_issues"
    source: "${steps.security_scan.output.issues}"
  - name: "suggested_fixes"
    source: "${steps.generate_suggestions.output.fixes}"
