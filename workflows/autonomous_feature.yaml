name: autonomous_feature_development
description: "End-to-end autonomous feature development workflow - from requirements to deployment"
version: "1.0"
author: cohezion-meta-generator

agents:
  - name: researcher
    type: ResearchAgent
    config:
      model: "deepseek-r1:7b"
      priority: 5

  - name: architect
    type: ArchitectAgent
    config:
      model: "deepseek-r1:70b"
      priority: 8

  - name: developer
    type: CodeAgent
    config:
      model: "qwen2.5-coder:7b"
      priority: 7

  - name: reviewer
    type: CodeReviewAgent
    config:
      model: "phi3:mini"
      priority: 6

steps:
  - name: research_requirements
    agent: researcher
    input:
      query: "Research best practices and patterns for implementing {{ feature_name }}"
      context:
        domain: "{{ feature_domain }}"
        requirements: "{{ feature_requirements }}"
    output: "research_report"

  - name: design_architecture
    agent: architect
    input:
      requirements: "${steps.research_requirements.output}"
      research: "${steps.research_requirements.output}"
      constraints: "{{ constraints }}"
    output: "architecture_design"

  - name: implement_feature
    agent: developer
    input:
      architecture: "${steps.design_architecture.output}"
      test_requirements: "${steps.research_requirements.output}"
    output: "feature_code"

  - name: review_code
    agent: reviewer
    input:
      code: "${steps.implement_feature.output}"
      architecture: "${steps.design_architecture.output}"
    output: "review_report"

  - name: fix_issues
    agent: developer
    input:
      review: "${steps.review_code.output}"
      code: "${steps.implement_feature.output}"
    output: "fixed_code"

data_flow:
  - from: research_requirements
    to: design_architecture
    field: "output"
  - from: design_architecture
    to: implement_feature
    field: "output"
  - from: implement_feature
    to: review_code
    field: "output"
  - from: review_code
    to: fix_issues
    field: "output"

quality_gates:
  - step: review_code
    metric: "alignment_score"
    threshold: 0.85
    action: "stop"

parallel:
  - steps: ["implement_feature"]
    max_concurrent: 1

triggers:
  - type: "manual"
    condition: "User triggers via CLI"

outputs:
  - name: "final_code"
    source: "${steps.fix_issues.output}"
  - name: "review_summary"
    source: "${steps.review_code.output}"
