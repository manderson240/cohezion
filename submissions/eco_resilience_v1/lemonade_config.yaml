# Lemonade Server: Hardware Orchestration Config
# Target: AMD Ryzen AI MAX+ 395 (Strix Halo)
# ROCm Version: 7.0

hardware_targets:
  npu:
    endpoint: "http://localhost:11435"
    architecture: "XDNA2"
    priority: 1
    supported_models: ["gemma4:2b", "gemma4:4b"]
    memory_limit_gb: 16

  gpu:
    endpoint: "http://localhost:11434"
    architecture: "RDNA3.5"
    priority: 2
    supported_models: ["gemma4:26b-moe"]
    memory_limit_gb: 96
    optimization: "MXFP4_BLOCK_SCALED"

  cloud:
    endpoint: "https://cloud.ollama.ai"
    architecture: "H100/A100"
    priority: 3
    supported_models: ["gemma4:31b"]
    memory_limit_gb: -1 # Unlimited

model_affinity:
  "gemma4:2b": "npu"
  "gemma4:4b": "npu"
  "gemma4:26b-moe": "gpu"
  "gemma4:31b": "cloud"

uma_policy:
  mode: "Symphony" # Prevent evictions during regime transitions
  pinned_models: ["gemma4:26b-moe"]
  eviction_strategy: "LRU_SENSING_FIRST"
