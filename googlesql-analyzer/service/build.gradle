plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'io.cohezion'
version = '0.1.0'
sourceCompatibility = '17'

repositories {
    mavenCentral()
}

dependencies {
    // GoogleSQL (ZetaSQL) Java API
    implementation 'com.google.zetasql:zetasql-client:2024.12.1'
    implementation 'com.google.zetasql:zetasql-types:2024.12.1'
    implementation 'com.google.zetasql:zetasql-jni-channel:2024.12.1'

    // Lightweight HTTP server (no Spring Boot overhead)
    implementation 'io.javalin:javalin:6.4.0'

    // JSON processing
    implementation 'com.google.code.gson:gson:2.11.0'

    // Logging
    implementation 'org.slf4j:slf4j-simple:2.0.16'
}

application {
    mainClass = 'cohezion.googlesql.AnalyzerApplication'
}

shadowJar {
    archiveBaseName.set('googlesql-analyzer')
    archiveClassifier.set('')
    archiveVersion.set(version)
    mergeServiceFiles()
}

jar {
    manifest {
        attributes 'Main-Class': 'cohezion.googlesql.AnalyzerApplication'
    }
}
