# Docker Compose profiles for Cohezion simulation tiers.
#
# Usage:
#   docker compose -f docker/docker-compose.simulations.yml --profile light up
#   docker compose -f docker/docker-compose.simulations.yml --profile medium up
#   docker compose -f docker/docker-compose.simulations.yml --profile heavy up
#
# All tiers use security hardening: no-new-privileges, read-only rootfs (light),
# network isolation, and tmpfs for temporary storage.

services:
  simulation-light:
    image: python:3.11-slim
    profiles:
      - light
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    security_opt:
      - no-new-privileges:true
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /app/output:size=128m
    working_dir: /app
    command: ["python", "main.py"]
    environment:
      - COHEZION_TIER=light
      - PYTHONDONTWRITEBYTECODE=1

  simulation-medium:
    image: python:3.11-slim
    profiles:
      - medium
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"
    security_opt:
      - no-new-privileges:true
    network_mode: none
    tmpfs:
      - /tmp:size=512m
      - /app/output:size=256m
    working_dir: /app
    command: ["python", "main.py"]
    environment:
      - COHEZION_TIER=medium
      - PYTHONDONTWRITEBYTECODE=1

  simulation-heavy:
    image: python:3.11-slim
    profiles:
      - heavy
    deploy:
      resources:
        limits:
          memory: 64g
          cpus: "4.0"
    security_opt:
      - no-new-privileges:true
    network_mode: none
    tmpfs:
      - /tmp:size=2g
      - /app/output:size=1g
    volumes:
      - simulation-data:/app/data
    working_dir: /app
    command: ["python", "main.py"]
    environment:
      - COHEZION_TIER=heavy
      - PYTHONDONTWRITEBYTECODE=1

volumes:
  simulation-data:
    driver: local
