# Pre-commit hooks for code quality enforcement
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
#
# Hook stages:
#   - [commit] (fast): Runs on `git commit` - ~3-5s for quick feedback
#   - [push] (safety): Runs on `git push` - large files and secrets only (linting in CI)
#
# Usage:
#   pre-commit run --all-files                   # Run all hooks, all stages
#   pre-commit run --all-files --hook-stage=commit # Run only fast checks

exclude: '^(\.claude/|\.gitmodules$)'

repos:
  # ============================================================================
  # FAST CHECKS (commit stage) - Quick syntax and formatting validation
  # ============================================================================

  # actionlint - GitHub Actions workflow schema validator
  # Catches: missing required fields (steps:, runs-on:), bad expressions,
  # invalid action references, malformed matrices — BEFORE they hit CI.
  # Lesson: 6 sessions of "workflow file issue" on auto-generate-tests
  # (missing steps:) would have been caught instantly by this hook.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
        stages: [pre-commit]

  # Ruff - Fast Python formatter and quick linter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      # Format check (no auto-fix on commit, just warn)
      - id: ruff-format
        stages: [pre-commit]
        args: [--check]
      # Quick lint - only basic syntax errors and auto-fixes
      - id: ruff
        stages: [pre-commit]
        args: [--select=F,E9,E501, --fix]
        name: ruff-quick (syntax errors only)

  # General file checks - Fast validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
        exclude: '\.patch$'
      - id: end-of-file-fixer
        stages: [pre-commit]
        exclude: '(\.patch$|^\.claude/|^\.gitmodules$|^scripts/)'
      - id: check-yaml
        stages: [pre-commit]
      - id: check-added-large-files
        args: [--maxkb=1000]
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]

  # Catch hardcoded developer home paths in test files (environment-specific failures)
  - repo: local
    hooks:
      # Dormancy gate (verification-depth.md layer 3): a curated load-bearing capability that lost its
      # production consumer (wired structurally, dead functionally) FAILS the commit. Deterministic,
      # fast, no LLM. Self-test-proven to go red on a planted-dormant symbol. Only fires when compound/
      # inference source changes (so it never cries wolf on unrelated commits).
      - id: dormancy-scan
        name: dormancy-scan (no load-bearing capability may go dormant)
        entry: python3 scripts/ci/dormancy_scan.py
        language: system
        pass_filenames: false
        always_run: false
        files: ^src/cohezion/(compound|inference)/
        stages: [pre-commit]

      - id: no-hardcoded-home-paths
        name: no-hardcoded-home-paths
        language: pygrep
        entry: '"/home/[a-zA-Z0-9_-]+/(dev|projects|src|code)/'
        types: [python]
        files: ^tests/
        stages: [pre-commit]

      - id: playwright-tests
        name: Run Playwright Tests
        entry: bash -c 'cd src/web/anima_dashboard && npx playwright test'
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^src/web/

      # Large artifact gate: files >50MB must be registered in artifact system
      - id: large-artifact-gate
        name: large-artifact-gate (>50MB requires registration)
        language: python
        entry: python -c "import sys,os;[sys.exit(print(f'ERROR {f} ({os.path.getsize(f)//1048576}MB) >50MB')) for f in sys.argv[1:] if os.path.getsize(f)>52428800] or None"
        stages: [pre-commit]

      # LFS enforcement: files matching .gitattributes LFS patterns must be LFS pointers
      # L330: 9.3GB tarball bypassed size gates because LFS wasn't initialized
      # 2026-04-22: extracted inline Python to scripts/hooks/lfs_pointer_check.py
      # (inline `python -c "..."` multi-line form had a YAML parse failure mode —
      #  unindented Python lines looked like new YAML keys to strict parsers).
      - id: lfs-pointer-check
        name: lfs-pointer-check (LFS-tracked files must be pointers)
        language: python
        entry: python scripts/hooks/lfs_pointer_check.py
        stages: [pre-commit]

      # Kaggle branch guard: block competition work on non-kaggle branches
      # 2026-04-22: added after Sprint B discovered ~13 NeuroGolf/ARC/Nemotron
      # commits had landed on isolated/session-oom-modularity instead of the
      # designated .worktrees/agi-golf or .worktrees/nemotron-june per
      # ~/.claude/rules/kaggle-portfolio.md. Skip: KAGGLE_GUARD_DISABLE=1.
      - id: kaggle-branch-guard
        name: kaggle-branch-guard (block Kaggle work on non-kaggle/* branches)
        language: system
        entry: bash scripts/hooks/kaggle_branch_guard.sh
        pass_filenames: false
        stages: [pre-commit]

      # Version consistency: all version strings must match pyproject.toml
      - id: version-consistency
        name: version-consistency
        language: python
        entry: python scripts/hooks/check_version_consistency.py
        pass_filenames: false
        stages: [pre-commit]

  # ============================================================================
  # PUSH STAGE - Safety checks only (comprehensive linting deferred to CI)
  # ============================================================================

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1000]
        stages: [pre-push]
      - id: detect-private-key
        stages: [pre-push]

  # Detect Secrets - Advanced credential detection
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        stages: [pre-push]
        args: ["--baseline", ".secrets.baseline"]

  # Bandit - Security linting for Python code
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        stages: [pre-push]
        args: [--severity-level=medium, --skip=B101]
        language: python

  # ── BMAD Phase Lock ──────────────────────────────────────────────
  - repo: local
    hooks:
      - id: bmad-phase-lock
        name: BMAD phase lock enforcement
        entry: python scripts/hooks/bmad_phase_lock.py enforce
        language: python
        stages: [pre-commit]
        files: '_bmad-output/.*\.md$'
