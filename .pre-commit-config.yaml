repos:
  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: [types-all]
        args: [--ignore-missing-imports]
        exclude: ^tests/

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: detect-private-key

  # Local hooks - tests and health checks
  - repo: local
    hooks:
      - id: check-file-count
        name: Check untracked file count
        entry: scripts/hooks/check-file-count.sh
        language: script
        pass_filenames: false
        always_run: true

      - id: pytest-check
        name: pytest-check
        entry: uv run pytest tests/ -x -q --tb=short
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: import-check
        name: import-check
        entry: uv run python -c "from cohezion.mcp import MCPRegistry; from cohezion.swarm import DebateWorkflow"
        language: system
        pass_filenames: false
        always_run: true

# Citation: https://pre-commit.com
