# Pre-commit hooks for code quality enforcement
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # ============================================================================
  # FAST CHECKS (commit stage) - Quick syntax and formatting validation
  # ============================================================================

  # Ruff - Fast Python formatter and linter (full rule set from pyproject.toml)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      # Format: auto-fix on commit
      - id: ruff-format
        stages: [pre-commit]
      # Lint: full rule set with auto-fix (rules configured in pyproject.toml)
      - id: ruff
        stages: [pre-commit]
        args: [--fix]
        name: ruff-lint (full rules)

  # Type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies: []
        args: [--ignore-missing-imports]

  # General pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: detect-private-key
