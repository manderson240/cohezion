# Hooks without explicit stages: only run on commit (not push)
default_stages: [pre-commit]

repos:
  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Type checking (warn-only until existing errors are fixed)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        exclude: ^tests/
        verbose: true

  # General file checks
  # NOTE: pre-commit-hooks internally sets stages: [commit, push] on all hooks,
  # so default_stages does NOT apply. Must override explicitly per hook.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: check-added-large-files
        args: ['--maxkb=1000']
        stages: [pre-commit, pre-push]
      - id: detect-private-key
        stages: [pre-commit, pre-push]

  # Local hooks
  - repo: local
    hooks:
      # Safety checks - run on both commit and push
      - id: check-file-count
        name: Check untracked file count
        entry: scripts/hooks/check-file-count.sh
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

      - id: check-complexity
        name: Check code complexity
        entry: scripts/hooks/check-complexity.sh
        language: script
        pass_filenames: false
        always_run: true

      # Push-only hooks (slower, run once before sharing)
      - id: pytest-check
        name: pytest-check
        entry: uv run pytest tests/ -x -q --tb=short
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: import-check
        name: import-check
        entry: uv run python -c "from cohezion.mcp import MCPRegistry; from cohezion.swarm import DebateWorkflow"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

# Citation: https://pre-commit.com
