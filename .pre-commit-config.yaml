# Pre-commit hooks for code quality enforcement
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
#
# Hook stages:
#   - [commit] (fast): Runs on `git commit` - ~3-5s for quick feedback
#   - [push] (comprehensive): Runs on `git push` - full type checking and linting
#
# Usage:
#   pre-commit run --all-files                   # Run all hooks, all stages
#   pre-commit run --all-files --hook-stage=commit # Run only fast checks

repos:
  # ============================================================================
  # FAST CHECKS (commit stage) - Quick syntax and formatting validation
  # ============================================================================

  # Ruff - Fast Python formatter and quick linter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      # Format check (no auto-fix on commit, just warn)
      - id: ruff-format
        stages: [commit]
        args: [--check]
      # Quick lint - only basic syntax errors and auto-fixes
      - id: ruff
        stages: [commit]
        args: [--select=F,E9,E501, --fix]
        name: ruff-quick (syntax errors only)

  # General file checks - Fast validation
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        stages: [commit]
      - id: end-of-file-fixer
        stages: [commit]
      - id: check-yaml
        stages: [commit]
      - id: check-added-large-files
        args: [--maxkb=1000]
        stages: [commit]
      - id: check-merge-conflict
        stages: [commit]
      - id: detect-private-key
        stages: [commit]

  # ============================================================================
  # COMPREHENSIVE CHECKS (push stage) - Slow but thorough validation
  # ============================================================================

  # Full Ruff linting - comprehensive analysis
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        stages: [push]
        args: [--fix]
        name: ruff-full (comprehensive)

  # Type checking with mypy - Slow but catches type errors
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        stages: [push]
        additional_dependencies: []
        args: [--ignore-missing-imports, --warn-unused-configs]
