# Pre-commit hooks for Cohezion
# Install: uv run pre-commit install

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      # Critical lint errors - MUST PASS
      - id: ruff
        name: ruff-critical
        args: 
          - --select
          - "E722,F821,S607"
          - --exit-non-zero-on-fix
        files: "^src/|^scripts/|^tests/"
        exclude: "(research/|\.venv/|__pycache__/)"
      
      # Style errors - auto-fix
      - id: ruff
        name: ruff-style
        args:
          - --select
          - "E501,I001,W293,UP006,N806,RUF059,F401"
          - --fix
        files: "^src/|^scripts/|^tests/"
        exclude: "(research/|\.venv/|__pycache__/)"
      
      # Formatter
      - id: ruff-format
        files: "^src/|^scripts/|^tests/"
        exclude: "(research/|\.venv/|__pycache__/)"

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
