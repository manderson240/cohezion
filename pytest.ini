[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = strict
# Default per-test timeout. Any test running longer than this is almost
# certainly hung (asyncio task leak, deadlock, unclosed resource). Individual
# tests that genuinely need longer may override with @pytest.mark.timeout(N).
# Added 2026-04-24 in PR #75 after test_adversarial_flood hung CI for 5+min.
timeout = 60
addopts = --cov=src --cov-report=html --cov-report=term-missing -v
markers =
    fast: Fast unit tests (<1s each, no live services)
    integration: Integration tests (require live services like Ollama/SurrealDB)
    mcp: MCP server tests (require vault access)
    unit: Unit tests (no external dependencies)
    sandbox: Sandbox isolation tests
    timeout: Test timeout in seconds
