[pytest]
# Phase 4A pytest configuration

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage settings
# Target: 90%+ coverage across all tracks
addopts =
    --cov=src
    --cov-report=term-missing
    --cov-fail-under=80
    --cov-report=html:htmlcov
    -q

# Markers for organizing tests
markers =
    unit: Unit tests (no external dependencies)
    integration: Integration tests (with SurrealDB, external APIs)
    graphrag: GraphRAG Reasoning Engine tests (Track A)
    scoring: Confidence Scoring System tests (Track B)
    impact: Impact & Dependency Analyzer tests (Track C)
    slow: Tests that take >1 second (deferred for CI)

# Output settings
console_output_style = progress
log_cli = false
log_level = WARNING

# Timeout for long-running tests (30 seconds default)
timeout = 30

# Parallelization (if using pytest-xdist)
# Uncomment to run tests in parallel:
# addopts = -n auto
