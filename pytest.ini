[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = strict
# NOTE: a default `timeout = 60` was proposed as part of PR #75 to catch
# hanging tests (like test_adversarial_flood which hung CI 5+ minutes before
# being explicitly skipped). However, enabling it surfaced additional
# pre-existing hangs (e.g. test_sandbox_manager::test_run_simulation_success)
# that are beyond the scope of this PR. Deferred to a follow-up cleanup PR
# that will add the default timeout and quarantine the remaining hangs in
# one coordinated pass.
addopts = --cov=src --cov-report=html --cov-report=term-missing -v
markers =
    fast: Fast unit tests (<1s each, no live services)
    integration: Integration tests (require live services like Ollama/SurrealDB)
    mcp: MCP server tests (require vault access)
    unit: Unit tests (no external dependencies)
    sandbox: Sandbox isolation tests
    timeout: Test timeout in seconds
