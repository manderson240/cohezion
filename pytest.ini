[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = strict
addopts = -v

filterwarnings =
    ignore::DeprecationWarning:passlib.*
markers =
    fast: Fast unit tests (<1s each, no live services)
    integration: Integration tests (require live services like Ollama/SurrealDB)
    mcp: MCP server tests (require vault access)
    unit: Unit tests (no external dependencies)
    sandbox: Sandbox isolation tests
    timeout: Test timeout in seconds
    slow: Long-running tests (>30s)
    benchmark: Performance benchmark tests
    agent: Agent-specific orchestration tests
    backend: Backend/target-specific tests
    compound: Compound engineering tests
    e2e: End-to-end integration tests
    api: API endpoint tests
