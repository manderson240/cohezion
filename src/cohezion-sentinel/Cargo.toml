[package]
name = "cohezion-sentinel"
version = "0.1.0"
edition = "2024"
description = "Ultra-lean 24/7 background sentinel daemon for Kaggle ascent & host governance. <2MB RSS."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
