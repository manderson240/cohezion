[package]
name = "cohezion-sentinel"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later OR MIT"
description = "Ultra-lean 24/7 background sentinel daemon for Kaggle ascent & host governance. <2MB RSS."
authors = ["Mike Anderson <manderson240@users.noreply.github.com>"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
