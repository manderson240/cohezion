<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latent Currents — FLUME VAE Flow</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413; --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5; --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757; --anthropic-blue: #6a9bcc; --anthropic-green: #788c5d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%); min-height: 100vh; color: var(--anthropic-dark); }
        .container { display: flex; min-height: 100vh; padding: 20px; gap: 20px; }
        .sidebar { width: 320px; flex-shrink: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); padding: 24px; border-radius: 12px; box-shadow: 0 10px 30px rgba(20,20,19,0.1); overflow-y: auto; }
        .sidebar h1 { font-family: 'Lora', serif; font-size: 24px; font-weight: 500; color: var(--anthropic-dark); margin-bottom: 8px; }
        .sidebar .subtitle { color: var(--anthropic-mid-gray); font-size: 14px; margin-bottom: 32px; line-height: 1.4; }
        .control-section { margin-bottom: 32px; }
        .control-section h3 { font-size: 16px; font-weight: 600; color: var(--anthropic-dark); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .control-section h3::before { content: '•'; color: var(--anthropic-orange); font-weight: bold; }
        .seed-input { width: 100%; background: var(--anthropic-light); padding: 12px; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 14px; margin-bottom: 12px; border: 1px solid var(--anthropic-light-gray); text-align: center; }
        .seed-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .control-group { margin-bottom: 20px; }
        .control-group label { display: block; font-size: 14px; font-weight: 500; color: var(--anthropic-dark); margin-bottom: 8px; }
        .slider-container { display: flex; align-items: center; gap: 12px; }
        .slider-container input[type="range"] { flex: 1; height: 4px; background: var(--anthropic-light-gray); border-radius: 2px; outline: none; -webkit-appearance: none; }
        .slider-container input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: var(--anthropic-orange); border-radius: 50%; cursor: pointer; }
        .slider-container input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; background: var(--anthropic-orange); border-radius: 50%; border: none; cursor: pointer; }
        .value-display { font-family: 'Courier New', monospace; font-size: 12px; color: var(--anthropic-mid-gray); min-width: 60px; text-align: right; }
        .button { background: var(--anthropic-orange); color: white; border: none; padding: 10px 16px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s ease; width: 100%; }
        .button:hover { background: #c86641; }
        .button.secondary { background: var(--anthropic-blue); }
        .button.tertiary { background: var(--anthropic-green); }
        .button-row { display: flex; gap: 8px; }
        .button-row .button { flex: 1; }
        .canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; }
        #canvas-container { width: 100%; max-width: 1000px; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 40px rgba(20,20,19,0.1); background: #0a0e1a; }
        #canvas-container canvas { display: block; width: 100% !important; height: auto !important; }
        .loading { display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--anthropic-mid-gray); min-height: 400px; }
        .hint { font-size: 11px; color: var(--anthropic-mid-gray); margin-top: 4px; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Latent Currents</h1>
            <div class="subtitle">FLUME VAE — particles flowing through a 256D latent space projected onto 2D, drawn by attractor basins.</div>

            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="42" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Encoded Particles</label>
                    <div class="slider-container">
                        <input type="range" id="particleCount" min="200" max="3000" step="100" value="1400" oninput="updateParam('particleCount', this.value)">
                        <span class="value-display" id="particleCount-value">1400</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Attractor Basins</label>
                    <div class="slider-container">
                        <input type="range" id="basinCount" min="2" max="14" step="1" value="6" oninput="updateParam('basinCount', this.value)">
                        <span class="value-display" id="basinCount-value">6</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Basin Pull</label>
                    <div class="slider-container">
                        <input type="range" id="basinPull" min="0" max="0.4" step="0.01" value="0.15" oninput="updateParam('basinPull', this.value)">
                        <span class="value-display" id="basinPull-value">0.15</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Flow Curl</label>
                    <div class="slider-container">
                        <input type="range" id="curl" min="0" max="3" step="0.05" value="1.0" oninput="updateParam('curl', this.value)">
                        <span class="value-display" id="curl-value">1.00</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Trail Persistence</label>
                    <div class="slider-container">
                        <input type="range" id="trailPersist" min="2" max="50" step="1" value="20" oninput="updateParam('trailPersist', this.value)">
                        <span class="value-display" id="trailPersist-value">20</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Reconstruction Loss Bias</label>
                    <div class="slider-container">
                        <input type="range" id="lossBias" min="0" max="1" step="0.01" value="0.55" oninput="updateParam('lossBias', this.value)">
                        <span class="value-display" id="lossBias-value">0.55</span>
                    </div>
                </div>
                <div class="hint">Drag on canvas to spawn new encodings.</div>
            </div>

            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">Reset</button>
                </div>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing latent space…</div>
            </div>
        </div>
    </div>

    <script>
        let params = {
            seed: 42,
            particleCount: 1400,
            basinCount: 6,
            basinPull: 0.15,
            curl: 1.0,
            trailPersist: 20,
            lossBias: 0.55
        };
        let defaultParams = JSON.parse(JSON.stringify(params));

        let particles = [];
        let basins = [];
        let frameNoise = 0;
        let dragSpawnAccum = 0;

        function setup() {
            let c = createCanvas(1000, 1000);
            c.parent('canvas-container');
            initializeSystem();
            const loader = document.querySelector('.loading');
            if (loader) loader.style.display = 'none';
            background(10, 14, 26);
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            particles = [];
            basins = [];
            for (let i = 0; i < params.basinCount; i++) {
                basins.push({
                    x: random(width * 0.15, width * 0.85),
                    y: random(height * 0.15, height * 0.85),
                    r: random(40, 110),
                    drift: random(TWO_PI),
                    pull: random(0.6, 1.2)
                });
            }
            for (let i = 0; i < params.particleCount; i++) {
                spawnParticle();
            }
            background(10, 14, 26);
            frameNoise = 0;
        }

        function spawnParticle(ox, oy) {
            const x = ox !== undefined ? ox + random(-12, 12) : random(width);
            const y = oy !== undefined ? oy + random(-12, 12) : random(height);
            particles.push({
                x, y,
                vx: random(-0.4, 0.4),
                vy: random(-0.4, 0.4),
                age: 0,
                maxAge: random(180, 520),
                loss: random(0.05, 1.0),
                trail: []
            });
        }

        function draw() {
            // Trail fade
            noStroke();
            const fadeAlpha = map(params.trailPersist, 2, 50, 60, 6);
            fill(10, 14, 26, fadeAlpha);
            rect(0, 0, width, height);

            frameNoise += 0.005;

            // Draw soft basin halos
            for (const b of basins) {
                b.drift += 0.003;
                noStroke();
                for (let r = 5; r >= 1; r--) {
                    const alpha = 8 / r;
                    fill(34, 211, 238, alpha);
                    ellipse(b.x, b.y, b.r * (2.0 + r * 0.3));
                }
                // basin core
                fill(232, 121, 249, 30);
                ellipse(b.x, b.y, b.r * 0.5);
            }

            // Update particles
            const curlScale = 0.0035;
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                // Curl noise vector
                const n1 = noise(p.x * curlScale, p.y * curlScale, frameNoise);
                const n2 = noise(p.x * curlScale + 100, p.y * curlScale + 100, frameNoise);
                const ang = (n1 - 0.5) * TWO_PI * params.curl + (n2 - 0.5) * PI;
                let fx = cos(ang) * 0.45;
                let fy = sin(ang) * 0.45;

                // Basin attraction (modulated by reconstruction loss)
                const lossWeight = lerp(1.0, p.loss, params.lossBias); // high loss → less pulled
                let nearestD = 99999;
                let nearestB = null;
                for (const b of basins) {
                    const dx = b.x - p.x;
                    const dy = b.y - p.y;
                    const d = sqrt(dx*dx + dy*dy) + 0.001;
                    const f = (params.basinPull * b.pull) / (1 + d * 0.012) * (1.0 / lossWeight);
                    fx += (dx / d) * f;
                    fy += (dy / d) * f;
                    if (d < nearestD) { nearestD = d; nearestB = b; }
                }

                p.vx = p.vx * 0.94 + fx;
                p.vy = p.vy * 0.94 + fy;
                p.x += p.vx;
                p.y += p.vy;
                p.age++;

                // Loss decreases as particle stays near a basin (encoding consolidating)
                if (nearestD < 80) p.loss = max(0.05, p.loss - 0.004);
                else p.loss = min(1.0, p.loss + 0.001);

                // Color by reconstruction loss: low loss = cyan, high loss = magenta
                const lowLoss  = color(34, 211, 238);
                const highLoss = color(232, 121, 249);
                const cc = lerpColor(lowLoss, highLoss, constrain(p.loss, 0, 1));
                const speed = sqrt(p.vx*p.vx + p.vy*p.vy);
                const alpha = constrain(map(speed, 0, 3, 60, 220), 30, 220);
                stroke(red(cc), green(cc), blue(cc), alpha);
                strokeWeight(map(p.loss, 0, 1, 1.6, 0.6));
                point(p.x, p.y);
                // Bright leading dot
                noStroke();
                fill(red(cc), green(cc), blue(cc), 40);
                ellipse(p.x, p.y, 2.4);

                // Recycle
                if (p.age > p.maxAge || p.x < -20 || p.x > width + 20 || p.y < -20 || p.y > height + 20) {
                    particles.splice(i, 1);
                    spawnParticle();
                }
            }

            drawHUD();
        }

        function mouseDragged() {
            // Translate canvas coords
            const cx = (mouseX / width) * 1000;
            const cy = (mouseY / height) * 1000;
            if (cx < 0 || cy < 0 || cx > width || cy > height) return;
            dragSpawnAccum += 1;
            while (dragSpawnAccum >= 1) {
                dragSpawnAccum -= 1;
                if (particles.length < 5000) spawnParticle(cx, cy);
            }
        }

        function drawHUD() {
            push();
            noStroke();
            fill(15, 20, 36, 200);
            rect(20, 20, 280, 78, 8);
            fill(241, 245, 249);
            textFont('Courier New');
            textSize(12);
            text('FLUME · 256D LATENT (2D PROJECTION)', 36, 44);
            textSize(18);
            fill(34, 211, 238);
            text('flow particles: ' + particles.length, 36, 68);
            textSize(10);
            fill(176, 174, 165);
            text('basins ' + basins.length + ' · curl ' + params.curl.toFixed(2), 36, 90);
            pop();
        }

        // UI
        function updateParam(name, value) {
            const v = parseFloat(value);
            params[name] = v;
            const el = document.getElementById(name + '-value');
            if (el) {
                if (['particleCount','basinCount','trailPersist'].includes(name)) el.textContent = v.toString();
                else el.textContent = v.toFixed(2);
            }
            if (name === 'particleCount' || name === 'basinCount') initializeSystem();
        }
        function updateSeedDisplay() { document.getElementById('seed-input').value = params.seed; }
        function updateSeed() {
            const v = parseInt(document.getElementById('seed-input').value);
            if (!isNaN(v) && v > 0) { params.seed = v; initializeSystem(); } else updateSeedDisplay();
        }
        function previousSeed() { params.seed = Math.max(1, params.seed - 1); updateSeedDisplay(); initializeSystem(); }
        function nextSeed() { params.seed += 1; updateSeedDisplay(); initializeSystem(); }
        function randomSeedAndUpdate() { params.seed = Math.floor(Math.random()*999999)+1; updateSeedDisplay(); initializeSystem(); }
        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));
            ['particleCount','basinCount','basinPull','curl','trailPersist','lossBias'].forEach(k => {
                document.getElementById(k).value = params[k];
                document.getElementById(k+'-value').textContent =
                    ['particleCount','basinCount','trailPersist'].includes(k) ? params[k].toString() : params[k].toFixed(2);
            });
            updateSeedDisplay(); initializeSystem();
        }
        window.addEventListener('load', updateSeedDisplay);
    </script>
</body>
</html>
