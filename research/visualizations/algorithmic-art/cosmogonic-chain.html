<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmogonic Chain — 10-Step Symmetry Breaking</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413; --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5; --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757; --anthropic-blue: #6a9bcc; --anthropic-green: #788c5d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%); min-height: 100vh; color: var(--anthropic-dark); }
        .container { display: flex; min-height: 100vh; padding: 20px; gap: 20px; }
        .sidebar { width: 320px; flex-shrink: 0; background: rgba(255,255,255,0.95); padding: 24px; border-radius: 12px; box-shadow: 0 10px 30px rgba(20,20,19,0.1); overflow-y: auto; }
        .sidebar h1 { font-family: 'Lora', serif; font-size: 24px; font-weight: 500; margin-bottom: 8px; }
        .sidebar .subtitle { color: var(--anthropic-mid-gray); font-size: 14px; margin-bottom: 32px; line-height: 1.4; }
        .control-section { margin-bottom: 32px; }
        .control-section h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .control-section h3::before { content: '•'; color: var(--anthropic-orange); font-weight: bold; }
        .seed-input { width: 100%; background: var(--anthropic-light); padding: 12px; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 14px; margin-bottom: 12px; border: 1px solid var(--anthropic-light-gray); text-align: center; }
        .seed-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .control-group { margin-bottom: 20px; }
        .control-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; }
        .slider-container { display: flex; align-items: center; gap: 12px; }
        .slider-container input[type="range"] { flex: 1; height: 4px; background: var(--anthropic-light-gray); border-radius: 2px; outline: none; -webkit-appearance: none; }
        .slider-container input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: var(--anthropic-orange); border-radius: 50%; cursor: pointer; }
        .slider-container input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; background: var(--anthropic-orange); border-radius: 50%; border: none; cursor: pointer; }
        .value-display { font-family: 'Courier New', monospace; font-size: 12px; color: var(--anthropic-mid-gray); min-width: 60px; text-align: right; }
        .button { background: var(--anthropic-orange); color: white; border: none; padding: 10px 16px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; width: 100%; transition: all 0.2s ease; }
        .button:hover { background: #c86641; }
        .button.secondary { background: var(--anthropic-blue); }
        .button.tertiary { background: var(--anthropic-green); }
        .button-row { display: flex; gap: 8px; }
        .button-row .button { flex: 1; }
        .canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; }
        #canvas-container { width: 100%; max-width: 1000px; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 40px rgba(20,20,19,0.1); background: #0a0e1a; }
        #canvas-container canvas { display: block; width: 100% !important; height: auto !important; }
        .loading { display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--anthropic-mid-gray); min-height: 400px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Cosmogonic Chain</h1>
            <div class="subtitle">10 stages of symmetry breaking — from rotational unity to recursive structure.</div>

            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="42" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Stage (1–10)</label>
                    <div class="slider-container">
                        <input type="range" id="stage" min="1" max="10" step="1" value="1" oninput="updateParam('stage', this.value)">
                        <span class="value-display" id="stage-value">1</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Auto-Advance Speed</label>
                    <div class="slider-container">
                        <input type="range" id="autoSpeed" min="0" max="5" step="0.1" value="0.6" oninput="updateParam('autoSpeed', this.value)">
                        <span class="value-display" id="autoSpeed-value">0.60</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Detail / Recursion</label>
                    <div class="slider-container">
                        <input type="range" id="detail" min="2" max="8" step="1" value="5" oninput="updateParam('detail', this.value)">
                        <span class="value-display" id="detail-value">5</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Asymmetry</label>
                    <div class="slider-container">
                        <input type="range" id="asymmetry" min="0" max="1" step="0.01" value="0.35" oninput="updateParam('asymmetry', this.value)">
                        <span class="value-display" id="asymmetry-value">0.35</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">Reset</button>
                </div>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing cosmogonic chain…</div>
            </div>
        </div>
    </div>

    <script>
        let params = {
            seed: 42,
            stage: 1,
            autoSpeed: 0.6,
            detail: 5,
            asymmetry: 0.35
        };
        let defaultParams = JSON.parse(JSON.stringify(params));

        let stageFloat = 1;
        let stageNames = [
            "1 · Plenum (perfect rotational symmetry)",
            "2 · First polarity (axis emerges)",
            "3 · Trinity (3-fold breaking)",
            "4 · Cardinality (4-fold structure)",
            "5 · Pentad (golden ratio)",
            "6 · Lattice (hex tessellation)",
            "7 · Branching (L-system buds)",
            "8 · Voronoi territories",
            "9 · Recursive subdivision",
            "10 · Coherent multiplicity"
        ];

        function setup() {
            let c = createCanvas(1000, 1000);
            c.parent('canvas-container');
            initializeSystem();
            const loader = document.querySelector('.loading');
            if (loader) loader.style.display = 'none';
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            stageFloat = params.stage;
            background(10, 14, 26);
        }

        function draw() {
            background(10, 14, 26);

            // Auto-advance
            if (params.autoSpeed > 0) {
                stageFloat += params.autoSpeed * 0.005;
                if (stageFloat > 10.5) stageFloat = 1;
                params.stage = constrain(floor(stageFloat), 1, 10);
                document.getElementById('stage').value = params.stage;
                document.getElementById('stage-value').textContent = params.stage;
            }

            const cx = width / 2;
            const cy = height / 2;
            const interp = stageFloat - floor(stageFloat); // 0..1 within stage
            const stage = constrain(floor(stageFloat), 1, 10);

            push();
            translate(cx, cy);

            // We render the current stage and a fading echo of the previous one
            if (stage > 1) {
                push();
                drawingContext.globalAlpha = 1 - interp;
                renderStage(stage - 1);
                pop();
            }
            push();
            drawingContext.globalAlpha = stage === 1 ? 1 : interp * 0.95 + 0.05;
            renderStage(stage);
            pop();

            pop();

            drawHUD();
        }

        function renderStage(s) {
            const R = 360;
            const A = params.asymmetry;
            const D = params.detail;
            const breath = sin(frameCount * 0.012) * 8;

            switch (s) {
                case 1: { // Perfect circle
                    noFill();
                    stroke(34, 211, 238, 200);
                    strokeWeight(1.6);
                    ellipse(0, 0, (R + breath) * 2);
                    // central dot
                    noStroke();
                    fill(232, 121, 249, 220);
                    ellipse(0, 0, 6);
                    // soft outer halo
                    for (let i = 6; i >= 1; i--) {
                        noFill();
                        stroke(30, 58, 138, 18 / i);
                        strokeWeight(i * 1.5);
                        ellipse(0, 0, R * 2 + i * 12);
                    }
                    break;
                }
                case 2: { // Polarity — vesica piscis style
                    const off = R * 0.35 * (1 + A * 0.5);
                    noFill();
                    stroke(34, 211, 238, 180);
                    strokeWeight(1.4);
                    ellipse(-off, 0, R * 1.5, R * 1.5);
                    ellipse( off, 0, R * 1.5, R * 1.5);
                    stroke(232, 121, 249, 140);
                    strokeWeight(0.8);
                    line(0, -R, 0, R);
                    break;
                }
                case 3: { // Trinity
                    drawNgon(0, 0, R * 0.85, 3, frameCount * 0.003, 200, 1.6);
                    for (let k = 0; k < 3; k++) {
                        const a = k * TWO_PI / 3 + frameCount * 0.003;
                        const x = cos(a) * R * 0.45;
                        const y = sin(a) * R * 0.45;
                        drawNgon(x, y, R * 0.18, 3, -frameCount * 0.005, 130, 1.0);
                    }
                    break;
                }
                case 4: { // Cardinality - 4-fold
                    drawNgon(0, 0, R, 4, frameCount * 0.002, 220, 1.4);
                    drawNgon(0, 0, R * 0.7, 4, -frameCount * 0.003 + PI/4, 140, 1.0);
                    drawNgon(0, 0, R * 0.4, 4, frameCount * 0.005, 90, 0.8);
                    break;
                }
                case 5: { // Pentad / golden ratio
                    drawNgon(0, 0, R, 5, frameCount * 0.0015, 220, 1.6);
                    drawNgon(0, 0, R / 1.618, 5, -frameCount * 0.002 + PI/5, 160, 1.2);
                    drawNgon(0, 0, R / (1.618*1.618), 5, frameCount * 0.003, 110, 0.9);
                    // pentagram
                    stroke(232, 121, 249, 80);
                    strokeWeight(0.7);
                    noFill();
                    beginShape();
                    for (let i = 0; i < 5; i++) {
                        const a = (i * 4 / 5) * TWO_PI - HALF_PI;
                        vertex(cos(a) * R * 0.95, sin(a) * R * 0.95);
                    }
                    endShape(CLOSE);
                    break;
                }
                case 6: { // Hex lattice
                    const r = R * 0.18;
                    const dx = r * 1.732;
                    const dy = r * 1.5;
                    for (let yy = -3; yy <= 3; yy++) {
                        for (let xx = -3; xx <= 3; xx++) {
                            const ox = xx * dx + (yy % 2 ? dx / 2 : 0);
                            const oy = yy * dy;
                            if (sqrt(ox*ox + oy*oy) > R * 1.05) continue;
                            const fade = 1 - sqrt(ox*ox + oy*oy) / (R * 1.05);
                            drawNgon(ox, oy, r * (0.85 + 0.15 * fade), 6, 0, 60 + 140 * fade, 1.0);
                        }
                    }
                    break;
                }
                case 7: { // L-system branching
                    push();
                    translate(0, R * 0.95);
                    rotate(-HALF_PI);
                    branch(R * 0.85, D, A);
                    pop();
                    break;
                }
                case 8: { // Voronoi territories
                    voronoiCells(D * 6 + 12, R, A);
                    break;
                }
                case 9: { // Recursive subdivision
                    recursiveSquare(0, 0, R * 1.4, D, A);
                    break;
                }
                case 10: { // Coherent multiplicity
                    // Many smaller pentagons orbiting in coherent rings
                    for (let ring = 1; ring <= 3; ring++) {
                        const radius = R * 0.35 * ring;
                        const count = ring * 5;
                        for (let k = 0; k < count; k++) {
                            const a = k * TWO_PI / count + frameCount * 0.002 * (ring % 2 ? 1 : -1);
                            const x = cos(a) * radius;
                            const y = sin(a) * radius;
                            drawNgon(x, y, R * 0.06, 5, a, 180, 0.9);
                        }
                    }
                    // Central node
                    noStroke();
                    fill(232, 121, 249, 230);
                    ellipse(0, 0, 14);
                    // Faint background unity ring
                    noFill();
                    stroke(34, 211, 238, 30);
                    strokeWeight(0.6);
                    ellipse(0, 0, R * 2);
                    break;
                }
            }
        }

        function drawNgon(x, y, r, n, rot, alpha, weight) {
            push();
            translate(x, y);
            rotate(rot);
            noFill();
            // gradient stroke from base→glow
            const c = lerpColor(color(30, 58, 138, alpha), color(34, 211, 238, alpha), 0.6);
            stroke(red(c), green(c), blue(c), alpha);
            strokeWeight(weight);
            beginShape();
            for (let i = 0; i < n; i++) {
                const a = (i / n) * TWO_PI - HALF_PI;
                vertex(cos(a) * r, sin(a) * r);
            }
            endShape(CLOSE);
            pop();
        }

        function branch(len, depth, asym) {
            if (depth <= 0 || len < 4) {
                noStroke();
                fill(232, 121, 249, 200);
                ellipse(0, 0, 4);
                return;
            }
            stroke(34, 211, 238, 80 + depth * 18);
            strokeWeight(map(depth, 0, params.detail, 0.6, 2.4));
            line(0, 0, len, 0);
            push();
            translate(len, 0);
            // Right
            push();
            const aR = (random(0.18, 0.42)) + asym * random(-0.2, 0.2);
            rotate(aR);
            const lR = len * (0.62 + asym * random(-0.15, 0.15));
            branch(lR, depth - 1, asym);
            pop();
            // Left
            push();
            const aL = -(random(0.18, 0.42)) + asym * random(-0.2, 0.2);
            rotate(aL);
            const lL = len * (0.62 + asym * random(-0.15, 0.15));
            branch(lL, depth - 1, asym);
            pop();
            pop();
        }

        function voronoiCells(n, R, asym) {
            // Generate points (deterministic with current seed and frame-locked drift)
            randomSeed(params.seed + 999);
            const pts = [];
            for (let i = 0; i < n; i++) {
                const r = sqrt(random()) * R;
                const a = random(TWO_PI);
                pts.push([cos(a) * r + random(-asym * 30, asym * 30),
                          sin(a) * r + random(-asym * 30, asym * 30)]);
            }
            // Rasterize voronoi (low-res) by sampling pixels
            const samples = 110;
            const step = (R * 2) / samples;
            for (let yy = 0; yy < samples; yy++) {
                for (let xx = 0; xx < samples; xx++) {
                    const px = -R + xx * step + step / 2;
                    const py = -R + yy * step + step / 2;
                    if (px*px + py*py > R*R) continue;
                    // nearest point
                    let bestD = 99999, bestI = 0;
                    for (let i = 0; i < pts.length; i++) {
                        const dx = pts[i][0] - px;
                        const dy = pts[i][1] - py;
                        const d = dx*dx + dy*dy;
                        if (d < bestD) { bestD = d; bestI = i; }
                    }
                    const fade = bestI / pts.length;
                    const c = lerpColor(color(30, 58, 138), color(232, 121, 249), fade);
                    fill(red(c), green(c), blue(c), 70);
                    noStroke();
                    rect(px - step/2, py - step/2, step, step);
                }
            }
            // Cell centers as tiny dots
            noStroke();
            fill(34, 211, 238, 220);
            for (const p of pts) ellipse(p[0], p[1], 3);
        }

        function recursiveSquare(x, y, size, depth, asym) {
            if (depth <= 0 || size < 6) return;
            push();
            translate(x, y);
            noFill();
            stroke(34, 211, 238, 90 + depth * 14);
            strokeWeight(0.7);
            rectMode(CENTER);
            rect(0, 0, size, size);
            pop();
            const half = size / 2;
            const jitter = asym * size * 0.12;
            // Recurse into 4 quadrants probabilistically
            for (let i = 0; i < 4; i++) {
                if (depth > 1 && random() < 0.85) {
                    const ox = (i % 2 ? 1 : -1) * half / 2 + random(-jitter, jitter);
                    const oy = (i < 2 ? -1 : 1) * half / 2 + random(-jitter, jitter);
                    recursiveSquare(x + ox, y + oy, half * (0.75 + asym * 0.2), depth - 1, asym);
                }
            }
        }

        function drawHUD() {
            push();
            noStroke();
            fill(15, 20, 36, 220);
            rect(20, 20, 460, 78, 8);
            fill(241, 245, 249);
            textFont('Courier New');
            textSize(12);
            text('COSMOGONIC CHAIN · 10 STEPS', 36, 44);
            const stage = constrain(floor(stageFloat), 1, 10);
            textSize(15);
            fill(34, 211, 238);
            text(stageNames[stage - 1], 36, 70);
            textSize(10);
            fill(176, 174, 165);
            text('asymmetry ' + params.asymmetry.toFixed(2) + ' · detail ' + params.detail, 36, 90);
            pop();
        }

        // UI
        function updateParam(name, value) {
            const v = parseFloat(value);
            params[name] = v;
            const el = document.getElementById(name + '-value');
            if (el) {
                if (['stage','detail'].includes(name)) el.textContent = v.toString();
                else el.textContent = v.toFixed(2);
            }
            if (name === 'stage') stageFloat = v;
        }
        function updateSeedDisplay() { document.getElementById('seed-input').value = params.seed; }
        function updateSeed() {
            const v = parseInt(document.getElementById('seed-input').value);
            if (!isNaN(v) && v > 0) { params.seed = v; initializeSystem(); } else updateSeedDisplay();
        }
        function previousSeed() { params.seed = Math.max(1, params.seed - 1); updateSeedDisplay(); initializeSystem(); }
        function nextSeed() { params.seed += 1; updateSeedDisplay(); initializeSystem(); }
        function randomSeedAndUpdate() { params.seed = Math.floor(Math.random()*999999)+1; updateSeedDisplay(); initializeSystem(); }
        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));
            ['stage','autoSpeed','detail','asymmetry'].forEach(k => {
                document.getElementById(k).value = params[k];
                if (['stage','detail'].includes(k)) document.getElementById(k+'-value').textContent = params[k].toString();
                else document.getElementById(k+'-value').textContent = params[k].toFixed(2);
            });
            stageFloat = params.stage;
            updateSeedDisplay(); initializeSystem();
        }
        window.addEventListener('load', updateSeedDisplay);
    </script>
</body>
</html>
