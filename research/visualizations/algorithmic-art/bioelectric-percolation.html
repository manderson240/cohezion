<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bioelectric Percolation — HIHO Phase Transition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413; --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5; --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757; --anthropic-blue: #6a9bcc; --anthropic-green: #788c5d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%); min-height: 100vh; color: var(--anthropic-dark); }
        .container { display: flex; min-height: 100vh; padding: 20px; gap: 20px; }
        .sidebar { width: 320px; flex-shrink: 0; background: rgba(255,255,255,0.95); padding: 24px; border-radius: 12px; box-shadow: 0 10px 30px rgba(20,20,19,0.1); overflow-y: auto; }
        .sidebar h1 { font-family: 'Lora', serif; font-size: 24px; font-weight: 500; margin-bottom: 8px; }
        .sidebar .subtitle { color: var(--anthropic-mid-gray); font-size: 14px; margin-bottom: 32px; line-height: 1.4; }
        .control-section { margin-bottom: 32px; }
        .control-section h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .control-section h3::before { content: '•'; color: var(--anthropic-orange); font-weight: bold; }
        .seed-input { width: 100%; background: var(--anthropic-light); padding: 12px; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 14px; margin-bottom: 12px; border: 1px solid var(--anthropic-light-gray); text-align: center; }
        .seed-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .control-group { margin-bottom: 20px; }
        .control-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; }
        .slider-container { display: flex; align-items: center; gap: 12px; }
        .slider-container input[type="range"] { flex: 1; height: 4px; background: var(--anthropic-light-gray); border-radius: 2px; outline: none; -webkit-appearance: none; }
        .slider-container input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: var(--anthropic-orange); border-radius: 50%; cursor: pointer; }
        .slider-container input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; background: var(--anthropic-orange); border-radius: 50%; border: none; cursor: pointer; }
        .value-display { font-family: 'Courier New', monospace; font-size: 12px; color: var(--anthropic-mid-gray); min-width: 60px; text-align: right; }
        .button { background: var(--anthropic-orange); color: white; border: none; padding: 10px 16px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; width: 100%; transition: all 0.2s ease; }
        .button:hover { background: #c86641; }
        .button.secondary { background: var(--anthropic-blue); }
        .button.tertiary { background: var(--anthropic-green); }
        .button-row { display: flex; gap: 8px; }
        .button-row .button { flex: 1; }
        .canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; min-width: 0; }
        #canvas-container { width: 100%; max-width: 1000px; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 40px rgba(20,20,19,0.1); background: #0a0e1a; }
        #canvas-container canvas { display: block; width: 100% !important; height: auto !important; }
        .loading { display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--anthropic-mid-gray); min-height: 400px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Bioelectric Percolation</h1>
            <div class="subtitle">Levin's gap-junction lattice — voltage waves crossing the HIHO threshold at ~50% connectivity.</div>

            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="42" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Grid Resolution</label>
                    <div class="slider-container">
                        <input type="range" id="gridSize" min="40" max="120" step="10" value="80" oninput="updateParam('gridSize', this.value)">
                        <span class="value-display" id="gridSize-value">80</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Gap-Junction % (HIHO)</label>
                    <div class="slider-container">
                        <input type="range" id="hiho" min="0" max="100" step="1" value="48" oninput="updateParam('hiho', this.value)">
                        <span class="value-display" id="hiho-value">48</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Diffusion Rate</label>
                    <div class="slider-container">
                        <input type="range" id="diffusion" min="0.05" max="0.6" step="0.01" value="0.22" oninput="updateParam('diffusion', this.value)">
                        <span class="value-display" id="diffusion-value">0.22</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Pacemaker Rate</label>
                    <div class="slider-container">
                        <input type="range" id="pacemaker" min="0" max="0.05" step="0.001" value="0.012" oninput="updateParam('pacemaker', this.value)">
                        <span class="value-display" id="pacemaker-value">0.012</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Junction Flicker</label>
                    <div class="slider-container">
                        <input type="range" id="flicker" min="0" max="0.02" step="0.0005" value="0.004" oninput="updateParam('flicker', this.value)">
                        <span class="value-display" id="flicker-value">0.0040</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">Reset</button>
                </div>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing bioelectric lattice…</div>
            </div>
        </div>
    </div>

    <script>
        let params = {
            seed: 42,
            gridSize: 80,
            hiho: 48,
            diffusion: 0.22,
            pacemaker: 0.012,
            flicker: 0.004
        };
        let defaultParams = JSON.parse(JSON.stringify(params));

        let voltage = [];
        let voltageNext = [];
        let junctions = []; // 2D array of 4-bit arrays: [right, down, left, up] open?
        let cellSize = 12;
        let largestComponent = 0;
        let totalEdges = 0;
        let openEdges = 0;

        function setup() {
            let c = createCanvas(960, 960);
            c.parent('canvas-container');
            initializeSystem();
            const loader = document.querySelector('.loading');
            if (loader) loader.style.display = 'none';
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            const N = params.gridSize;
            cellSize = floor(width / N);
            voltage = [];
            voltageNext = [];
            junctions = [];
            for (let y = 0; y < N; y++) {
                voltage.push(new Array(N).fill(0));
                voltageNext.push(new Array(N).fill(0));
                const row = [];
                for (let x = 0; x < N; x++) {
                    // [right, down]: store unique edges only; left/up are derived from neighbors
                    row.push([
                        random() < params.hiho / 100,
                        random() < params.hiho / 100
                    ]);
                }
                junctions.push(row);
            }
            // Inject a few seed voltages
            for (let i = 0; i < 6; i++) {
                const x = floor(random(N));
                const y = floor(random(N));
                voltage[y][x] = random(0.6, 1.0);
            }
            recountEdges();
            background(10, 14, 26);
        }

        function recountEdges() {
            const N = params.gridSize;
            totalEdges = 0;
            openEdges = 0;
            for (let y = 0; y < N; y++) {
                for (let x = 0; x < N; x++) {
                    if (x < N - 1) { totalEdges++; if (junctions[y][x][0]) openEdges++; }
                    if (y < N - 1) { totalEdges++; if (junctions[y][x][1]) openEdges++; }
                }
            }
        }

        function draw() {
            const N = params.gridSize;
            const D = params.diffusion;

            // Stochastic junction flicker
            for (let y = 0; y < N; y++) {
                for (let x = 0; x < N; x++) {
                    for (let k = 0; k < 2; k++) {
                        if (random() < params.flicker) {
                            // bias toward target HIHO%
                            junctions[y][x][k] = random() < params.hiho / 100;
                        }
                    }
                }
            }

            // Pacemaker injection
            for (let i = 0; i < 3; i++) {
                if (random() < params.pacemaker * 25) {
                    const px = floor(random(N));
                    const py = floor(random(N));
                    voltage[py][px] = constrain(voltage[py][px] + random(0.3, 0.9), 0, 1);
                }
            }

            // Diffusion across open junctions only
            for (let y = 0; y < N; y++) {
                for (let x = 0; x < N; x++) {
                    let sum = 0;
                    let n = 0;
                    // right
                    if (x < N - 1 && junctions[y][x][0]) { sum += voltage[y][x+1] - voltage[y][x]; n++; }
                    // left (use neighbor's right edge)
                    if (x > 0 && junctions[y][x-1][0])   { sum += voltage[y][x-1] - voltage[y][x]; n++; }
                    // down
                    if (y < N - 1 && junctions[y][x][1]) { sum += voltage[y+1][x] - voltage[y][x]; n++; }
                    // up (neighbor's down edge)
                    if (y > 0 && junctions[y-1][x][1])   { sum += voltage[y-1][x] - voltage[y][x]; n++; }
                    let v = voltage[y][x] + D * sum;
                    // mild relaxation
                    v *= 0.997;
                    voltageNext[y][x] = constrain(v, 0, 1);
                }
            }
            // swap
            const tmp = voltage; voltage = voltageNext; voltageNext = tmp;

            // Draw cells
            background(10, 14, 26);
            noStroke();
            for (let y = 0; y < N; y++) {
                for (let x = 0; x < N; x++) {
                    const v = voltage[y][x];
                    if (v < 0.02) continue;
                    // Color: deep blue → cyan → magenta as voltage rises
                    let r, g, b;
                    if (v < 0.5) {
                        const t = v / 0.5;
                        r = lerp(30, 34, t);
                        g = lerp(58, 211, t);
                        b = lerp(138, 238, t);
                    } else {
                        const t = (v - 0.5) / 0.5;
                        r = lerp(34, 232, t);
                        g = lerp(211, 121, t);
                        b = lerp(238, 249, t);
                    }
                    fill(r, g, b, 200 * v + 30);
                    rect(x * cellSize, y * cellSize, cellSize, cellSize);
                }
            }

            // Draw open junctions as faint lines
            stroke(34, 211, 238, 24);
            strokeWeight(0.6);
            for (let y = 0; y < N; y++) {
                for (let x = 0; x < N; x++) {
                    if (junctions[y][x][0] && x < N - 1) {
                        line(x*cellSize + cellSize, y*cellSize + cellSize/2,
                             (x+1)*cellSize, y*cellSize + cellSize/2);
                    }
                    if (junctions[y][x][1] && y < N - 1) {
                        line(x*cellSize + cellSize/2, y*cellSize + cellSize,
                             x*cellSize + cellSize/2, (y+1)*cellSize);
                    }
                }
            }

            recountEdges();
            drawHUD();
        }

        function drawHUD() {
            push();
            noStroke();
            fill(15, 20, 36, 220);
            rect(20, 20, 320, 100, 8);
            fill(241, 245, 249);
            textFont('Courier New');
            textSize(12);
            text('BIOELECTRIC LATTICE · HIHO TRANSITION', 36, 44);
            const pct = totalEdges > 0 ? (openEdges / totalEdges) * 100 : 0;
            const aboveThreshold = pct >= 50;
            textSize(20);
            const cyan = color(34, 211, 238);
            const mag  = color(232, 121, 249);
            const cc = lerpColor(cyan, mag, constrain((pct - 30) / 40, 0, 1));
            fill(cc);
            text(pct.toFixed(1) + '% gap-junction', 36, 70);
            textSize(10);
            fill(176, 174, 165);
            text(aboveThreshold ? '◆ above HIHO threshold — wave-coherent' : '◇ subcritical — fragmented basins', 36, 90);
            textSize(9);
            fill(120, 140, 93);
            text('threshold @ 50% (Levin/Bednar)', 36, 108);
            pop();
        }

        // UI
        function updateParam(name, value) {
            const v = parseFloat(value);
            params[name] = v;
            const el = document.getElementById(name + '-value');
            if (el) {
                if (['gridSize','hiho'].includes(name)) el.textContent = v.toString();
                else if (name === 'flicker') el.textContent = v.toFixed(4);
                else el.textContent = v.toFixed(3);
            }
            if (name === 'gridSize') initializeSystem();
        }
        function updateSeedDisplay() { document.getElementById('seed-input').value = params.seed; }
        function updateSeed() {
            const v = parseInt(document.getElementById('seed-input').value);
            if (!isNaN(v) && v > 0) { params.seed = v; initializeSystem(); } else updateSeedDisplay();
        }
        function previousSeed() { params.seed = Math.max(1, params.seed - 1); updateSeedDisplay(); initializeSystem(); }
        function nextSeed() { params.seed += 1; updateSeedDisplay(); initializeSystem(); }
        function randomSeedAndUpdate() { params.seed = Math.floor(Math.random()*999999)+1; updateSeedDisplay(); initializeSystem(); }
        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));
            ['gridSize','hiho','diffusion','pacemaker','flicker'].forEach(k => {
                document.getElementById(k).value = params[k];
                if (['gridSize','hiho'].includes(k)) document.getElementById(k+'-value').textContent = params[k].toString();
                else if (k === 'flicker') document.getElementById(k+'-value').textContent = params[k].toFixed(4);
                else document.getElementById(k+'-value').textContent = params[k].toFixed(3);
            });
            updateSeedDisplay(); initializeSystem();
        }
        window.addEventListener('load', updateSeedDisplay);
    </script>
</body>
</html>
