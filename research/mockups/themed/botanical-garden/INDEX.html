<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Botanical Garden - Wave D2 Showcase</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Source+Serif+4:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f5f3ed; --fg:#1f2418; --accent:#4a7c59; --rule:#c8c0a8; }
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'Source Serif 4', 'Lora', Georgia, serif;}
  header{padding:24px 32px;border-bottom:1px solid var(--rule);}
  header h1{font-family:'Lora', 'Source Serif 4', Georgia, serif;margin:0 0 6px 0;font-size:28px;letter-spacing:0.04em;}
  header p{margin:0;color:var(--fg);opacity:0.7;font-size:13px;letter-spacing:0.06em;text-transform:uppercase;}
  main{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;padding:24px 32px;}
  .card{margin:0;border:1px solid var(--rule);background:var(--bg);}
  .card figcaption{display:flex;align-items:center;gap:14px;padding:8px 12px;border-bottom:1px solid var(--rule);font-size:11px;text-transform:uppercase;letter-spacing:0.18em;}
  .card figcaption .num{color:var(--accent);font-weight:700;}
  .card figcaption .title{flex:1;}
  .card figcaption a{color:var(--accent);text-decoration:none;border:1px solid var(--accent);padding:2px 8px;font-size:10px;}
  .card iframe{width:100%;height:520px;border:0;background:var(--bg);}
  footer{padding:18px 32px;border-top:1px solid var(--rule);font-size:11px;letter-spacing:0.18em;text-transform:uppercase;opacity:0.6;}
</style>
</head>
<body>
<header>
  <h1>Botanical Garden</h1>
  <p>Editorial · Cream + Fern + Marigold + Terracotta - Wave D2 mockup showcase</p>
</header>
<main>
        <figure class="card">
          <figcaption>
            <span class="num">01</span>
            <span class="title">cost router status</span>
            <a href="cost-router-status.html" target="_blank">open</a>
          </figcaption>
          <iframe src="cost-router-status.html" loading="lazy"></iframe>
        </figure>

        <figure class="card">
          <figcaption>
            <span class="num">02</span>
            <span class="title">journey tracker 12d</span>
            <a href="journey-tracker-12d.html" target="_blank">open</a>
          </figcaption>
          <iframe src="journey-tracker-12d.html" loading="lazy"></iframe>
        </figure>

        <figure class="card">
          <figcaption>
            <span class="num">03</span>
            <span class="title">swarm topology</span>
            <a href="swarm-topology.html" target="_blank">open</a>
          </figcaption>
          <iframe src="swarm-topology.html" loading="lazy"></iframe>
        </figure>

        <figure class="card">
          <figcaption>
            <span class="num">04</span>
            <span class="title">flume latent explorer</span>
            <a href="flume-latent-explorer.html" target="_blank">open</a>
          </figcaption>
          <iframe src="flume-latent-explorer.html" loading="lazy"></iframe>
        </figure>

        <figure class="card">
          <figcaption>
            <span class="num">05</span>
            <span class="title">compound loop traces</span>
            <a href="compound-loop-traces.html" target="_blank">open</a>
          </figcaption>
          <iframe src="compound-loop-traces.html" loading="lazy"></iframe>
        </figure>
        </main>
<footer>cohezion / themed showcase / botanical-garden</footer>
</body></html>
