function makeTransitions(n=50) {
  const out = []; let t = new Date();
  let cur = STATES[0];
  for (let i=0;i<n;i++) {
    const nxt = STATES[Math.floor(Math.random()*STATES.length)];
    const ts = new Date(t.getTime() - i*4711 - Math.floor(Math.random()*1500));
    const dur = 14 + Math.floor(Math.random()*1240);
    const dCoh = (Math.random()*0.18 - 0.09);
    out.push({
      ts: ts.toISOString().slice(11,23),
      from: cur, to: nxt, dur, dCoh,
      ok: Math.random() > 0.06
    });
    cur = nxt;
  }
  return out;
}

/* 12-axis radar — pure SVG */
function Radar({ dims }) {
  const cx = 180, cy = 180, R = 140;
  const N = dims.length;
  const pt = (i, r) => {
    const a = (Math.PI*2 * i)/N - Math.PI/2;
    return [cx + Math.cos(a)*r, cy + Math.sin(a)*r];
  };
  const ringPaths = [0.25, 0.5, 0.75, 1.0].map((r, idx) => {
    const d = dims.map((_,i) => {
      const [x,y] = pt(i, R*r);
      return (i===0?"M":"L") + x.toFixed(1) + "," + y.toFixed(1);
    }).join(" ") + " Z";
    return <path key={idx} d={d} className="radar-bg" strokeWidth={r===1?1.2:0.6} />;
  });
  const axes = dims.map((_,i) => {
    const [x,y] = pt(i, R);
    return <line key={i} x1={cx} y1={cy} x2={x} y2={y} className="radar-axis" />;
  });
  const valuePoly = dims.map((d,i) => {
    const [x,y] = pt(i, R*d.v);
    return (i===0?"M":"L") + x.toFixed(1) + "," + y.toFixed(1);
  }).join(" ") + " Z";
  const targetPoly = dims.map((d,i) => {
    const [x,y] = pt(i, R*d.target);
    return (i===0?"M":"L") + x.toFixed(1) + "," + y.toFixed(1);
  }).join(" ") + " Z";
  const labels = dims.map((d,i) => {
    const [lx,ly] = pt(i, R+18);
    const [vx,vy] = pt(i, R*d.v);
    const ta = lx > cx+2 ? "start" : lx < cx-2 ? "end" : "middle";
    return (
      <g key={i}>
        <text x={lx} y={ly} textAnchor={ta} dy="0.32em" className="radar-label">{d.k}</text>
        <text x={lx} y={ly+10} textAnchor={ta} dy="0.32em" className="radar-value num">{d.v.toFixed(2)}</text>
        <circle cx={vx} cy={vy} r="2.5" fill="var(--cyan)" />
      </g>
    );
  });
  return (
    <svg viewBox="0 0 360 360" width="100%" height="360">
      {ringPaths}
      {axes}
      <path d={targetPoly} className="radar-target" />
      <path d={valuePoly} className="radar-poly" />
      {labels}
      <circle cx={cx} cy={cy} r="2" fill="var(--ink-3)" />
      <text x={cx} y={cy+22} textAnchor="middle" className="radar-label">12D NOW</text>
    </svg>
  );
}

              <div className="text-[9px] uppercase tracking-widest text-[color:var(--ink-4)]">LAST QUERY</div>
              <div className="text-[color:var(--green)] glow-green">{SURREAL.lastQueryMs} ms</div>
              <div className="text-[color:var(--ink-4)] text-[9px]">at {SURREAL.lastQueryAt}</div>
            </div>
            <div className="border hairline p-2" style={{background:"var(--bg-2)"}}>
              <div className="text-[9px] uppercase tracking-widest text-[color:var(--ink-4)]">RPS · PEND</div>
              <div className="text-[color:var(--ink)]">{SURREAL.rps.toFixed(1)} · {SURREAL.pending}</div>
            </div>
            <div className="col-span-2 border hairline p-2" style={{background:"var(--bg-2)"}}>
              <div className="text-[9px] uppercase tracking-widest text-[color:var(--ink-4)]">SCHEMA</div>
              <div className="text-[color:var(--ink)]">{SURREAL.schema}</div>
              <div className="text-[9px] mt-1">
                <span className="text-[color:var(--ink-4)]">hash-chain head </span>
                <span className="text-[color:var(--magenta)] glow-magenta">{SURREAL.hashChain}</span>
              </div>
            </div>
          </div>
        </Panel>

        {/* J.04 — COHERENCE TREND */}
        <Panel
          tag="J.04"
          title="COHERENCE TRACE · 200 TICKS"
          right={<><span>HIHO RIDGE 0.50</span></>}
          className="col-span-8"
        >
          <div style={{height:200}}>
            <ResponsiveContainer width="100%" height="100%">
              <AreaChart data={COHERENCE} margin={{top:6,right:8,left:0,bottom:0}}>
                <defs>
                  <linearGradient id="cohgrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor="var(--cyan)" stopOpacity={0.45}/>
                    <stop offset="100%" stopColor="var(--cyan)" stopOpacity={0}/>
                  </linearGradient>
                </defs>
                <XAxis dataKey="i" hide />
                <YAxis domain={[0,1]} tick={{fill:"#6e7787", fontSize:9}} axisLine={{stroke:"#20283a"}} tickLine={false} width={28} />
                <ReferenceLine y={0.5} stroke="var(--amber)" strokeDasharray="3 3" label={{ value:"HIHO 0.50", position:"insideTopRight", fill:"var(--amber)", fontSize:9 }}/>
                <Area dataKey="c" stroke="var(--cyan)" strokeWidth={1.4} fill="url(#cohgrad)" isAnimationActive={false}/>
                <Tooltip contentStyle={{background:"#0b0d10", border:"1px solid #20283a", fontSize:10}} />
              </AreaChart>
            </ResponsiveContainer>
          </div>
          <div className="mt-2 grid grid-cols-4 gap-2 text-[10px] num">
            <div className="border hairline p-2" style={{background:"var(--bg-2)"}}>
              <div className="text-[9px] uppercase tracking-widest text-[color:var(--ink-4)]">MEAN</div>
              <div className="text-[color:var(--ink)]">{meanCoh.toFixed(3)}</div>
            </div>
            <div className="border hairline p-2" style={{background:"var(--bg-2)"}}>
              <div className="text-[9px] uppercase tracking-widest text-[color:var(--ink-4)]">MIN · MAX</div>
              <div className="text-[color:var(--ink)]">
                {Math.min(...COHERENCE.map(c=>c.c)).toFixed(3)} · {Math.max(...COHERENCE.map(c=>c.c)).toFixed(3)}
              </div>
            </div>
            <div className="border hairline p-2" style={{background:"var(--bg-2)"}}>
              <div className="text-[9px] uppercase tracking-widest text-[color:var(--ink-4)]">% ABOVE 0.50</div>
              <div className="text-[color:var(--green)]">
                {(COHERENCE.filter(c=>c.c>=0.5).length/COHERENCE.length*100).toFixed(1)}%
              </div>
            </div>
            <div className="border hairline p-2" style={{background:"var(--bg-2)"}}>
              <div className="text-[9px] uppercase tracking-widest text-[color:var(--ink-4)]">VOL σ</div>
              <div className="text-[color:var(--amber)]">0.087</div>
            </div>
          </div>
        </Panel>

        {/* J.05 — CHECKPOINTS */}
        <Panel
          tag="J.05"
          title="CHECKPOINTS · ROLLBACK READY"
          right={<><span>n={CHECKPOINTS.length}</span></>}
          className="col-span-4"
        >
          <div className="text-[10px]">
            <div className="grid grid-cols-12 gap-1 px-1 pb-1 border-b hairline-soft text-[color:var(--ink-4)] uppercase tracking-widest text-[9px]">
              <div className="col-span-3">CKPT</div>
              <div className="col-span-3">AGENT</div>
              <div className="col-span-2 text-right">COH</div>
              <div className="col-span-2 text-right">SIZE</div>
              <div className="col-span-2 text-right">ACT</div>
            </div>
            <div className="max-h-[290px] overflow-y-auto">
              {CHECKPOINTS.map(c => {
                const sel = c.id === selectedCkpt;
                return (
                  <div
                    key={c.id}
                    onClick={()=>setSelectedCkpt(c.id)}
                    className={"row-stripe grid grid-cols-12 gap-1 px-1 py-1 num cursor-pointer " + (sel ? "outline outline-1 outline-[color:var(--cyan)]" : "")}
                  >
                    <div className="col-span-3 text-[color:var(--cyan)] truncate">{c.id}</div>
                    <div className="col-span-3 text-[color:var(--ink-2)] truncate">{c.agent}</div>
                    <div className={"col-span-2 text-right " + (c.coh >= 0.5 ? "text-[color:var(--green)]" : "text-[color:var(--amber)]")}>
                      {c.coh.toFixed(2)}
                    </div>
                    <div className="col-span-2 text-right text-[color:var(--ink-3)]">{c.size}</div>
                    <div className="col-span-2 text-right">
                      <button className="text-[9px] px-1 py-[1px] border hairline text-[color:var(--magenta)] hover:bg-[color:var(--bg-3)] uppercase tracking-widest">
                        rb
                      </button>
                    </div>
                  </div>
                );
              })}
            </div>
            <div className="mt-2 border hairline p-2 text-[10px]" style={{background:"var(--bg-2)"}}>
              <div className="text-[9px] uppercase tracking-widest text-[color:var(--ink-4)]">SELECTED</div>
              <div className="text-[color:var(--cyan)]">{selectedCkpt}</div>
              <div className="text-[9px] text-[color:var(--ink-3)] mt-1">
                {CHECKPOINTS.find(c=>c.id===selectedCkpt)?.reason}
                <span className="text-[color:var(--ink-4)]"> · ts </span>
                {CHECKPOINTS.find(c=>c.id===selectedCkpt)?.ts}
              </div>
            </div>
          </div>
        </Panel>

        {/* J.06 — TRANSITIONS */}
        <Panel
          tag="J.06"
          title="STATE TRANSITIONS · LAST 50"
          right={<><span>WINDOW 4m12s</span></>}
          className="col-span-12"
        >
          <div className="text-[10px] num">
            <div className="grid grid-cols-12 gap-2 px-2 pb-1 border-b hairline-soft text-[color:var(--ink-4)] uppercase tracking-widest text-[9px]">
              <div className="col-span-2">TIME</div>
              <div className="col-span-2">FROM</div>
              <div className="col-span-1 text-center">→</div>
              <div className="col-span-2">TO</div>
              <div className="col-span-2 text-right">DUR µs</div>
              <div className="col-span-2 text-right">ΔCOH</div>
              <div className="col-span-1 text-right">OK</div>
            </div>
            <div className="max-h-[260px] overflow-y-auto">
              {TRANSITIONS.map((t,i) => (
                <div key={i} className="row-stripe grid grid-cols-12 gap-2 px-2 py-[3px]">
                  <div className="col-span-2 text-[color:var(--ink-3)]">{t.ts}</div>
                  <div className="col-span-2 text-[color:var(--ink-2)]">{t.from}</div>
                  <div className="col-span-1 text-center text-[color:var(--cyan)]">→</div>
                  <div className="col-span-2 text-[color:var(--ink)]">{t.to}</div>
                  <div className="col-span-2 text-right text-[color:var(--ink-2)]">{t.dur.toLocaleString()}</div>
                  <div className={"col-span-2 text-right " + (t.dCoh >= 0 ? "text-[color:var(--green)]" : "text-[color:var(--amber)]")}>
                    {t.dCoh >= 0 ? "+" : ""}{t.dCoh.toFixed(3)}
                  </div>
                  <div className="col-span-1 text-right">
                    {t.ok
                      ? <span className="text-[color:var(--green)] glow-green">●</span>
                      : <span className="text-[color:var(--red)] glow-red">●</span>}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </Panel>

      </main>

      <footer className="px-4 mt-3 pt-2 border-t hairline text-[9px] uppercase tracking-[0.22em] text-[color:var(--ink-4)] flex justify-between">
        <div>cohezion.journey · 12d-tracker · build {now.toISOString().slice(0,10).replace(/-/g,"")}.0307</div>
        <div>shift+? help · g+r goto radar · g+t goto transitions · g+c goto checkpoints · esc clear</div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
