<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1440" />
  <title>SWARM TOPOLOGY // OPS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700;800&family=Major+Mono+Display&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>

  <style>
    :root {
      --bg-0:#07080a; --bg-1:#0b0d10; --bg-2:#0f1216; --bg-3:#131822;
      --grid:#1a1f2a; --rule:#20283a; --rule-soft:#141a25;
      --ink:#e7ecf3; --ink-2:#aab3c2; --ink-3:#6e7787; --ink-4:#4a5260;
      --cyan:#5cf2e8; --cyan-dim:#2db6ad;
      --amber:#f5b53c; --amber-dim:#b07b14;
      --magenta:#ff4fbf; --magenta-dim:#b62a85;
      --red:#ff5d5d; --green:#5cff9e; --violet:#9f7bff;
    }
    html, body {
      background: var(--bg-0); color: var(--ink);
      font-family: 'JetBrains Mono', ui-monospace, 'Geist Mono', monospace;
      font-feature-settings: "tnum","ss01","ss02","ss03","cv02","cv11";
      -webkit-font-smoothing: antialiased; letter-spacing: 0.01em;
    }
    body::before {
      content:""; position:fixed; inset:0; pointer-events:none;
      background: repeating-linear-gradient(to bottom,
        rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px,
        transparent 1px, transparent 3px);
      mix-blend-mode: overlay; z-index:60;
    }
    body::after {
      content:""; position:fixed; inset:0; pointer-events:none;
      background:
        radial-gradient(ellipse 90% 60% at 50% 110%, rgba(0,0,0,0.55), transparent 60%),
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0,0,0,0.40), transparent 60%);
      z-index:59;
    }
    .display { font-family:'Major Mono Display','JetBrains Mono',monospace; letter-spacing:0.06em; }
    .mono { font-family:'JetBrains Mono',monospace; }
    .panel {
      background: var(--bg-1); border: 1px solid var(--rule);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.012), 0 0 0 1px rgba(0,0,0,0.4);
    }
    .panel-hd {
      display:flex; align-items:center; justify-content:space-between;
      padding:6px 10px;
      background: linear-gradient(180deg,#0e131c 0%,#0a0e15 100%);
      border-bottom:1px solid var(--rule);
      font-size:10px; text-transform:uppercase; letter-spacing:0.18em; color:var(--ink-2);
    }
    .panel-hd .tag { color:var(--cyan); font-weight:700; }
    .panel-bd { padding:10px; }
    .row-stripe:nth-child(odd) { background: rgba(255,255,255,0.012); }
    .row-stripe:hover { background: rgba(92,242,232,0.06); }
    .dot { width:7px; height:7px; display:inline-block; }
    .dot.green { background:var(--green); box-shadow:0 0 6px rgba(92,255,158,0.7); }
    .dot.amber { background:var(--amber); box-shadow:0 0 6px rgba(245,181,60,0.7); }
    .dot.red   { background:var(--red);   box-shadow:0 0 6px rgba(255,93,93,0.7); }
    .blink { animation: blink 1.6s steps(2,end) infinite; }
    @keyframes blink { 50% { opacity:0.25; } }
    .pulse-dot {
      width:6px; height:6px; background:var(--cyan);
      box-shadow:0 0 0 0 rgba(92,242,232,0.6);
      animation: pulse 1.6s ease-out infinite;
    }
    @keyframes pulse {
      0%   { box-shadow:0 0 0 0 rgba(92,242,232,0.55); }
      80%  { box-shadow:0 0 0 8px rgba(92,242,232,0); }
      100% { box-shadow:0 0 0 0 rgba(92,242,232,0); }
    }
    .ticker { mask-image: linear-gradient(to right, transparent, #000 8%, #000 92%, transparent); }
    *::-webkit-scrollbar { width:8px; height:8px; }
    *::-webkit-scrollbar-thumb { background:#1d2533; border:1px solid var(--rule); }
    *::-webkit-scrollbar-track { background:transparent; }
    .glow-cyan    { text-shadow:0 0 10px rgba(92,242,232,0.45); }
    .glow-amber   { text-shadow:0 0 10px rgba(245,181,60,0.40); }
    .glow-magenta { text-shadow:0 0 10px rgba(255,79,191,0.40); }
    .glow-red     { text-shadow:0 0 10px rgba(255,93,93,0.45); }
    .glow-green   { text-shadow:0 0 10px rgba(92,255,158,0.40); }
    .hairline { border-color: var(--rule); }
    .hairline-soft { border-color: var(--rule-soft); }
    .sep::before { content:"·"; color:var(--ink-4); margin:0 14px; }
    .num { font-variant-numeric: tabular-nums; }
    .marquee { display:inline-block; white-space:nowrap; animation: marquee 60s linear infinite; }
    @keyframes marquee { from { transform:translateX(0); } to { transform:translateX(-50%); } }
    .bar-track { height:4px; background:#0a0d12; border:1px solid var(--rule); position:relative; overflow:hidden; }
    .bar-fill { height:100%; }

    /* swarm-specific SVG styles */
    .cluster-bg {
      fill: rgba(92,242,232,0.025);
      stroke: var(--rule);
      stroke-dasharray: 3 3;
    }
    .cluster-bg.amber { fill: rgba(245,181,60,0.025); }
    .cluster-bg.magenta { fill: rgba(255,79,191,0.030); }
    .cluster-bg.violet { fill: rgba(159,123,255,0.030); }
    .cluster-label {
      fill: var(--ink-3);
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .agent-node {
      cursor: pointer;
    }
    .agent-node circle.shell {
      fill: var(--bg-2);
      stroke: var(--rule);
      stroke-width: 1;
    }
    .agent-node.selected circle.shell {
      stroke: var(--cyan);
      stroke-width: 1.6;
      filter: drop-shadow(0 0 4px var(--cyan));
    }
    .agent-label {
      fill: var(--ink);
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      text-anchor: middle;
    }
    .agent-role {
      fill: var(--ink-3);
      font-family: 'JetBrains Mono', monospace;
      font-size: 8px;
      text-anchor: middle;
      letter-spacing: 0.1em;
    }
    .edge {
      stroke: var(--rule);
      stroke-width: 0.8;
      fill: none;
    }
    .edge.active {
      stroke: var(--cyan);
      stroke-width: 1.2;
      stroke-dasharray: 4 4;
      animation: dashflow 1.2s linear infinite;
      opacity: 0.85;
    }
    .edge.active.amber { stroke: var(--amber); }
    .edge.active.magenta { stroke: var(--magenta); }
    @keyframes dashflow {
      from { stroke-dashoffset: 0; }
      to   { stroke-dashoffset: -16; }
    }
  </style>
</head>
<body class="min-h-screen">

<div id="root"></div>

<script type="text/babel" data-presets="env,react">

    { ts:"00:00:14.218", from:"cs-01",  body:"opus-4-7 route accepted, latency 3.2s, $0.084" },

  const [selectedId, setSelectedId] = useState("pc-01");

    const id = setInterval(()=>setNow(new Date()), 1000);
    return ()=>clearInterval(id);

  const sel = idxAgent(selectedId) || AGENTS[0];

  const totalQueue = AGENTS.reduce((s,a)=>s+a.queue,0);
  const totalCost  = AGENTS.reduce((s,a)=>s+a.cost,0);
  const meanSucc   = AGENTS.reduce((s,a)=>s+a.success,0)/AGENTS.length;
  const activeEdges = EDGES.filter(e=>e.active).length;
  const msgPerMin = 312;
  const avgLat = 184;

  return (
    <div className="min-h-screen pb-3">
      {/* TOP BAR */}

              <span className="pulse-dot" />

          </div>
          <div className="flex items-center text-[11px] num">

            <span className="sep" />
            <span><span className="text-[color:var(--ink-3)] mr-2">MSG/MIN</span><span className="text-[color:var(--cyan)] glow-cyan">{msgPerMin}</span></span>
            <span className="sep" />
            <span><span className="text-[color:var(--ink-3)] mr-2">AVG LAT</span>{avgLat}ms</span>
            <span className="sep" />
            <span><span className="text-[color:var(--ink-3)] mr-2">UTC</span>{tsLabel}<span className="blink text-[color:var(--cyan)]">_</span></span>
          </div>
        </div>
        <div className="border-t hairline-soft px-2 py-[3px] text-[10px] text-[color:var(--ink-3)] ticker overflow-hidden">
          <div className="marquee">
            <span className="mr-10"><span className="text-[color:var(--ink-4)]">PROTOCOLS</span> MCP ✓  A2A ✓  AG-UI ✓  A2UI ✓</span>
            <span className="mr-10"><span className="text-[color:var(--ink-4)]">CLUSTERS</span> vault · platform · mcp · data · coord  →  5 cluster groupings</span>
            <span className="mr-10"><span className="text-[color:var(--ink-4)]">FANOUT</span> max-degree pc-01 (8 edges) · isolation 0 nodes</span>
            <span className="mr-10"><span className="text-[color:var(--ink-4)]">SLO</span>  msg p99 &lt; 400ms · queue depth &lt; 12 per agent</span>
            <span className="mr-10"><span className="text-[color:var(--ink-4)]">PROTOCOLS</span> MCP ✓  A2A ✓  AG-UI ✓  A2UI ✓</span>
            <span className="mr-10"><span className="text-[color:var(--ink-4)]">CLUSTERS</span> vault · platform · mcp · data · coord  →  5 cluster groupings</span>
            <span className="mr-10"><span className="text-[color:var(--ink-4)]">FANOUT</span> max-degree pc-01 (8 edges) · isolation 0 nodes</span>
            <span className="mr-10"><span className="text-[color:var(--ink-4)]">SLO</span>  msg p99 &lt; 400ms · queue depth &lt; 12 per agent</span>
          </div>
        </div>
      </header>

      <main className="px-3 pt-3 grid grid-cols-12 gap-3">

        {/* S.01 — TOPOLOGY CANVAS */}
        <Panel
          tag="S.01"
          title="TOPOLOGY · LIVE"
          right={<><span>{activeEdges} ACTIVE EDGES</span><span className="text-[color:var(--ink-4)]">/</span><span>{EDGES.length} TOTAL</span></>}
          className="col-span-9"
        >
          <div className="border hairline" style={{background:"radial-gradient(circle at 50% 50%, var(--bg-2), var(--bg-1))"}}>
            <svg viewBox="0 0 1280 600" width="100%" height="600">
              {/* clusters */}

                <g key={c.id}>
                  <rect
                    x={c.x} y={c.y} width={c.w} height={c.h}
                    className={`cluster-bg ${c.color}`}
                  />
                  <text x={c.x+8} y={c.y+16} className="cluster-label">{c.label}</text>
                  <text x={c.x+c.w-8} y={c.y+16} textAnchor="end" className="cluster-label">
                    n={AGENTS.filter(a=>ROLES[a.role].cluster===c.id).length}
                  </text>
                </g>
              ))}

              {/* edges */}
              {EDGES.map((e,i) => {
                const A = idxAgent(e.a), B = idxAgent(e.b);
                if (!A||!B) return null;
                const cls = "edge" + (e.active ? " active" : "") + (e.color ? " "+e.color : "");
                return <line key={i} x1={A.x} y1={A.y} x2={B.x} y2={B.y} className={cls}/>;
              })}

              {/* nodes */}
              {AGENTS.map(a => {
                const role = ROLES[a.role];
                const isSel = a.id === selectedId;
                return (
                  <g key={a.id} className={"agent-node " + (isSel ? "selected" : "")} onClick={()=>setSelectedId(a.id)}>
                    <circle className="shell" cx={a.x} cy={a.y} r="22"/>

                    <text className="agent-role"  x={a.x} y={a.y+9} fill={role.color}>{role.label}</text>

                        <rect x={a.x+14} y={a.y-26} width="20" height="10" fill="var(--bg-1)" stroke={role.color} strokeWidth="0.6"/>

                {role.replace("-specialist","").replace("-coordinator","-coord")}
              </div>

        </Panel>

        {/* S.02 — INSPECTOR */}

        >
          <div className="border hairline p-2 mb-2" style={{background:"var(--bg-2)"}}>
            <div className="text-[9px] uppercase tracking-widest text-[color:var(--ink-4)]">AGENT</div>
            <div className="text-[color:var(--cyan)] glow-cyan text-[12px] num">{sel.id}</div>
            <div className="text-[10px] text-[color:var(--ink-2)]">{sel.name}</div>
            <div className="text-[9px] uppercase tracking-widest text-[color:var(--ink-3)] mt-1">
              role <span className="text-[color:var(--ink)] ml-2">{sel.role}</span>
            </div>
          </div>

          <div className="grid grid-cols-3 gap-2 text-[10px] num">
            <div className="border hairline p-2" style={{background:"var(--bg-2)"}}>
              <div className="text-[9px] uppercase tracking-widest text-[color:var(--ink-4)]">QUEUE</div>
              <div className={"text-[16px] " + (sel.queue > 6 ? "text-[color:var(--amber)] glow-amber" : "text-[color:var(--cyan)] glow-cyan")}>
                {sel.queue}
              </div>
            </div>
            <div className="border hairline p-2" style={{background:"var(--bg-2)"}}>
              <div className="text-[9px] uppercase tracking-widest text-[color:var(--ink-4)]">COST $</div>
              <div className="text-[16px] text-[color:var(--ink)]">{sel.cost.toFixed(2)}</div>
            </div>
            <div className="border hairline p-2" style={{background:"var(--bg-2)"}}>
              <div className="text-[9px] uppercase tracking-widest text-[color:var(--ink-4)]">SUCC %</div>
              <div className={"text-[16px] " + (sel.success >= 0.97 ? "text-[color:var(--green)] glow-green" : "text-[color:var(--amber)]")}>
                {(sel.success*100).toFixed(1)}
              </div>
            </div>
          </div>

          <div className="mt-3 text-[9px] uppercase tracking-widest text-[color:var(--ink-4)]">LAST TASK</div>
          <div className="text-[10px] text-[color:var(--ink)]">{sel.lastTask}</div>

          <div className="mt-3 text-[9px] uppercase tracking-widest text-[color:var(--ink-4)] mb-1">LAST 5 MESSAGES</div>
          <div className="text-[10px] num space-y-[3px]">
            {(MESSAGES[sel.id] || []).map((m,i) => (
              <div key={i} className="row-stripe px-1 py-1 border-b hairline-soft">
                <div className="flex justify-between text-[9px]">
                  <span className="text-[color:var(--cyan)]">{m.ts}</span>
                  <span className="text-[color:var(--ink-4)]">from {m.from}</span>
                </div>
                <div className="text-[color:var(--ink-2)]">{m.body}</div>
              </div>
            ))}
            {!MESSAGES[sel.id] && (
              <div className="text-[color:var(--ink-4)] italic">no recent messages for this agent</div>
            )}
          </div>
        </Panel>

        {/* S.03 — AGENT METRICS TABLE */}
        <Panel
          tag="S.03"
          title="AGENT METRICS · ALL"
          right={<><span>n={AGENTS.length}</span><span className="text-[color:var(--ink-4)]">/</span><span>Σ queue {totalQueue}</span><span className="text-[color:var(--ink-4)]">/</span><span>Σ ${totalCost.toFixed(2)}</span></>}
          className="col-span-12"
        >
          <div className="text-[10px] num">
            <div className="grid grid-cols-12 gap-2 px-2 pb-1 border-b hairline-soft text-[color:var(--ink-4)] uppercase tracking-widest text-[9px]">
              <div className="col-span-1">ID</div>
              <div className="col-span-3">NAME</div>
              <div className="col-span-2">ROLE</div>
              <div className="col-span-2">LAST TASK</div>
              <div className="col-span-1 text-right">QUEUE</div>
              <div className="col-span-1 text-right">COST $</div>
              <div className="col-span-1 text-right">SUCC %</div>
              <div className="col-span-1 text-right">UTIL</div>
            </div>
            {AGENTS.map(a => {
              const role = ROLES[a.role];
              const util = Math.min(1, a.queue/12);
              return (
                <div
                  key={a.id}
                  onClick={()=>setSelectedId(a.id)}
                  className={"row-stripe grid grid-cols-12 gap-2 px-2 py-1 cursor-pointer " + (a.id === selectedId ? "outline outline-1 outline-[color:var(--cyan)]" : "")}
                >
                  <div className="col-span-1 text-[color:var(--cyan)]">{a.id}</div>
                  <div className="col-span-3 text-[color:var(--ink-2)] truncate">{a.name}</div>
                  <div className="col-span-2" style={{color: role.color}}>{a.role}</div>
                  <div className="col-span-2 text-[color:var(--ink-3)] truncate">{a.lastTask}</div>
                  <div className={"col-span-1 text-right " + (a.queue > 6 ? "text-[color:var(--amber)]" : "text-[color:var(--ink)]")}>
                    {a.queue}
                  </div>
                  <div className="col-span-1 text-right text-[color:var(--ink)]">
                    {a.cost === 0
                      ? <span className="text-[color:var(--green)]">0.00</span>
                      : a.cost.toFixed(2)}
                  </div>
                  <div className={"col-span-1 text-right " + (a.success >= 0.97 ? "text-[color:var(--green)]" : "text-[color:var(--amber)]")}>
                    {(a.success*100).toFixed(1)}
                  </div>
                  <div className="col-span-1">
                    <div className="bar-track mt-1">
                      <div className="bar-fill" style={{width:`${util*100}%`, background: util > 0.6 ? "var(--amber)" : "var(--cyan)"}}/>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>

          <div className="mt-2 grid grid-cols-4 gap-2 text-[10px] num">
            <div className="border hairline p-2" style={{background:"var(--bg-2)"}}>
              <div className="text-[9px] uppercase tracking-widest text-[color:var(--ink-4)]">MEAN SUCC</div>
              <div className="text-[color:var(--green)] glow-green">{(meanSucc*100).toFixed(2)}%</div>
            </div>
            <div className="border hairline p-2" style={{background:"var(--bg-2)"}}>
              <div className="text-[9px] uppercase tracking-widest text-[color:var(--ink-4)]">TOTAL COST</div>
              <div className="text-[color:var(--ink)]">${totalCost.toFixed(2)}</div>
            </div>
            <div className="border hairline p-2" style={{background:"var(--bg-2)"}}>
              <div className="text-[9px] uppercase tracking-widest text-[color:var(--ink-4)]">QUEUE Σ</div>
              <div className="text-[color:var(--ink)]">{totalQueue}</div>
            </div>
            <div className="border hairline p-2" style={{background:"var(--bg-2)"}}>
              <div className="text-[9px] uppercase tracking-widest text-[color:var(--ink-4)]">EDGES ACTIVE</div>
              <div className="text-[color:var(--cyan)] glow-cyan">{activeEdges} / {EDGES.length}</div>
            </div>
          </div>
        </Panel>

      </main>

      <footer className="px-4 mt-3 pt-2 border-t hairline text-[9px] uppercase tracking-[0.22em] text-[color:var(--ink-4)] flex justify-between">
        <div>cohezion.swarm · topology · build {now.toISOString().slice(0,10).replace(/-/g,"")}.0419</div>
        <div>shift+? help · click node inspect · g+t goto topology · g+m goto metrics · esc clear</div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
