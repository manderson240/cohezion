# Skill Trigger Test Suites
# Following Anthropic's testing methodology from "The Complete Guide to Building Skills for Claude"
# Each skill has should_trigger, should_not_trigger, and paraphrased trigger phrases.
# Target: 90% trigger accuracy on should_trigger phrases.
#
# Usage: These test cases can be used manually (ask Claude each phrase and check
# if the skill loads) or programmatically via the Skills API evaluation suite.

---

- skill: compound-engineering
  description: >
    Compound AI orchestration methodology for multi-agent coordination,
    local model optimization, and hallucination mitigation.
  should_trigger:
    - "Help me set up a compound engineering pipeline"
    - "Debug coherence drift in the executor"
    - "Configure the skill refinement loop"
    - "How does the compound impact score work?"
    - "Set up model routing for the orchestration loop"
  should_not_trigger:
    - "What's the weather in San Francisco?"
    - "Write a hello world in Python"
    - "Create a database migration"
    - "Help me with CSS styling"
    - "What time is it?"
  paraphrased:
    - "I need to configure multi-agent orchestration"
    - "The compound loop isn't refining skills correctly"
    - "How do I improve my compound impact metrics?"

- skill: testing
  description: >
    Python testing methodology with pytest patterns, fixture design,
    parametrization, and adversarial security testing.
  should_trigger:
    - "Help me write pytest fixtures for this module"
    - "My tests pass individually but fail in the full suite"
    - "Set up test isolation for the conftest"
    - "How do I mock at source for Ollama calls?"
    - "Add parametrized tests for the validator"
  should_not_trigger:
    - "Deploy the application to production"
    - "Create a new React component"
    - "What's the best database for this use case?"
    - "Help me write a marketing email"
    - "Optimize the CSS for mobile"
  paraphrased:
    - "I need to debug flaky tests in the test suite"
    - "How should I structure my test fixtures?"
    - "The singleton pollution is causing test failures"

- skill: security-guardrails
  description: >
    AI security guardrail implementation including input validation,
    rate limiting, authentication, and prompt injection defense.
  should_trigger:
    - "Implement prompt injection defense for user inputs"
    - "Set up rate limiting for the API endpoints"
    - "Add authentication to the MCP server"
    - "Review the OWASP LLM Top 10 compliance"
    - "Configure audit logging for security events"
  should_not_trigger:
    - "Help me optimize database queries"
    - "Create a new data visualization"
    - "Write unit tests for the calculator"
    - "Set up a CI/CD pipeline"
    - "Design a new feature for the dashboard"
  paraphrased:
    - "We need to protect against malicious prompts"
    - "How do I add credential rotation to the system?"
    - "The security audit flagged missing input validation"

- skill: flume-methodology
  description: >
    FLUME implementation for thought vector compression, trajectory
    prediction, and semantic interpolation.
  should_trigger:
    - "Encode this text into the FLUME latent space"
    - "Predict the thought trajectory for this concept"
    - "Interpolate between these two ideas in z-space"
    - "Train the FLUME VAE on the new dataset"
    - "How does semantic arithmetic work in FLUME?"
  should_not_trigger:
    - "Help me set up a REST API"
    - "Write a SQL query for user analytics"
    - "Create a new React component"
    - "Debug the authentication flow"
    - "Optimize the Docker build"
  paraphrased:
    - "I need to compress these thoughts into vectors"
    - "How do I navigate the latent manifold?"
    - "The trajectory predictor is giving wrong results"

- skill: token-efficiency
  description: >
    Token consumption tracking, analysis, and optimization across the
    agent swarm with batching, caching, and adaptive model selection.
  should_trigger:
    - "Analyze token waste across the swarm agents"
    - "The cache hit rate is below 30 percent"
    - "Set up token budgets for each agent"
    - "Which model should I downgrade to save tokens?"
    - "Optimize the context pruning strategy"
  should_not_trigger:
    - "Help me write a new feature"
    - "Create a database schema"
    - "Deploy to Cloud Run"
    - "Write documentation for the API"
    - "Fix the broken CSS layout"
  paraphrased:
    - "We're spending too many tokens on simple tasks"
    - "How do I improve the semantic cache performance?"
    - "The token budget is being exceeded every session"
