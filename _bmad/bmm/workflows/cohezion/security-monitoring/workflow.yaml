name: security-monitoring
description: Automated Security Monitoring with Cohezion
version: 1.0.0
trigger:
  schedule: "0 8 * * *"
  on_demand: true
steps:
  - name: daily-security-check
    agent: security-monitor
    command: /security-check
    timeout: 300
  - name: analyze-results
    agent: security-monitor
    command: /analyze-results
    condition: alerts_found
  - name: update-documentation
    agent: documentation-curator
    command: /update-security-docs
    parallel: true

