[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cohezion"
version = "1.0.2"
description = "Training environments, evaluation systems, and ML infrastructure for agentic AI operating in simulated universes"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Mike Anderson", email = "manderson240@users.noreply.github.com"},
]
keywords = [
    "agentic-ai",
    "training-environments",
    "reinforcement-learning",
    "universe-simulation",
    "multi-agent",
    "evaluation",
    "latent-space",
    "variational-autoencoder",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "psutil>=5.9.0",
    "surrealdb>=0.3.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "anthropic>=0.7.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",
    "pandas>=3.0.0",
    "matplotlib>=3.10.8",
    "datasets>=4.5.0",
    "docker>=7.1.0",
    "python-jose>=3.5.0",
    "gymnasium>=1.2.3",
    "passlib[bcrypt]>=1.7.4",
    "redis>=7.2.1",
    "aiohttp>=3.13.3",
    "fastmcp>=3.1.0",
]

[project.urls]
Repository = "https://github.com/manderson240/cohezion"
Issues = "https://github.com/manderson240/cohezion/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
    "mypy>=1.5.0",
    "black>=23.0",
    "flake8>=6.0",
    "pandas>=2.0.0",
    "docker>=7.0.0",
    "python-jose>=3.3.0",
    "gymnasium>=0.29.0",
    "datasets>=2.14.0",
    "passlib>=1.7.4",
]
ml = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88

# Linting configuration
[tool.ruff.lint]
# Enable comprehensive rule set
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "S",     # flake8-bandit (security)
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # Ruff-specific rules
]

ignore = [
    # Add specific rules to ignore here if needed after initial run
]

# Per-file customization
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",  # Allow assert in tests
    "S105",  # Allow hardcoded passwords in tests
    "S106",  # Allow hardcoded passwords in tests
]
"bmad/scripts/**/*.py" = [
    "S101",  # Allow assert in scripts
]

# Import sorting configuration
[tool.ruff.lint.isort]
known-first-party = ["bmad"]
force-single-line = false
lines-after-imports = 2

# Formatter configuration (replaces Black)
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Type checking with mypy
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start permissive, can tighten later
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

# Per-module options
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
