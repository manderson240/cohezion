[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cohezion"
version = "1.0.2"
description = "Training environments, evaluation systems, and ML infrastructure for agentic AI operating in simulated universes"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Mike Anderson", email = "manderson240@users.noreply.github.com"},
]
keywords = [
    "agentic-ai",
    "training-environments",
    "reinforcement-learning",
    "universe-simulation",
    "multi-agent",
    "evaluation",
    "latent-space",
    "variational-autoencoder",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "psutil>=5.9.0",
    "surrealdb>=0.3.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "anthropic>=0.7.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",
    "pandas>=3.0.0",
    "matplotlib>=3.10.8",
    "datasets>=4.5.0",
    "docker>=7.1.0",
    "gymnasium>=1.2.3",
    "passlib[bcrypt]>=1.7.4",
    "redis>=7.2.1",
    "aiohttp>=3.13.3",
    "fastmcp>=3.1.0",
    "pyjwt>=2.11.0",
    "kagglehub>=1.0.0",
]

[project.urls]
Repository = "https://github.com/manderson240/cohezion"
Issues = "https://github.com/manderson240/cohezion/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.8.0",
    "mypy>=1.5.0",
    "black>=23.0",
    "flake8>=6.0",
]
ml = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
]
agentjet = [
    "aiohttp>=3.9",
]
unsloth = [
    "unsloth",
]

[tool.ruff]
target-version = "py313"
line-length = 100  # Extended from 88 to accommodate f-strings and comprehensions (Retrospective Session 14)

# Linting configuration
[tool.ruff.lint]
# Enable comprehensive rule set
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "S",     # flake8-bandit (security)
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # Ruff-specific rules
]

ignore = [
    # --- Style / formatting (not worth manual fixes) ---
    "E501",    # line-too-long (244 instances; line-length=100 handles most)
    "E402",    # module-import-not-at-top (12; often intentional conditional imports)
    "E741",    # ambiguous-variable-name (1; context-dependent)

    # --- Naming conventions (project uses non-PEP8 names intentionally) ---
    "N806",    # non-lowercase-variable-in-function (18; matrix vars, constants)
    "N812",    # lowercase-imported-as-non-lowercase (4)
    "N814",    # camelcase-imported-as-constant (2)
    "N815",    # mixed-case-variable-in-class-scope (1)

    # --- Security: needs human audit (S-rules suppressed, not deleted) ---
    "S102",    # exec-builtin (2)
    "S104",    # hardcoded-bind-all-interfaces (42; 0.0.0.0 in dev servers)
    "S107",    # hardcoded-password-default (4)
    "S108",    # hardcoded-temp-file (17)
    "S110",    # try-except-pass (19)
    "S112",    # try-except-continue (8)
    "S311",    # suspicious-non-cryptographic-random-usage (55)
    "S324",    # hashlib-insecure-hash-function (1)
    "S602",    # subprocess-popen-with-shell-equals-true (2)
    "S603",    # subprocess-without-shell-equals-true (68)
    "S606",    # start-process-with-no-shell (1)
    "S607",    # start-process-with-partial-path (95)
    "S608",    # hardcoded-sql-expression (25)
    "S101",    # assert (1; used for runtime validation in rl_framework)

    # --- Bugbear / simplify (low-risk, not blocking) ---
    "B007",    # unused-loop-control-variable (4)
    "B008",    # function-call-in-default-argument (1)
    "B904",    # raise-without-from-inside-except (14; nice-to-have)
    "A001",    # builtin-variable-shadowing (1)
    "A002",    # builtin-argument-shadowing (10; e.g., type, id params)
    "SIM102",  # collapsible-if (23; style preference)
    "SIM103",  # needless-bool (4)
    "SIM105",  # suppressible-exception (3)
    "SIM108",  # if-else-block-instead-of-if-exp (5)
    "SIM115",  # open-file-with-context-handler (5)
    "SIM116",  # if-else-block-instead-of-dict-lookup (2)
    "SIM117",  # multiple-with-statements (6)

    # --- Type-checking imports (unsafe-fixes break Pydantic/dataclass/mock patterns) ---
    "TC001",   # typing-only-first-party-import (unsafe-fix moves runtime-needed imports)
    "TC003",   # typing-only-standard-library-import (Path used in Pydantic/dataclass at runtime)

    # --- Ruff-specific (project conventions) ---
    "RUF001",  # ambiguous-unicode-character-string (1)
    "RUF002",  # ambiguous-unicode-character-docstring (40; em-dashes, arrows)
    "RUF003",  # ambiguous-unicode-character-comment (45; em-dashes, arrows)
    "RUF006",  # asyncio-dangling-task (13; intentional fire-and-forget)
    "RUF012",  # mutable-class-default (88; Pydantic/dataclass fields)
    "RUF034",  # useless-if-else (2)
]

# Per-file customization
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # Allow assert in tests
    "S105",   # Allow hardcoded passwords in tests
    "S106",   # Allow hardcoded passwords in tests
    "S113",   # request-without-timeout (2; test mocks)
    "B017",   # assert-raises-exception (8; broad exception catches in tests)
    "B018",   # useless-expression (2; test assertions)
    "B023",   # function-uses-loop-variable (3; test parametrization)
    "F401",   # unused-import (2; test fixtures)
    "RUF043", # pytest-raises-ambiguous-pattern (4)
    "RUF059", # unused-unpacked-variable (4; tuple unpacking in tests)
]
# Import sorting configuration
[tool.ruff.lint.isort]
known-first-party = ["cohezion"]
force-single-line = false
lines-after-imports = 2

# Formatter configuration (replaces Black)
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Type checking with mypy
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start permissive, can tighten later
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

# Per-module options
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "fast: Fast unit tests (<1s each, no live services)",
    "integration: Integration tests (require live services like Ollama/SurrealDB)",
    "mcp: MCP server tests (require vault access)",
]
