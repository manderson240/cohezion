[project]
name = "cohezion"
version = "0.1.0"
description = "Agentic AI framework"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "arxiv>=2.4.0",
    "datasets>=4.5.0",
    "fastapi>=0.128.0",
    "gkeepapi>=0.17.1",
    "google-api-python-client>=2.188.0",
    "google-auth-oauthlib>=1.2.4",
    "httpx>=0.28.1",
    "huggingface-hub>=0.36.0",
    "langgraph>=1.0.6",
    "marimo>=0.19.4",
    "matplotlib>=3.10.8",
    "mcp>=1.25.0",
    "mem0ai>=1.0.2",
    "numpy>=2.4.1",
    "openreview-py>=1.54.7",
    "pandas>=2.3.3",
    "passlib[bcrypt]>=1.7.4",
    "prometheus-client>=0.24.1",
    "psutil>=7.2.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "python-jose[cryptography]>=3.5.0",
    "requests>=2.32.5",
    "rich>=14.2.0",
    "scikit-learn>=1.8.0",
    "slowapi>=0.1.9",
    "surrealdb>=1.0.8",
    "torch>=2.9.1",
    "tqdm>=4.67.1",
    "transformers>=4.57.6",
    "tweepy>=4.16.0",
    "youtube-transcript-api>=1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This tells Hatchling exactly where your source code lives
packages = ["src/cohezion"]

[tool.uv]
package = true

[tool.ruff]
line-length = 88
target-version = "py313"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.13",
]
