[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cohezion"
version = "1.16.0"
description = "Compound AI orchestration: a self-improving skill loop, physics-grounded 12D training environments, and $0 local inference on AMD silicon"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "AGPL-3.0-or-later"}
authors = [
    {name = "Mike Anderson", email = "manderson240@users.noreply.github.com"},
]
keywords = [
    "agentic-ai",
    "training-environments",
    "reinforcement-learning",
    "universe-simulation",
    "multi-agent",
    "evaluation",
    "latent-space",
    "variational-autoencoder",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "psutil>=5.9.0",
    "surrealdb>=0.3.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "anthropic>=0.7.0",
    "amd-gaia>=0.21.1",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",
    "pandas>=3.0.0",
    "matplotlib>=3.10.8",
    "datasets>=4.5.0",
    "docker>=7.1.0",
    "gymnasium>=1.2.3",
    "passlib[bcrypt]>=1.7.4",
    "redis>=7.2.1",
    "aiohttp>=3.13.3",
    "fastmcp>=3.1.0",
    "pyjwt>=2.11.0",
    "kaggle>=1.6.17",
    "kagglehub>=1.0.0",
    "bluequbit>=0.18.5b1",
    "qiskit>=1.0.0",
    "python-dotenv>=1.0.0",
    "pocket-tts>=0.1.0",
    "torch>=2.8.0,<3.0.0",
    "structlog>=25.5.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "arc-agi>=0.0.7",
    "torchvision>=0.23.0",
    "google-adk>=1.28.1",
    "polars>=1.39.3",
    "aiofiles>=25.1.0",
    "marimo>=0.23.16",
    "peft>=0.20.0",
    "trl>=0.23.0",
    "plotly>=5.0",  # reconcile 2026-08-26: flume/poincare_manifold_visualizer imports it at module top
]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.3"
explicit = true

# CPU wheels do NOT come from PyPI -- they come from here. The previous comment
# in this block asserted "torch and torchvision resolve from PyPI (CPU wheels)
# by default for CI", and that is false: PyPI's default Linux torch wheel is the
# CUDA build. `uv.lock` resolved torch 2.13.0 from PyPI, whose linux deps are
# cuda-bindings, cuda-toolkit[cublas,cudart,cufft,cufile,cupti,curand,cusolver,
# cusparse,nvjitlink,nvrtc,nvtx], nvidia-cudnn-cu13, nvidia-cusparselt-cu13,
# nvidia-nccl-cu13, nvidia-nvshmem-cu13 and triton -- ~4.6 GB of libraries that
# cannot execute on this machine, which has no NVIDIA GPU.
#
# That cost was paid on EVERY self-hosted CI run and EVERY new worktree, and on
# 2026-08-30 it took the pool from 4.7 GB free to 0 and the filesystem
# read-only. The mapping below is what makes the old comment's intent true.
#
# torch-2.13.0+cpu-cp313-cp313-manylinux_2_28_x86_64 is the SAME version the
# lock already resolved, so this removes the CUDA payload without changing the
# torch version.
#
# History: commit 32c242386 ("fix(ci): Python 3.13->3.11 alignment") removed a
# working `torch==2.8.0+rocm6.3` pin plus the torch/torchvision/torchaudio index
# mappings as collateral in a CI-alignment PR, and left the false comment behind.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Local AMD dev still installs ROCm torch explicitly, which overrides this:
#   uv pip install torch==2.8.0+rocm6.3 torchvision==0.23.0+rocm6.3 \
#     --index-url https://download.pytorch.org/whl/rocm6.3
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
pytorch-triton-rocm = { index = "pytorch-rocm" }
# cloud-vault-mcp = { path = "cloud-vault-mcp", editable = true }  # Optional: install manually with `uv pip install -e ./cloud-vault-mcp`

[project.urls]
Homepage = "https://github.com/manderson240/cohezion"
Repository = "https://github.com/manderson240/cohezion"
Documentation = "https://github.com/manderson240/cohezion/tree/main/docs"
Changelog = "https://github.com/manderson240/cohezion/blob/main/CHANGELOG.md"
Issues = "https://github.com/manderson240/cohezion/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist[psutil]>=3.0.0",
    "ruff>=0.8.0",
    "mypy>=1.5.0",
    "black>=23.0",
    "flake8>=6.0",
    "respx>=0.23.0",  # WS2B: HTTP mocking for the four lane tests
    "optuna>=3.6",  # FLUME-VAE hyperparameter tuning (flume/optuna_tuner.py), local $0
]
ml = [
    "torch>=2.0.0",
    "transformers>=4.30.0",
]
# RL training extras — `make train` / `make benchmark` (scripts/train_manifold_agent.py)
rl = [
    "stable-baselines3>=2.3.0",
]
agentjet = [
    "aiohttp>=3.9",
]
# Operator cockpit — marimo reactive notebook (scripts/cockpit.py) over
# cohezion.cockpit.daemon_state. Optional: keeps the runtime lean.
cockpit = [
    "marimo>=0.23",
]
audio = [
    "librosa>=0.10.0",
    "torchaudio>=2.0.0",
    "soundfile>=0.12.0",
]
unsloth = [
    "unsloth",
]
# mem0: LLM-extracted conversational memory layer (add/search/consolidate facts).
# Complements SemanticCache/SurrealDB/JourneyTracker — does NOT replace them.
# Wired local-first to Lemonade (OpenAI-compatible) via cohezion.memory.mem0_adapter.
memory = [
    "mem0ai>=2.0.0",
]
# ROCm-specific packages for AMD GPU acceleration (Strix Halo, MI300X, etc).
# CI uses plain CPU torch from PyPI; local AMD dev installs ROCm torch via:
#   uv pip install torch==2.8.0+rocm6.3 torchvision==0.23.0+rocm6.3 \
#     --index-url https://download.pytorch.org/whl/rocm6.3
# Then: uv sync --frozen --extra dev --extra rocm
# pytorch-triton-rocm has no CPU counterpart so it lives only here.
rocm = [
    "pytorch-triton-rocm==3.4.0 ; sys_platform == 'linux'",
]

[tool.ruff]
target-version = "py311"
line-length = 100  # Extended from 88 to accommodate f-strings and comprehensions (Retrospective Session 14)
exclude = [
    ".archives",
    "archives",
    "src/cohezion-archive",  # archived/legacy code — not actively maintained
    "*.ipynb",
    ".claude/worktrees",  # agent worktree copies — not source of truth
    ".gemini/worktrees",
    ".worktrees",
    "archives",
    "cloud-vault-mcp",
    ".pi",
    ".tmp_kaggle",
    # These three are bash scripts (#!/bin/bash) mislabeled with a .py extension;
    # ruff parses them as Python -> invalid-syntax, which broke the repo_health
    # enforcement tests. Correct fix is renaming to .sh, but scripts/ is currently a
    # read-only bind mount so the rename can't be staged here — exclude until then.
    "scripts/update_handoff_prompt.py",
    "scripts/update_handoff_stt.py",
    "scripts/dedupe_next_moves.py",
]

# Linting configuration
[tool.ruff.lint]
# Enable comprehensive rule set
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "S",     # flake8-bandit (security)
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # Ruff-specific rules
]

ignore = [
    # Style/cosmetic — not bugs, suppress to reduce noise
    "E501",    # Line too long (already at 100-char limit; long lines in ML/physics code are common)
    "RUF002",  # Docstring ambiguous unicode chars (em-dashes etc. are intentional)
    "RUF003",  # Comment ambiguous unicode chars (same)
    "RUF012",  # Mutable ClassVar not annotated with ClassVar[T] — defer to mypy for class-level typing
    # Naming conventions — ML/math/physics code uses uppercase per convention
    "N806",    # Variable in function should be lowercase (M, K, N, D — matrix dims)
    "N803",    # Argument name should be lowercase (same)
    "N802",    # Function name should be lowercase (V, dV, H, T — physics potential/Hamiltonian)
    # Patterns intentional in this codebase
    "B905",    # zip() without strict= — ML code pairs equal-length sequences by design; strict=True would change behavior
    "S311",    # Standard pseudo-random generators — acceptable for non-security use (simulation, routing, tests)
    "S603",    # subprocess without shell=False — internal scripts use known executables, not user input
    "S607",    # Partial executable path — all subprocess calls use known binaries (git, python, uv, etc.)
    "S108",    # Probable use of insecure /tmp — acceptable in development tooling, scripts, test fixtures
    # Type-checking import guards — defer to mypy; not adding IF TYPE_CHECKING blocks codebase-wide
    "TC001",   # First-party imports in type annotations outside TYPE_CHECKING block
    "TC003",   # Standard library imports in type annotations outside TYPE_CHECKING block
    # SurrealQL uses parameterized record IDs (plan:{slug}, node:{id}) — not user-controlled SQL
    "S608",    # Possible SQL injection via string-based query construction (SurrealQL, not SQL)
    # asyncio fire-and-forget — background tasks in compound executor are intentionally untracked
    "RUF006",  # Store return value of asyncio.create_task/ensure_future
    # 0.0.0.0 binding is intentional for containerized deployments (host configured externally)
    "S104",    # Binding to all network interfaces
    # ML/PyTorch import aliases — torch.nn.functional as F is universal PyTorch convention
    "N812",    # Lowercase module imported as non-lowercase alias (functional as F, etc.)
    # Ambiguous single-char variable names — ML loops use l (loss), O (output), I (identity)
    "E741",    # Ambiguous variable name (l, O, I) — standard in ML/linear algebra notation
    # try-except-pass → contextlib.suppress: patterns are intentional signal suppression in compound executor
    "S110",    # try-except-pass (use contextlib.suppress instead)
    # Unicode chars in string bodies — already ignoring in docstrings (RUF002) and comments (RUF003)
    "RUF001",  # String contains ambiguous unicode character (em-dashes, arrows intentional)
    # Third-party TYPE_CHECKING imports — defer to mypy; already ignoring TC001/TC003 for same reason
    "TC002",   # Third-party import in TYPE_CHECKING block
]

# Per-file customization
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",  # Allow assert in tests
    "S105",  # Allow hardcoded passwords in tests
    "S106",  # Allow hardcoded passwords in tests
    "N806",  # Math/ML tests use uppercase for matrix dims (M, K, N) — standard notation
    "S607",  # Partial executable paths acceptable in test subprocesses
    "E402",  # Guard imports (try/except) after module-level code allowed in tests
    "N813",  # Camelcase imported as lowercase — intentional in wiring identity tests (pkg_ledger, pkg_driver)
]
"src/cohezion/traceability/plan_graph.py" = [
    "S608",  # SurrealQL uses record ID interpolation (plan:{slug}), not user input
]
"scripts/**/*.py" = [
    "E501",  # Research scripts use intentionally verbose description strings
]
"scripts/cockpit.py" = [
    "E501",  # verbose markdown/f-strings in notebook cells
    "B018",  # marimo cells render UI via bare expressions (refresh/button) — idiomatic
]
"examples/**/*.py" = [
    "E501",  # Demonstrator scripts use intentionally verbose evidence f-strings
]
# Import sorting configuration
[tool.ruff.lint.isort]
known-first-party = ["cohezion"]
force-single-line = false
lines-after-imports = 2

# Formatter configuration (replaces Black)
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Astral uv package resolution configuration
[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "mypy>=1.15.0",
    "ruff>=0.9.0",
    "marimo>=0.11.0",
    "plotly>=6.0.0",
]

# Type checking with mypy
[tool.mypy]
# Must match the project floor (requires-python >= 3.13). At 3.11 mypy rejects
# numpy's stubs -- "Type statement is only supported in Python 3.12 and greater"
# -- and aborts with "errors prevented further checking" BEFORE reading any
# project file, so the gate silently checked nothing.
python_version = "3.13"
# Skill ASSET directories whose names contain hyphens. A hyphen is not legal in
# a Python identifier, so these paths can never be imported as modules; mypy
# refuses the ENTIRE run over them ("... is not a valid Python package name"),
# which is the second reason this gate was dark.
#
# STRUCTURAL, not an enumeration: matches any path component under skills/ that
# contains a hyphen. Listing today's three directories would mean the next
# hyphenated skill dir re-aborts the whole run and reds every open PR until
# someone hand-extends this line -- and the obvious "fix" then is to widen it to
# all of skills/, which silently drops 15 importable modules
# (cohezion.skills.cohezion_mcp, mcp_paths, mcp_tool_definitions, ...).
# A hyphenated component is never importable, so this loses nothing.
# scripts/ci/mypy_ratchet.py independently refuses a baseline whose file count
# shrank, so a widened exclude cannot be locked in even by accident.
exclude = "src/cohezion/skills/([^/]+/)*[^/]*-[^/]*/"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start permissive, can tighten later
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

# Per-module options
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Surreal strict-wave 1 (polish/sigma-surreal-strict-mypy, 2026-05-12):
# genesis_persistence.py and storage/surreal_client.py are now fully strict-clean.
# The following 3 modules have pre-existing errors that need a separate sprint:
# - core.persistence.surreal_client: complex type issues + SurrealClient.search_similar missing
# - mcp.surreal_server: SurrealClient.search_similar missing (potential real bug)
# - persistence.surreal_logger: surrealdb Value type mismatch
[[tool.mypy.overrides]]
module = [
    "cohezion.core.persistence.surreal_client",
    "cohezion.mcp.surreal_server",
    "cohezion.persistence.surreal_logger",
]
ignore_errors = true

# Strict carve-out: files that pass `mypy --strict` cleanly.
# Wave 2E (synthetic-sniffing-panda): pin these so they don't regress.
# To add a file: `uv run mypy --strict <file> --ignore-missing-imports` must report Success.
# NOTE: Use individual flag names instead of `strict = true` here -
# `strict = true` in overrides leaks settings to all modules in mypy < 1.10.
[[tool.mypy.overrides]]
module = [
    "cohezion.security.vault",
    "cohezion.integrations.agentverse.bridge",
    "cohezion.compound.routing_feedback_loop",
    "cohezion.compound.inflection_detector",
    "cohezion.compound.persistence.vault",
    "cohezion.agents.version_tracker",
    "cohezion.observability.metrics_analytics",
]
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "strict"
addopts = "-v"
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
    "ignore::pytest.PytestCollectionWarning",
]
markers = [
    "fast: Fast unit tests (<1s each, no live services)",
    "integration: Integration tests (require live services like Ollama/SurrealDB)",
    "mcp: MCP server tests (require vault access)",
    "unit: Unit tests (no external dependencies)",
    "sandbox: Sandbox isolation tests",
    "timeout: Test timeout in seconds",
    "slow: Long-running tests (>30s)",
    "benchmark: Performance benchmark tests",
    "agent: Agent-specific orchestration tests",
    "backend: Backend/target-specific tests",
    "compound: Compound engineering tests",
    "e2e: End-to-end integration tests",
    "api: API endpoint tests",
]
