[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cohezion"
version = "1.0.2"
description = "Training environments, evaluation systems, and ML infrastructure for agentic AI operating in simulated universes"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
authors = [
    {name = "Mike Anderson", email = "manderson240@users.noreply.github.com"},
]
keywords = [
    "agentic-ai",
    "training-environments",
    "reinforcement-learning",
    "universe-simulation",
    "multi-agent",
    "evaluation",
    "latent-space",
    "variational-autoencoder",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "psutil>=5.9.0",
    "surrealdb>=0.3.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "anthropic>=0.7.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",
    "pandas>=3.0.0",
    "matplotlib>=3.10.8",
    "datasets>=4.5.0",
    "docker>=7.1.0",
    "gymnasium>=1.2.3",
    "passlib[bcrypt]>=1.7.4",
    "redis>=7.2.1",
    "aiohttp>=3.13.3",
    "fastmcp>=3.1.0",
    "pyjwt>=2.11.0",
    "kagglehub>=1.0.0",
    # Imported by cohezion.compound.tdd_adversarial.* (4 files) but was
    # previously relying on ambient install from a sibling project. Adding
    # explicit so fresh venvs (and CI) find it on first sync.
    "structlog>=24.0",
]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.2"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
torchvision = { index = "pytorch-rocm" }
torchaudio = { index = "pytorch-rocm" }
# pytorch-triton-rocm 3.1.0 ships cp311 wheels only on the ROCm index;
# main PyPI has no matching wheel. Without this source, resolution dead-ends.
pytorch-triton-rocm = { index = "pytorch-rocm" }
# cloud-vault-mcp is NOT in the default dep list because its transitive
# pocket-tts -> torch>=2.5 -> pytorch-triton-rocm==3.1.0 has no cp311 wheel.
# cohezion imports cloud_vault_mcp via try/except at call sites, so runtime
# absence is tolerated. Users who want vault features install separately:
#   uv pip install -e ./cloud-vault-mcp

# Force the lockfile to resolve wheels for the production target (x86_64
# Linux, cp311). Without this, uv's fork-marker algorithm splits resolution
# across emscripten/win32/others and picks torch versions with no usable
# x86_64 wheel. See .github/workflows/ci.yml — runners are ubuntu-latest.
[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.urls]
Repository = "https://github.com/manderson240/cohezion"
Issues = "https://github.com/manderson240/cohezion/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.3.0",
    "ruff==0.14.13",
    "mypy>=1.5.0",
    "black>=23.0",
    "flake8>=6.0",
]
ml = [
    # Pin to 2.5.1+rocm6.2 to avoid the 2.0.1 fork path that has no x86_64
    # Linux wheel. 2.5.1 ships cp311 wheels via the pytorch-rocm index.
    "torch>=2.5.1",
    # pytorch-triton-rocm is a transitive dep of torch>=2.5; listing it
    # explicitly lets tool.uv.sources map it to the pytorch-rocm index
    # where the cp311 wheel actually exists.
    "pytorch-triton-rocm>=3.1.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "transformers>=4.30.0",
]
agentjet = [
    "aiohttp>=3.9",
]
audio = [
    "librosa>=0.10.0",
    "torchaudio>=2.0.0",
    "soundfile>=0.12.0",
]
unsloth = [
    "unsloth",
]

[tool.ruff]
target-version = "py311"
line-length = 100  # Extended from 88 to accommodate f-strings and comprehensions (Retrospective Session 14)

# Exclude generated, archived, backup, and vendored directories so they don't
# fail the lint gate. These are not part of the maintained source set:
#   - src/cohezion-archive/: legacy code retained for reference
#   - _bmad/: generated BMAD artifacts
#   - backup_*/: timestamped backup snapshots
#   - kaggle-agi-benchmark/: vendored experiment code
#   - bluequbit/, ollama-mcp/, anthropic-delivery/, research/challenges/...:
#       historical submodule gitlinks with no .gitmodules in HEAD (see #71)
extend-exclude = [
    "src/cohezion-archive",
    "_bmad",
    "backup_*",
    "kaggle-agi-benchmark",
    "anthropic-delivery",
    "bluequbit",
    "ollama-mcp",
    "research/challenges",
]

# Linting configuration
[tool.ruff.lint]
# Enable comprehensive rule set
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "S",     # flake8-bandit (security)
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # Ruff-specific rules
]

ignore = [
    # Add specific rules to ignore here if needed after initial run
]

# Per-file customization
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",  # Allow assert in tests
    "S105",  # Allow hardcoded passwords in tests
    "S106",  # Allow hardcoded passwords in tests
    # S603 fires on variable-argument subprocess calls — ruff cannot statically
    # verify that shutil.which()-resolved paths or sys.executable are safe
    # (astral-sh/ruff#4045). Tests use these patterns extensively for git/ruff
    # invocations; the inputs are not user-controlled.
    "S603",
]
"src/cohezion/traceability/plan_graph.py" = [
    "S608",  # SurrealQL uses record ID interpolation (plan:{slug}), not user input
]

# Physics, simulation, and mathematics modules use domain-specific notation
# intentionally: Greek letters (σ, γ, Σ, Ω) for standard math symbols,
# uppercase variable names (T for temperature, E for energy, dE for delta-energy,
# N for particle count, B for batch size, D for dimension) following discipline
# conventions. These are not Python style violations — they are correct physics code.
"src/cohezion/physics/**/*.py" = [
    "RUF001", "RUF002", "RUF003",  # Greek/unicode characters are intentional notation
    "N806", "N802", "N803",        # Uppercase vars/funcs/args follow physics convention
]
"src/cohezion/world_model/**/*.py" = [
    "RUF001", "RUF002", "RUF003",
    "N806", "N802", "N803",
]
"src/cohezion/worldviews/**/*.py" = [
    "RUF001", "RUF002", "RUF003",  # Indigenous traditions use non-ASCII glyphs
    "N806", "N802", "N803",
]
"src/cohezion/flume/**/*.py" = [
    "RUF001", "RUF002", "RUF003",  # ρ (rho), × in VAE/encoder architecture docs
    "N806", "N802", "N803",        # B (batch), N (seq_len), D (dim) are ML convention
]
"src/cohezion/simulation/**/*.py" = [
    "N806", "N802", "N803",
    "S311",  # random.random() in simulations is not for cryptographic use
]
# Additional modules that use random for non-cryptographic purposes:
# lab_agent.py — random exploration policy, not key/token generation
# api.py — random IDs for dev/simulation endpoints
# deployment/feature_flags.py — random for gradual rollout percentile
# flume/data_pipeline.py — random shuffling in ML data pipeline
# mcp/research_server.py — random sampling in research workflows
# reliability/quantum_performance_monitor.py — random for quantum simulation
# security/attack_patterns.py — random for attack pattern simulation (not actual attack)
"src/cohezion/agents/lab_agent.py" = ["S311"]
"src/cohezion/api.py" = ["S311"]

"src/cohezion/flume/data_pipeline.py" = ["S311"]
"src/cohezion/mcp/research_server.py" = ["S311"]
"src/cohezion/reliability/quantum_performance_monitor.py" = ["S311"]
"src/cohezion/security/attack_patterns.py" = ["S311"]

"src/cohezion/environments/**/*.py" = [
    "RUF001", "RUF002", "RUF003",  # × (cross-product), physics symbols in docstrings
    "N806", "N802", "N803",
    "S311",  # Gym envs use random for stochastic dynamics, not crypto
]
"src/cohezion/compound/thermodynamic_metrics.py" = [
    "N806",    # T (temperature), dE (energy delta) follow thermodynamics notation
    "RUF002",  # σ (sigma) is standard thermodynamics notation
    "RUF003",  # σ in comments is intentional
]
# Compound layer: thermodynamics and multi-agent consensus use math notation
"src/cohezion/compound/skill_selector.py" = ["RUF002", "RUF003"]  # × for multiplier in docstrings
"src/cohezion/compound/skill_consensus_voter.py" = ["RUF002"]  # × symbol in scoring docs

# API genesis service: σ (sigma) and γ (gamma) are physics parameters, not OCR artifacts
"src/cohezion/api/services/genesis.py" = ["RUF001", "RUF002", "RUF003"]

# ML/swarm layers use τ (tau), σ, or math symbols in algorithm docs
"src/cohezion/swarm/cost_aware_router.py" = ["RUF001", "RUF002", "RUF003"]  # × in cost display strings
"src/cohezion/swarm/model_ranker.py" = ["RUF002", "RUF003"]
"src/cohezion/swarm/semantic_cache.py" = ["RUF002", "RUF003"]

# Substrate, registry, platform layers use math notation in algorithm descriptions
"src/cohezion/substrate/kv_cache_tracker.py" = ["RUF002", "RUF003"]
"src/cohezion/registry/skill_registry.py" = ["RUF002", "RUF003"]
"src/cohezion/platform/tier_optimizer.py" = ["RUF002", "RUF003"]
"src/cohezion/agentjet/context_optimizer.py" = ["RUF003"]  # – (en-dash) in algorithm steps
"src/cohezion/core/mcp_client.py" = ["RUF002", "RUF003"]
"src/cohezion/core/zvol_swap.py" = ["RUF002", "RUF003"]
"src/cohezion/deployment/feature_flags.py" = ["RUF002", "RUF003", "S311"]

# Universe and mass simulation — physics objects
"src/cohezion/universe/**/*.py" = ["RUF001", "RUF002", "RUF003", "N806", "N802", "N803"]
"src/cohezion/mass_sim/**/*.py" = ["N806", "N802", "N803"]
"src/cohezion/pipeline/weight_bridge.py" = ["N806"]

# Tests for physics/math modules inherit the same notation conventions
"tests/physics/**/*.py" = ["RUF001", "RUF002", "RUF003", "N806", "N802", "N803"]
"tests/compound/test_thermodynamic_metrics.py" = ["N806", "RUF002", "RUF003"]
"tests/flume/**/*.py" = ["RUF001", "RUF002", "RUF003", "N806", "N802", "N803"]
"tests/universe/**/*.py" = ["RUF001", "RUF002", "RUF003", "N806"]
"tests/swarm/test_model_pool_manager.py" = ["N806"]  # MockClient follows test-mock convention
"tests/cache/test_sentence_encoder.py" = ["N806"]
"tests/inference/test_orchestrator.py" = ["RUF002", "N806", "N802"]  # test_O1_..., test_O3b_... use invariant IDs (O1–O8) as test names
"tests/research/benchmark_quality.py" = ["N806", "S311"]
"tests/integrations/test_kaggle_submission.py" = ["N806"]
"tests/test_mcp.py" = ["RUF003"]
"tests/core/test_hierarchical_vault_search.py" = ["RUF002", "RUF003"]
"tests/research/test_research_comprehensive.py" = ["RUF002", "RUF003"]
"tests/security/test_race_condition_prevention.py" = ["RUF003"]

# MCP servers bind to 0.0.0.0 intentionally — they serve both local and remote
# clients and run in dev/container environments where interface binding is expected.
# This is a deliberate architectural choice, not a misconfiguration.
"src/cohezion/mcp/**/*.py" = ["S104"]
"src/cohezion/gateway/**/*.py" = ["S104"]
"src/cohezion/api/__init__.py" = ["S104"]       # FastAPI dev server bind
"src/cohezion/cli/main.py" = ["S104"]           # CLI-launched server bind

# SurrealDB uses its own query language (SurrealQL) with record ID interpolation
# patterns like `SELECT * FROM node:${id}`. These are not SQL injection vectors —
# SurrealDB does not execute user-provided SQL; record IDs are typed and validated
# by the SurrealDB engine itself.
"src/cohezion/core/persistence/**/*.py" = ["S608"]
"src/cohezion/persistence/**/*.py" = ["S608"]
"src/cohezion/hookify/**/*.py" = ["S608"]
"src/cohezion/knowledge_graph/**/*.py" = ["S608"]
"src/cohezion/mcp/hookify_server.py" = ["S608"]
"src/cohezion/agentjet/embeddings.py" = ["S608"]
"src/cohezion/flume/experience_collector.py" = ["S608"]
"src/cohezion/ouroboros/monitor.py" = ["S608"]

# Intentional late imports — documented reasons:
# executor.py: backward-compat re-export of ExecutorFactory (moved to executor_factory.py)
"src/cohezion/compound/executor.py" = ["E402"]
# embedding_provider.py, grid_encoder.py: optional heavy deps (httpx, json) loaded
# after the provider factory function to avoid import cost when provider unused
"src/cohezion/flume/embedding_provider.py" = ["E402"]
"src/cohezion/flume/grid_encoder.py" = ["E402"]
# Provider auto-registration: import must come after class definition
"src/cohezion/swarm/providers/gemini_provider.py" = ["E402"]
"src/cohezion/swarm/providers/ollama_provider.py" = ["E402"]
# r_zero_evolver.py: conditional GENERATION_PROMPT loading before cohezion imports
"src/cohezion/swarm/r_zero_evolver.py" = ["E402"]

# Test files: pytestmark skip/xfail marker placed before cohezion imports.
# This is a legitimate pytest pattern — the marker must be a module-level statement
# before test collection; the imports below it are intentionally deferred.
"tests/flume/test_cli_train.py" = ["E402"]
"tests/flume/test_integration_e2e.py" = ["E402"]
"tests/flume/test_integration_v2.py" = ["E402"]
"tests/flume/test_train_vae_v2.py" = ["E402"]
"tests/flume/test_vae_encoder.py" = ["E402"]
"tests/flume/test_vae_v2.py" = ["E402"]
"tests/sandbox/test_isolation.py" = ["E402"]
"tests/universe/test_engine.py" = ["E402"]
"tests/universe/test_sandbox_backends.py" = ["E402"]
# Config test files import after sys.path manipulation / fixture setup
"tests/config/test_config_monitoring.py" = ["E402"]
"tests/config/test_config_sync_phase4.py" = ["E402"]

# ---------------------------------------------------------------------------
# Wave 2 cleanup: residual rule families surfaced after the 13-branch campaign
# ---------------------------------------------------------------------------

# S102 (use-of-exec): factory.py loads plugin code dynamically by design.
# Inputs are constrained to allow-listed plugin paths under src/cohezion/skills/.
"src/cohezion/agents/factory.py" = ["S102"]

# S107 (hardcoded-password-default): token NAMES, not secret values.
# These are sentinel strings ("bos_token", "eos_token", ...) following
# HuggingFace tokenizer conventions; they are never used as credentials.
"src/cohezion/flume/tokenizer.py" = ["S107"]

# S310 (suspicious-URL-open): all urllib calls in these modules target
# internal services (SurrealDB ws://localhost:8001, vault HTTP API,
# hookify endpoints) with hard-coded hosts. No user-controlled URL input.
"src/cohezion/api/routes/training.py" = ["S310"]
"src/cohezion/compound/executor_helpers/vault_integration.py" = ["S310"]
"src/cohezion/compound/journey_tracker.py" = ["S310"]
"src/cohezion/compound/skill_refiner.py" = ["S310"]
"src/cohezion/core/compound/retrospection.py" = ["S310"]
"src/cohezion/governance/knowledge_bridge.py" = ["S310"]

# S105/S310 in genesis_persistence: SURREAL_PASS is the env var NAME (a
# string literal used for os.getenv lookup), not a password value.
# urllib hits ws://localhost:8001 (SurrealDB), no user input.
"src/cohezion/persistence/genesis_persistence.py" = ["S105", "S310"]

# S112 (try-except-continue): graceful skip on known iterables where the
# inner exception is observability data, not a programming bug. Logging
# every iteration would be noise on the hot path.
"src/cohezion/compound/autoresearch.py" = ["S112"]
"src/cohezion/compound/exp_persistence/vault.py" = ["S112"]
"src/cohezion/core/compound/skill_refiner.py" = ["S112"]
"src/cohezion/hookify/validator.py" = ["S112", "SIM116"]  # SIM116: state-machine if-chain, not dict-replaceable
"src/cohezion/knowledge_graph/query_engine.py" = ["S112"]
"src/cohezion/mcp/servers/skills/client.py" = ["S112"]

# SIM115 (context-manager-for-open): files held open intentionally for
# the lifetime of long-running monitors / cross-process locks.
"src/cohezion/mcp/manager/server_manager.py" = ["SIM115"]
"src/cohezion/reliability/sync.py" = ["SIM115"]
"src/cohezion/security/file_lock_context.py" = ["SIM115"]

# SIM116 (consecutive-ifs): tip_of_spear_router uses a state-machine
# if-chain that depends on early-return semantics; a dict can't replace it.
"src/cohezion/swarm/tip_of_spear_router.py" = ["SIM116"]

# B008 (function-call-default): Path.home() and tempfile.gettempdir()
# in defaults is intentional — these are evaluated once at module load
# and serve as cached singletons for the migration scripts.
"src/cohezion/knowledge_graph/bidirectional_linker.py" = ["B008"]
"src/cohezion/knowledge_graph/universe_artifact_migration.py" = ["B008"]
"src/cohezion/knowledge_graph/universe_genealogy_migration.py" = ["B008"]

# S606 (start-process-with-no-shell): amd_s2idle_report invokes a
# specific s2idle reporting binary by absolute path; shell=False is
# the secure choice (S602/S603 would fire if shell=True).
"src/cohezion/healing/amd_s2idle_report.py" = ["S606"]

# S307 (suspicious-eval-usage): peaked_solver evaluates user-supplied
# physics expressions for the wave-equation peaked-solution solver.
# This is a SymPy/SciPy-style scientific eval, not a code-injection vector;
# inputs come from the physics test harness, not external requests.
"src/cohezion/physics/quantum/peaked_solver.py" = ["S307"]

# N814 (camelcase-imported-as-constant): TokenEfficientClient → _TC is
# an intentional internal alias to avoid the long name in the hot path.
"src/cohezion/swarm/democratic_debate.py" = ["N814"]

# N815 (mixedCase-class-var): Claude Code's agent-config schema requires
# camelCase keys (`disallowedTools`, etc.) for compatibility with the CLI.
"src/cohezion/validation/agent_schema.py" = ["N815"]

# A001 (builtin-shadowing): DeprecationWarning is intentionally re-bound
# inside dependency_scanner so warnings issued by scanned packages route
# through the scanner's logger instead of stderr.
"src/cohezion/registry/dependency_scanner.py" = ["A001"]

# S101 (assert-used): module-level invariant assertions that document
# data-structure shape; these fire at import time, not inside test logic.
"src/cohezion/simulation/rl_framework.py" = ["S101"]
"src/cohezion/worldviews/tradition_data.py" = ["S101"]

# B018 (useless-expression): test attribute-access expressions used to
# trigger __getattr__ side effects in the unit under test.
"tests/compound/test_context_metrics_integration.py" = ["B018"]
"tests/swarm/test_fallback_strategy_comprehensive.py" = ["B018"]

# Import sorting configuration
[tool.ruff.lint.isort]
known-first-party = ["cohezion"]
force-single-line = false
lines-after-imports = 2

# Formatter configuration (replaces Black)
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Type checking with mypy
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start permissive, can tighten later
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

# Per-module options
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Strict carve-out: files that pass `mypy --strict` cleanly.
# Wave 2E (synthetic-sniffing-panda): pin these so they don't regress.
# To add a file: `uv run mypy --strict <file> --ignore-missing-imports` must report Success.
# NOTE: Use individual flag names instead of `strict = true` here -
# `strict = true` in overrides leaks settings to all modules in mypy < 1.10.
[[tool.mypy.overrides]]
module = [
    "cohezion.security.vault",
    "cohezion.integrations.agentverse.bridge",
    "cohezion.compound.routing_feedback_loop",
    "cohezion.compound.inflection_detector",
    "cohezion.compound.persistence.vault",
    "cohezion.agents.version_tracker",
    "cohezion.observability.metrics_analytics",
]
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "fast: Fast unit tests (<1s each, no live services)",
    "integration: Integration tests (require live services like Ollama/SurrealDB)",
    "mcp: MCP server tests (require vault access)",
]
