[project]
name = "cohezion"
version = "0.1.0"
description = "Agentic AI framework"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "matplotlib>=3.10.8",
    "mcp>=1.25.0",
    "mem0ai>=1.0.2",
    "numpy>=2.4.1",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
    "torch>=2.9.1",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This tells Hatchling exactly where your source code lives
packages = ["src/cohezion"]

[tool.uv]
package = true

[tool.ruff]
line-length = 88
target-version = "py313"

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.13",
]
