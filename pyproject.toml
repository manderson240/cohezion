[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cohezion"
version = "1.0.2"
description = "Training environments, evaluation systems, and ML infrastructure for agentic AI operating in simulated universes"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "MIT"}
authors = [
    {name = "Mike Anderson", email = "manderson240@users.noreply.github.com"},
]
keywords = [
    "agentic-ai",
    "training-environments",
    "reinforcement-learning",
    "universe-simulation",
    "multi-agent",
    "evaluation",
    "latent-space",
    "variational-autoencoder",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "psutil>=5.9.0",
    "surrealdb>=0.3.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "anthropic>=0.7.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",
    "pandas>=3.0.0",
    "matplotlib>=3.10.8",
    "datasets>=4.5.0",
    "docker>=7.1.0",
    "gymnasium>=1.2.3",
    "passlib[bcrypt]>=1.7.4",
    "redis>=7.2.1",
    "aiohttp>=3.13.3",
    "fastmcp>=3.1.0",
    "pyjwt>=2.11.0",
    "kagglehub>=1.0.0",
    # Imported by cohezion.compound.tdd_adversarial.* (4 files) but was
    # previously relying on ambient install from a sibling project. Adding
    # explicit so fresh venvs (and CI) find it on first sync.
    "structlog>=24.0",
]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.2"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
torchvision = { index = "pytorch-rocm" }
torchaudio = { index = "pytorch-rocm" }
# pytorch-triton-rocm 3.1.0 ships cp311 wheels only on the ROCm index;
# main PyPI has no matching wheel. Without this source, resolution dead-ends.
pytorch-triton-rocm = { index = "pytorch-rocm" }
# cloud-vault-mcp is NOT in the default dep list because its transitive
# pocket-tts -> torch>=2.5 -> pytorch-triton-rocm==3.1.0 has no cp311 wheel.
# cohezion imports cloud_vault_mcp via try/except at call sites, so runtime
# absence is tolerated. Users who want vault features install separately:
#   uv pip install -e ./cloud-vault-mcp

# Force the lockfile to resolve wheels for the production target (x86_64
# Linux, cp311). Without this, uv's fork-marker algorithm splits resolution
# across emscripten/win32/others and picks torch versions with no usable
# x86_64 wheel. See .github/workflows/ci.yml — runners are ubuntu-latest.
[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.urls]
Repository = "https://github.com/manderson240/cohezion"
Issues = "https://github.com/manderson240/cohezion/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.8.0",
    "mypy>=1.5.0",
    "black>=23.0",
    "flake8>=6.0",
]
ml = [
    # Pin to 2.5.1+rocm6.2 to avoid the 2.0.1 fork path that has no x86_64
    # Linux wheel. 2.5.1 ships cp311 wheels via the pytorch-rocm index.
    "torch>=2.5.1",
    # pytorch-triton-rocm is a transitive dep of torch>=2.5; listing it
    # explicitly lets tool.uv.sources map it to the pytorch-rocm index
    # where the cp311 wheel actually exists.
    "pytorch-triton-rocm>=3.1.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "transformers>=4.30.0",
]
agentjet = [
    "aiohttp>=3.9",
]
audio = [
    "librosa>=0.10.0",
    "torchaudio>=2.0.0",
    "soundfile>=0.12.0",
]
unsloth = [
    "unsloth",
]

[tool.ruff]
target-version = "py311"
line-length = 100  # Extended from 88 to accommodate f-strings and comprehensions (Retrospective Session 14)

# Exclude generated, archived, backup, and vendored directories so they don't
# fail the lint gate. These are not part of the maintained source set:
#   - src/cohezion-archive/: legacy code retained for reference
#   - _bmad/: generated BMAD artifacts
#   - backup_*/: timestamped backup snapshots
#   - kaggle-agi-benchmark/: vendored experiment code
#   - bluequbit/, ollama-mcp/, anthropic-delivery/, research/challenges/...:
#       historical submodule gitlinks with no .gitmodules in HEAD (see #71)
extend-exclude = [
    "src/cohezion-archive",
    "_bmad",
    "backup_*",
    "kaggle-agi-benchmark",
    "anthropic-delivery",
    "bluequbit",
    "ollama-mcp",
    "research/challenges",
]

# Linting configuration
[tool.ruff.lint]
# Enable comprehensive rule set
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "S",     # flake8-bandit (security)
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # Ruff-specific rules
]

ignore = [
    # Add specific rules to ignore here if needed after initial run
]

# Per-file customization
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",  # Allow assert in tests
    "S105",  # Allow hardcoded passwords in tests
    "S106",  # Allow hardcoded passwords in tests
]
"src/cohezion/traceability/plan_graph.py" = [
    "S608",  # SurrealQL uses record ID interpolation (plan:{slug}), not user input
]

# Physics, simulation, and mathematics modules use domain-specific notation
# intentionally: Greek letters (σ, γ, Σ, Ω) for standard math symbols,
# uppercase variable names (T for temperature, E for energy, dE for delta-energy,
# N for particle count, B for batch size, D for dimension) following discipline
# conventions. These are not Python style violations — they are correct physics code.
"src/cohezion/physics/**/*.py" = [
    "RUF001", "RUF002", "RUF003",  # Greek/unicode characters are intentional notation
    "N806", "N802", "N803",        # Uppercase vars/funcs/args follow physics convention
]
"src/cohezion/world_model/**/*.py" = [
    "RUF001", "RUF002", "RUF003",
    "N806", "N802", "N803",
]
"src/cohezion/worldviews/**/*.py" = [
    "RUF001", "RUF002", "RUF003",  # Indigenous traditions use non-ASCII glyphs
    "N806", "N802", "N803",
]
"src/cohezion/flume/**/*.py" = [
    "RUF001", "RUF002", "RUF003",  # ρ (rho), × in VAE/encoder architecture docs
    "N806", "N802", "N803",        # B (batch), N (seq_len), D (dim) are ML convention
]
"src/cohezion/simulation/**/*.py" = [
    "N806", "N802", "N803",
    "S311",  # random.random() in simulations is not for cryptographic use
]
"src/cohezion/environments/**/*.py" = [
    "RUF001", "RUF002", "RUF003",  # × (cross-product), physics symbols in docstrings
    "N806", "N802", "N803",
    "S311",  # Gym envs use random for stochastic dynamics, not crypto
]
"src/cohezion/compound/thermodynamic_metrics.py" = [
    "N806",    # T (temperature), dE (energy delta) follow thermodynamics notation
    "RUF002",  # σ (sigma) is standard thermodynamics notation
    "RUF003",  # σ in comments is intentional
]
# Compound layer: thermodynamics and multi-agent consensus use math notation
"src/cohezion/compound/skill_selector.py" = ["RUF002", "RUF003"]  # × for multiplier in docstrings
"src/cohezion/compound/skill_consensus_voter.py" = ["RUF002"]  # × symbol in scoring docs

# API genesis service: σ (sigma) and γ (gamma) are physics parameters, not OCR artifacts
"src/cohezion/api/services/genesis.py" = ["RUF001", "RUF002", "RUF003"]

# ML/swarm layers use τ (tau), σ, or math symbols in algorithm docs
"src/cohezion/swarm/cost_aware_router.py" = ["RUF001", "RUF002", "RUF003"]  # × in cost display strings
"src/cohezion/swarm/model_ranker.py" = ["RUF002", "RUF003"]
"src/cohezion/swarm/semantic_cache.py" = ["RUF002", "RUF003"]

# Substrate, registry, platform layers use math notation in algorithm descriptions
"src/cohezion/substrate/kv_cache_tracker.py" = ["RUF002", "RUF003"]
"src/cohezion/registry/skill_registry.py" = ["RUF002", "RUF003"]
"src/cohezion/platform/tier_optimizer.py" = ["RUF002", "RUF003"]
"src/cohezion/agentjet/context_optimizer.py" = ["RUF003"]  # – (en-dash) in algorithm steps
"src/cohezion/core/mcp_client.py" = ["RUF002", "RUF003"]
"src/cohezion/core/zvol_swap.py" = ["RUF002", "RUF003"]
"src/cohezion/deployment/feature_flags.py" = ["RUF002", "RUF003"]

# Universe and mass simulation — physics objects
"src/cohezion/universe/**/*.py" = ["RUF001", "RUF002", "RUF003", "N806", "N802", "N803"]
"src/cohezion/mass_sim/**/*.py" = ["N806", "N802", "N803"]
"src/cohezion/pipeline/weight_bridge.py" = ["N806"]

# Tests for physics/math modules inherit the same notation conventions
"tests/physics/**/*.py" = ["RUF001", "RUF002", "RUF003", "N806", "N802", "N803"]
"tests/compound/test_thermodynamic_metrics.py" = ["N806", "RUF002", "RUF003"]
"tests/flume/**/*.py" = ["RUF001", "RUF002", "RUF003", "N806", "N802", "N803"]
"tests/universe/**/*.py" = ["RUF001", "RUF002", "RUF003", "N806"]
"tests/swarm/test_model_pool_manager.py" = ["N806"]  # MockClient follows test-mock convention
"tests/cache/test_sentence_encoder.py" = ["N806"]
"tests/inference/test_orchestrator.py" = ["RUF002", "N806", "N802"]  # test_O1_..., test_O3b_... use invariant IDs (O1–O8) as test names
"tests/research/benchmark_quality.py" = ["N806"]
"tests/integrations/test_kaggle_submission.py" = ["N806"]
"tests/test_mcp.py" = ["RUF003"]
"tests/core/test_hierarchical_vault_search.py" = ["RUF002", "RUF003"]
"tests/research/test_research_comprehensive.py" = ["RUF002", "RUF003"]
"tests/security/test_race_condition_prevention.py" = ["RUF003"]

# Import sorting configuration
[tool.ruff.lint.isort]
known-first-party = ["cohezion"]
force-single-line = false
lines-after-imports = 2

# Formatter configuration (replaces Black)
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Type checking with mypy
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Start permissive, can tighten later
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

# Per-module options
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Strict carve-out: files that pass `mypy --strict` cleanly.
# Wave 2E (synthetic-sniffing-panda): pin these so they don't regress.
# To add a file: `uv run mypy --strict <file> --ignore-missing-imports` must report Success.
# NOTE: Use individual flag names instead of `strict = true` here -
# `strict = true` in overrides leaks settings to all modules in mypy < 1.10.
[[tool.mypy.overrides]]
module = [
    "cohezion.security.vault",
    "cohezion.integrations.agentverse.bridge",
    "cohezion.compound.routing_feedback_loop",
    "cohezion.compound.inflection_detector",
    "cohezion.compound.persistence.vault",
    "cohezion.agents.version_tracker",
    "cohezion.observability.metrics_analytics",
]
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "fast: Fast unit tests (<1s each, no live services)",
    "integration: Integration tests (require live services like Ollama/SurrealDB)",
    "mcp: MCP server tests (require vault access)",
]
