# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# AC-1: Security alerts within 24h of CVE publication
# Security alerts are automatically generated by GitHub Security Advisory database
# Security updates bypass the schedule below

version: 2

updates:
  # Python dependencies (uv/pip)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "00:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "manderson240"
    assignees:
      - "manderson240"
    labels:
      - "dependencies"
      - "python"
      - "security"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group updates to reduce noise
    groups:
      dev-dependencies:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "black"
          - "flake8"
        update-types:
          - "minor"
          - "patch"
      ml-dependencies:
        patterns:
          - "torch"
          - "transformers"
          - "numpy"
          - "scikit-learn"
          - "pandas"
        update-types:
          - "minor"
          - "patch"
      security-patches:
        update-types:
          - "patch"
        applies-to: "security-updates"
    # Security updates are always enabled
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    # Ignore certain updates that might break things
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    reviewers:
      - "manderson240"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions-updates:
        patterns:
          - "*"
