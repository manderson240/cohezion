name: Lint & Type Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install ruff mypy

      - name: Run ruff format check (root)
        run: ruff format --check src/ tests/ || true

      - name: Run ruff format check (cloud-vault-mcp)
        run: |
          cd cloud-vault-mcp
          ruff format --check src/ tests/ || true

      - name: Run ruff linter (root)
        run: ruff check src/ tests/ || true

      - name: Run ruff linter (cloud-vault-mcp)
        run: |
          cd cloud-vault-mcp
          ruff check src/ tests/ || true

      - name: Run mypy (root)
        run: mypy --ignore-missing-imports src/ || true

      - name: Run mypy (cloud-vault-mcp)
        run: |
          cd cloud-vault-mcp
          mypy --ignore-missing-imports src/ || true
