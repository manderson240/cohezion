name: Lint & Type Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run ruff format check (root)
        run: uv run ruff format --check src/ tests/

      - name: Run ruff format check (cloud-vault-mcp)
        run: |
          cd cloud-vault-mcp
          uv run ruff format --check src/ tests/ || true

      - name: Run ruff linter (root)
        run: uv run ruff check src/ tests/

      - name: Run ruff linter (cloud-vault-mcp)
        run: |
          cd cloud-vault-mcp
          uv run ruff check src/ tests/ || true

      - name: Run mypy (root)
        run: uv run mypy --ignore-missing-imports src/
        continue-on-error: true
