name: Lint Enforcement

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: self-hosted
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"
      
      - name: Install dependencies
        run: uv sync --all-extras
      
      - name: Critical Lint Check (E722, F821, S607)
        run: |
          uv run ruff check . \
            --select "E722,F821,S607" \
            --exit-non-zero-on-fix \
            --exclude "research/,.venv/,__pycache__/"
        
      - name: Style Lint Check (Warning Mode)
        run: |
          uv run ruff check . \
            --select "E501,I001,W293,N806,RUF059,F401" \
            --exclude "research/,.venv/,__pycache__/" \
            --output-format=github || true
        
      - name: Test Repo Health
        run: |
          uv run pytest tests/repo_health/ -v --tb=short
        
      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: |
            .ruff_cache/
            health_report.json
