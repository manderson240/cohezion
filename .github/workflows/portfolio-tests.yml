name: Portfolio E2E Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/dashboard/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/dashboard/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Check dashboard exists
        id: check
        run: test -f apps/dashboard/package.json
        continue-on-error: true

      - name: Setup Node.js
        if: steps.check.outcome == 'success'
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.check.outcome == 'success'
        working-directory: apps/dashboard
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium

      - name: Run Portfolio Tests
        if: steps.check.outcome == 'success'
        working-directory: apps/dashboard
        run: npm run test:e2e -- --grep=Portfolio

      - name: Upload test results
        if: always() && steps.check.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/dashboard/playwright-report/
