name: Test Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  COHEZION_CI: "true"
  COHEZION_NON_INTERACTIVE: "true"
  KAGGLE_USERNAME: "dummy"
  KAGGLE_KEY: "dummy"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run lint
        run: make lint-check
        continue-on-error: true

      - name: Run type check
        run: make type-check
        continue-on-error: true

      - name: Run tests with coverage
        run: |
          uv run pytest tests/unit/ \
            -m "not integration" \
            --cov=cohezion \
            --cov-report=xml \
            --cov-report=html \
            --junitxml=integration-report.xml \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          # fail_ci_if_error was true but Codecov token-less uploads have been
          # returning "Token required - not valid tokenless upload", failing
          # the whole job despite 5,925 tests passing. Coverage is also
          # uploaded as a workflow artifact below, so we don't lose the data.
          # Re-enable once CODECOV_TOKEN is configured as a repo secret.
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Check coverage threshold
        run: |
          COVERAGE=$(uv run python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(float(root.attrib['line-rate']) * 100)")
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 10" | bc -l) )); then
            echo "Coverage below threshold (10%)"
            exit 1
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov/

  test-generated:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Check for missing test coverage
        continue-on-error: true
        run: |
          # Find Python files in src/ without corresponding tests
          MISSING=0
          for file in $(find src/cohezion -name "*.py" -type f | grep -v __pycache__ | grep -v __init__ || true); do
            module=$(echo "$file" | sed 's|src/||; s|/|.|g; s|\.py$||')
            test_file=$(echo "$file" | sed 's|src/cohezion|tests|; s|\.py$||')
            if [ ! -f "${test_file}.py" ]; then
              echo "Missing test: $module"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ $MISSING -gt 0 ]; then
            echo "Found $MISSING modules without tests"
            # Don't fail yet, just warn
            # exit 1
          fi

  auto-generate-tests:
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "disabled"
