name: Test Coverage

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  COHEZION_CI: "true"
  COHEZION_NON_INTERACTIVE: "true"
  KAGGLE_USERNAME: "dummy"
  KAGGLE_KEY: "dummy"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run lint
        run: make lint-check
        continue-on-error: true

      - name: Run type check
        run: make type-check
        continue-on-error: true

      - name: Run tests with coverage
        run: |
          uv run pytest tests/unit/ \
            -m "not integration" \
            --cov=cohezion \
            --cov-report=xml \
            --cov-report=html \
            --junitxml=integration-report.xml \
            -v

      - name: Coverage ratchet (gating)
        run: |
          COVERAGE=$(uv run python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(float(root.attrib['line-rate']) * 100)")
          echo "Coverage: $COVERAGE% (baseline 23)"
          # Ratchet: 23% measured 2026-09-08 from this exact invocation locally
          # (1132 passed, 15 xfailed). Raise only when coverage genuinely rises.
          if (( $(echo "$COVERAGE < 23" | bc -l) )); then
            echo "✗ Coverage below baseline: $COVERAGE% < 23%"
            echo "  Fix or delete the uncovered paths you touched; never lower coverage."
            exit 1
          fi
          if (( $(echo "$COVERAGE > 23.5" | bc -l) )); then
            echo "↑ Coverage rose: $COVERAGE% > 23.5%. Re-baseline: bump the 23/23.5 constants above."
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov/

  test-generated:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Check for missing test coverage
        continue-on-error: true
        run: |
          # Find Python files in src/ without corresponding tests
          MISSING=0
          for file in $(find src/cohezion -name "*.py" -type f | grep -v __pycache__ | grep -v __init__ || true); do
            module=$(echo "$file" | sed 's|src/||; s|/|.|g; s|\.py$||')
            test_file=$(echo "$file" | sed 's|src/cohezion|tests|; s|\.py$||')
            if [ ! -f "${test_file}.py" ]; then
              echo "Missing test: $module"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ $MISSING -gt 0 ]; then
            echo "Found $MISSING modules without tests"
            # Don't fail yet, just warn
            # exit 1
          fi

  auto-generate-tests:
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo "disabled"
