name: Playwright Tests

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/web/anima_dashboard/**'

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    defaults:
      run:
        working-directory: ./src/web/anima_dashboard
    steps:
    - uses: actions/checkout@v6
    - name: Check dashboard exists
      id: check
      run: test -f package.json
      continue-on-error: true
    - uses: actions/setup-node@v6
      if: steps.check.outcome == 'success'
      with:
        node-version: lts/*
    - name: Install dependencies
      if: steps.check.outcome == 'success'
      run: npm ci
    - name: Install Playwright Browsers
      if: steps.check.outcome == 'success'
      run: npx playwright install chromium --with-deps
    # playwright.config.ts declares a webServer (`npm run dev -- -p 3010`) that Playwright
    # starts and health-waits itself; a second hand-started server here only doubled the
    # cold start and raced a 30 s wait-on.
    - name: Run Playwright tests
      if: steps.check.outcome == 'success'
      run: npx playwright test
    - uses: actions/upload-artifact@v7
      if: always() && steps.check.outcome == 'success'
      with:
        name: playwright-report
        path: /tmp/playwright-report/  # playwright.config.ts reporter outputFolder
        retention-days: 30
