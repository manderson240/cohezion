name: Playwright Tests

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/web/anima_dashboard/**'

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/web/anima_dashboard
    steps:
    - uses: actions/checkout@v6
    - name: Check dashboard exists
      id: check
      run: test -f package.json
      continue-on-error: true
    - uses: actions/setup-node@v6
      if: steps.check.outcome == 'success'
      with:
        node-version: lts/*
    - name: Install dependencies
      if: steps.check.outcome == 'success'
      run: npm ci
    - name: Install Playwright Browsers
      if: steps.check.outcome == 'success'
      run: npx playwright install chromium --with-deps
    - name: Build and start dev server
      if: steps.check.outcome == 'success'
      run: |
        npm run build --if-present || true
        npm run dev -- --port 3000 &
        npx wait-on http://localhost:3000 --timeout 30000
    - name: Run Playwright tests
      if: steps.check.outcome == 'success'
      run: npx playwright test
    - uses: actions/upload-artifact@v7
      if: always() && steps.check.outcome == 'success'
      with:
        name: playwright-report
        path: src/web/anima_dashboard/playwright-report/
        retention-days: 30
