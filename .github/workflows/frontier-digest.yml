name: Frontier Digest

# Generates docs/ops/frontier/<YYYY-MM-DD>.md every weekday morning
# and commits it back to the branch if anything changed.
#
# The script (scripts/ci/frontier_digest.py) is best-effort: any
# external fetch failure is logged but does not fail the workflow.
# A digest is still committed even with zero findings.

on:
  schedule:
    # 06:00 UTC Mon-Fri
    - cron: '0 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.4.x'
      - name: Sync deps
        run: uv sync --frozen
      - name: Generate digest
        env:
          PYTHONPATH: src:scripts/ci
        run: |
          mkdir -p docs/ops/frontier
          uv run python scripts/ci/frontier_digest.py --output docs/ops/frontier --verbose || echo "WARN: digest generation had errors but produced partial output"
      - name: Commit digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ops/frontier/*.md || true
          if git diff --cached --quiet; then
            echo "No new digest files to commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "ci(frontier): regenerate digest for $DATE" || true
            git push
          fi
