name: "CodeQL Security Analysis"


on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run at 00:00 UTC every Monday
    - cron: "0 0 * * 1"

env:
  CODEQL_EXTRACTOR_PYTHON_MAX_THREADS: "4"

jobs:
  analyze:
    name: Analyze Python Code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          # Use custom config for Python ML/scientific code
          config: |
            paths:
              - src
              - tests
            paths-ignore:
              - "**/node_modules/**"
              - "**/__pycache__/**"
              - "**/.venv/**"
              - "**/venv/**"
              - "**/*.ipynb"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]" || true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
          upload: true

      - name: Upload SARIF to artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif-results
          path: ${{ runner.temp }}/codeql_database/*.sarif
          if-no-files-found: ignore
