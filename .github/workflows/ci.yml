name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COHEZION_CI: "true"
  UV_CACHE_DIR: /tmp/.uv-cache
  PYTHON_VERSION: "3.13"

jobs:
  # ── Lint & Format ────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Ruff lint check
        run: uv run ruff check src/ tests/

  # ── Validate ─────────────────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Validate agent files
        run: uv run python scripts/ci/validate_agents.py

      - name: Validate PRIME skills
        run: uv run python scripts/ci/validate_skills.py

      - name: Validate skill registry
        run: uv run python scripts/ci/validate_registry.py

      - name: Validate critical imports
        run: |
          uv run python -c "
          from cohezion.core.template_engine import TemplateEngine
          from cohezion.registry.skill_registry import load_registry
          from cohezion.registry.capability_registry import CapabilityRegistry
          from cohezion.core.compound.retrospection import RetrospectionEngine
          from cohezion.validation.agent_schema import validate_all_agent_files
          print('All critical imports OK')
          "

  # ── Type Check ───────────────────────────────────────────────
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Type check with mypy
        run: uv run mypy src/cohezion/ --ignore-missing-imports
        continue-on-error: true

  # ── Test ─────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: [lint, validate]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run unit tests
        run: >
          uv run pytest tests/unit/ -v
          --tb=short
          --junitxml=report.xml
          --cov=src/cohezion
          --cov-report=xml:coverage.xml
          --cov-report=term

      - name: Run integration tests
        run: >
          uv run pytest tests/ --ignore=tests/unit/ -v
          --tb=short
          --junitxml=integration-report.xml
        continue-on-error: true

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: |
            report.xml
            integration-report.xml
          check_name: Test Results (Python ${{ matrix.python-version }})

  # ── Compound Audit ───────────────────────────────────────────
  compound:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run compound audit
        run: uv run python scripts/ci/compound_audit.py
        continue-on-error: true

      - name: Upload compound report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compound-report
          path: compound-report.json
          if-no-files-found: ignore

  # ── Dependency Review (PRs only) ────────────────────────────
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0

  # ── CI Status Gate ───────────────────────────────────────────
  ci-status:
    runs-on: ubuntu-latest
    needs: [lint, validate, test, typecheck, compound]
    if: always()
    steps:
      - name: Check CI status
        run: |
          if [ "${{ needs.lint.result }}" = "failure" ] || \
             [ "${{ needs.validate.result }}" = "failure" ] || \
             [ "${{ needs.test.result }}" = "failure" ]; then
            echo "CI Pipeline Failed"
            exit 1
          fi
          echo "CI Pipeline Passed"
