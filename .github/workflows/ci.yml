name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  COHEZION_CI: "true"
  COHEZION_NON_INTERACTIVE: "true"
  KAGGLE_USERNAME: "dummy"
  KAGGLE_KEY: "dummy"

jobs:
  # ── Lint ─────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv via Astral action
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          python-version: "3.13"

      - name: Free disk space (large ROCm torch wheel)
        run: |
          # The torch==*+rocm6.2 wheel extraction exhausts the default runner disk
          # ("No space left on device"). Reclaim ~40GB of preinstalled toolchains we
          # don't use. Do NOT touch /opt/hostedtoolcache — the job's Python lives there.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost /usr/local/.ghcup
          sudo apt-get clean
          df -h /

      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/
        continue-on-error: true

      - name: Ruff lint check
        run: uv run ruff check src/ tests/
        continue-on-error: true

      # Gating: the two ruff steps above are advisory (annotations only) because of a
      # large pre-existing backlog. This ratchet gives the lint job teeth — it FAILS if
      # the ruff-check violation count exceeds the committed baseline (scripts/ci/lint_baseline.txt),
      # so no PR can add new lint debt. Pay it down by lowering the baseline as the count
      # drops; when it reaches 0, drop the ratchet and make `ruff check` itself gating.
      - name: Ruff debt ratchet (gating)
        run: uv run python scripts/ci/ruff_ratchet.py

  # ── Validate ──────────────────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Free disk space (large ROCm torch wheel)
        run: |
          # The torch==*+rocm6.2 wheel extraction exhausts the default runner disk
          # ("No space left on device"). Reclaim ~40GB of preinstalled toolchains we
          # don't use. Do NOT touch /opt/hostedtoolcache — the job's Python lives there.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost /usr/local/.ghcup
          sudo apt-get clean
          df -h /

      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      - name: Validate agent files
        run: uv run python scripts/ci/validate_agents.py

      - name: Validate PRIME skills
        run: uv run python scripts/ci/validate_skills.py

      - name: Validate skill registry
        run: uv run python scripts/ci/validate_registry.py

      # Gating (verification-depth.md layer 3): a curated registry of load-bearing
      # capabilities that must have a production consumer, not just a `def` + unit
      # tests. Catches the "green but dormant" class (regression gate, jepa_coherence,
      # the FAPO failure-path wiring) before it ships silently broken.
      - name: Dormancy scan (gating)
        run: uv run python scripts/ci/dormancy_scan.py

      # Doc↔code drift (sibling to dormancy_scan): dormancy_scan checks that code
      # has consumers; this checks that CLAUDE.md/harness.md tell the truth about the
      # code — every referenced file-path and cohezion.* module must resolve. Fails on
      # E-errors (broken refs); class.member mismatches are advisory W-warnings.
      # --self-test FIRST: it feeds the checks synthetic broken docs and asserts each one
      # FIRES, plus a negative control that must stay silent. Without it a bug in the
      # scanner reads as a clean "0 errors" — which is exactly how the RGA1/RGA2 phantom
      # invariants passed, and how E2 was found structurally unable to fire (2026-07-29).
      - name: Doc-code consistency (gating)
        run: |
          uv run python scripts/ci/doc_code_consistency.py --self-test
          uv run python scripts/ci/doc_code_consistency.py

      # Phantom attribute reads (THIRD sibling): dormancy_scan asks "does this capability
      # have a consumer?", doc_code_consistency asks "do the docs tell the truth?", this
      # asks "does the attribute this code reads actually exist?". Added 2026-08-26 after
      # getattr(result, "error", "") in actioner/engine.py was found reading a field
      # ExecutionResult does not define, so every failure logged an empty reason and a
      # fully-blocked compound pipeline looked like a slow one for weeks. mypy cannot catch
      # this — getattr with a literal + default is deliberate dynamism whose contract is to
      # succeed silently. --self-test FIRST for the same reason as the sibling above.
      - name: Phantom attribute scan (gating)
        run: |
          uv run python scripts/ci/phantom_attr_scan.py --self-test
          uv run python scripts/ci/phantom_attr_scan.py

      # Meta-gate: the scans above ask questions about the CODE; this asks whether
      # the gates themselves can still answer. It EXECUTES each gate's --self-test
      # rather than checking the flag is present, because doc_code_consistency.py
      # was found shipping a --self-test that printed "BROKEN -- a check cannot
      # fail" and exited 1: a substring check would have certified it healthy while
      # it detected nothing. Scope is derived from what CI actually invokes, so the
      # rule attaches by itself when a script is promoted to a gate.
      - name: Gate self-test coverage (gating)
        run: |
          uv run python scripts/ci/self_test_coverage.py --self-test
          uv run python scripts/ci/self_test_coverage.py

      - name: Validate critical imports
        run: |
          uv run python -c "
          from cohezion.core.template_engine import TemplateEngine
          from cohezion.registry.skill_registry import load_registry
          from cohezion.registry.capability_registry import CapabilityRegistry
          from cohezion.core.compound.retrospection import RetrospectionEngine
          from cohezion.validation.agent_schema import validate_all_agent_files
          print('✓ All critical imports OK')
          "

  # ── Test ──────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Free disk space (large ROCm torch wheel)
        run: |
          # The torch==*+rocm6.2 wheel extraction exhausts the default runner disk
          # ("No space left on device"). Reclaim ~40GB of preinstalled toolchains we
          # don't use. Do NOT touch /opt/hostedtoolcache — the job's Python lives there.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost /usr/local/.ghcup
          sudo apt-get clean
          df -h /

      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      - name: Run unit tests
        run: >
          uv run pytest tests/unit/ -v
          --tb=short
          --junitxml=report.xml
          --cov=src/cohezion
          --cov-report=xml:coverage.xml
          --cov-report=term

      # Gating: tests/inference/ must pass (verified 423 green). Unlike the broad
      # integration step below, a failure here fails the job and blocks merge.
      - name: Run inference tests (gating)
        run: uv run pytest tests/inference/ -q --tb=short

      - name: Run integration tests
        run: >
          uv run pytest tests/ --ignore=tests/unit/ --ignore=tests/inference/ -v
          --tb=short
          --junitxml=integration-report.xml
        continue-on-error: true

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action/composite@v2
        with:
          files: |
            report.xml
            integration-report.xml
          check_name: Test Results (Python ${{ matrix.python-version }})

  # ── Compound ──────────────────────────────────────────────────
  compound:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Free disk space (large ROCm torch wheel)
        run: |
          # The torch==*+rocm6.2 wheel extraction exhausts the default runner disk
          # ("No space left on device"). Reclaim ~40GB of preinstalled toolchains we
          # don't use. Do NOT touch /opt/hostedtoolcache — the job's Python lives there.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost /usr/local/.ghcup
          sudo apt-get clean
          df -h /

      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      - name: Run compound audit
        run: uv run python scripts/ci/compound_audit.py
        continue-on-error: true

      - name: Upload compound report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compound-report
          path: compound-report.json
          if-no-files-found: ignore

  # ── Typecheck ─────────────────────────────────────────────────
  typecheck:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Free disk space (large ROCm torch wheel)
        run: |
          # The torch==*+rocm6.2 wheel extraction exhausts the default runner disk
          # ("No space left on device"). Reclaim ~40GB of preinstalled toolchains we
          # don't use. Do NOT touch /opt/hostedtoolcache — the job's Python lives there.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost /usr/local/.ghcup
          sudo apt-get clean
          df -h /

      - name: Sync dependencies
        run: uv sync --frozen --extra dev

      # The informational `mypy` step that used to sit here was removed: the
      # ratchet below runs mypy itself, so keeping both type-checked all 1583
      # files TWICE on every PR for no added signal. On failure the ratchet
      # prints the exact command to reproduce the error list locally.
      #
      # --self-test FIRST: it proves the ratchet can still FAIL. Without it a
      # broken ratchet reads as a clean "no new type debt" — which is exactly how
      # this gate stayed dark. It also asserts that an ABORTED mypy run is refused
      # rather than counted: a crash prints "Found 1 error", and any counter that
      # accepts that would ratchet the baseline from 1826 down to 1 and disable
      # the gate permanently.
      - name: Mypy ratchet self-test
        run: uv run python scripts/ci/mypy_ratchet.py --self-test

      # Gating (no continue-on-error): fails when the error count exceeds
      # scripts/ci/mypy_baseline.txt, OR when fewer files were checked than the
      # baseline recorded — a widened `exclude` lowers the error count too, and
      # without the coverage half the gate would reward going blind.
      - name: Mypy debt ratchet (gating)
        run: uv run python scripts/ci/mypy_ratchet.py

  # ── Summary ───────────────────────────────────────────────────
  ci-status:
    runs-on: ubuntu-latest
    needs: [lint, validate, test, compound, typecheck]
    if: always()
    steps:
      - name: Check CI status
        run: |
          if [ "${{ needs.lint.result }}" = "failure" ] || \
             [ "${{ needs.validate.result }}" = "failure" ] || \
             [ "${{ needs.test.result }}" = "failure" ]; then
            echo "❌ CI Pipeline Failed"
            exit 1
          fi
          echo "✅ CI Pipeline Passed"
