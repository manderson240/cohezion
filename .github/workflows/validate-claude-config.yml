name: Validate Claude Workflow Config

# Enforcement guard for @claude PR mention functionality.
#
# @claude mentions fail SILENTLY when workflow permissions are set to 'read':
# Claude receives the trigger event but cannot post replies or push code.
# This workflow catches that regression before it reaches main.
#
# Triggers:
#   - Any PR that modifies claude workflow files (path filter)
#   - Every push to main (catch direct commits that bypass PR)
#   - Weekly schedule (catch drift from external changes)
#   - Manual trigger (on-demand audit)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/claude*.yml'
      - 'scripts/ci/validate_claude_workflows.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/claude*.yml'
  schedule:
    - cron: '0 3 * * 1'  # Weekly Monday 3am UTC
  workflow_dispatch:

jobs:
  validate-claude-config:
    name: Validate @claude permissions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PyYAML
        run: pip install pyyaml --quiet

      - name: Validate Claude workflow permissions
        run: python scripts/ci/validate_claude_workflows.py

      - name: Summary on failure
        if: failure()
        run: |
          echo "## ❌ Claude Workflow Misconfiguration Detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The \`@claude\` PR mention feature will be **silently broken** until fixed." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Root cause**: \`pull-requests\`, \`issues\`, or \`contents\` permissions" >> $GITHUB_STEP_SUMMARY
          echo "are set to \`read\` instead of \`write\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Fix**: In each \`.github/workflows/claude*.yml\` job, set:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`yaml" >> $GITHUB_STEP_SUMMARY
          echo "permissions:" >> $GITHUB_STEP_SUMMARY
          echo "  contents: write" >> $GITHUB_STEP_SUMMARY
          echo "  pull-requests: write" >> $GITHUB_STEP_SUMMARY
          echo "  issues: write" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Summary on success
        if: success()
        run: |
          echo "## ✅ Claude Workflow Configuration Valid" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All required write permissions are in place. \`@claude\` mentions will work." >> $GITHUB_STEP_SUMMARY
