name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run root project tests
        run: |
          uv run pytest tests/ --cov=src --cov-report=xml --cov-report=term-missing -v

      - name: Run cloud-vault-mcp tests
        run: |
          cd cloud-vault-mcp
          uv sync --frozen 2>/dev/null || true
          uv run pytest tests/ --cov=src --cov-report=xml --cov-report=term-missing -v
        continue-on-error: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml,./cloud-vault-mcp/coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-markers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-type: ["fast"]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run ${{ matrix.test-type }} tests
        run: |
          uv run pytest -m ${{ matrix.test-type }} --co -q
          uv run pytest -m ${{ matrix.test-type }} -v
