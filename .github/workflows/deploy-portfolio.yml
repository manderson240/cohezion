name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [main, master, session-56-opencode-vault]
    paths:
      - 'docs/portfolio/website/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Copy website to root for deployment
        run: |
          mkdir -p _site
          # Copy HTML files (portfolio website)
          cp docs/index.html docs/rzero-dashboard.html docs/universe-explorer.html _site/
          # Copy portfolio directory
          cp -r docs/portfolio _site/
          # Create a redirect from root to the portfolio
          cat > _site/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta http-equiv="refresh" content="0; url=./index.html">
          </head>
          <body>
            <p>Redirecting to COHEZION Portfolio...</p>
          </body>
          </html>
          EOF
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
