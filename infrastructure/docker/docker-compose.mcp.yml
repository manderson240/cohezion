version: "3.8"

services:
  redis-mcp:
    image: redis:7-alpine
    container_name: redis-mcp
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - mcp-network

  bmad-mcp:
    build:
      context: .
      dockerfile: Dockerfile.bmad-mcp
    container_name: bmad-mcp
    ports:
      - "8361:8361"
    environment:
      - MCP_PORT=8361
      - REDIS_URL=redis://redis-mcp:6379
      - MCP_API_KEY=${MCP_API_KEY:-dev-key-change-in-production}
      - BMAD_DATA_PATH=/app/_bmad
    volumes:
      - ./_bmad:/app/_bmad:ro
      - ./src/cohezion/mcp/servers/bmad:/app/mcp/bmad:ro
    depends_on:
      redis-mcp:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mcp-network

  skills-mcp:
    build:
      context: .
      dockerfile: Dockerfile.skills-mcp
    container_name: skills-mcp
    ports:
      - "8362:8362"
    environment:
      - MCP_PORT=8362
      - REDIS_URL=redis://redis-mcp:6379
      - SKILLS_CACHE_SIZE=1000
    volumes:
      - ./src/cohezion/mcp/servers/skills:/app/mcp/skills:ro
    depends_on:
      redis-mcp:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mcp-network

  mcp-manager:
    build:
      context: .
      dockerfile: Dockerfile.mcp-manager
    container_name: mcp-manager
    ports:
      - "8370:8370"
    environment:
      - MANAGER_PORT=8370
      - REDIS_URL=redis://redis-mcp:6379
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./src/cohezion/mcp/manager:/app/mcp/manager:ro
    depends_on:
      - redis-mcp
      - bmad-mcp
      - skills-mcp
    restart: unless-stopped
    networks:
      - mcp-network

  doc-retriever-mcp:
    build:
      context: .
      dockerfile: Dockerfile.doc-retriever
    container_name: doc-retriever-mcp
    ports:
      - "8364:8364"
    environment:
      - MCP_PORT=8364
      - SURREAL_URL=ws://surrealdb-mcp:8000/rpc
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - ./_bmad:/app/_bmad:ro
      - ./src/cohezion/mcp/servers/doc:/app/mcp/doc:ro
    depends_on:
      surrealdb-mcp:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped
    networks:
      - mcp-network

  surrealdb-mcp:
    image: surrealdb/surrealdb:v3.0
    container_name: surrealdb-mcp
    ports:
      - "8000:8000"
    command: start --log trace --user root --pass root memory
    healthcheck:
      test: ["CMD", "surreal", "is-ready", "--conn", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - mcp-network

  ollama:
    image: ollama/ollama:latest
    container_name: ollama-mcp
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    command: serve
    restart: unless-stopped
    networks:
      - mcp-network

  # New Compound Engineering Servers
  memory-mcp:
    build:
      context: .
      dockerfile: Dockerfile.memory
    container_name: memory-mcp
    ports:
      - "8366:8366"
    environment:
      - MCP_PORT=8366
      - SURREAL_URL=ws://surrealdb-mcp:8000/rpc
    volumes:
      - ./src/cohezion/mcp/servers/memory:/app/mcp/memory:ro
    depends_on:
      surrealdb-mcp:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mcp-network

  sequential-thinking-mcp:
    build:
      context: .
      dockerfile: Dockerfile.sequential
    container_name: sequential-thinking-mcp
    ports:
      - "8367:8367"
    environment:
      - MCP_PORT=8367
    volumes:
      - ./src/cohezion/mcp/servers/sequential:/app/mcp/sequential:ro
    restart: unless-stopped
    networks:
      - mcp-network

  git-context-mcp:
    build:
      context: .
      dockerfile: Dockerfile.git
    container_name: git-context-mcp
    ports:
      - "8368:8368"
    environment:
      - MCP_PORT=8368
    volumes:
      - .:/app/repo:ro
      - ./src/cohezion/mcp/servers/git:/app/mcp/git:ro
    restart: unless-stopped
    networks:
      - mcp-network

  # Security MCP Server
  security-mcp:
    build:
      context: .
      dockerfile: Dockerfile.security
    container_name: security-mcp
    ports:
      - "8369:8369"
    environment:
      - MCP_PORT=8369
    volumes:
      - .:/app/repo:ro
      - ./src/cohezion/mcp/servers/security:/app/mcp/security:ro
    restart: unless-stopped
    networks:
      - mcp-network

  # Plasma Physics MCP Server - HIHO & Exotic Vacuum
  plasma-physics-mcp:
    build:
      context: .
      dockerfile: Dockerfile.plasma
    container_name: plasma-physics-mcp
    ports:
      - "8380:8380"
    environment:
      - MCP_PORT=8380
    volumes:
      - ./src/cohezion/mcp/servers/plasma:/app/mcp/plasma:ro
    restart: unless-stopped
    networks:
      - mcp-network

  # Report Generation MCP Server - Marimo Integration
  report-generation-mcp:
    build:
      context: .
      dockerfile: Dockerfile.report
    container_name: report-generation-mcp
    ports:
      - "8381:8381"
      - "8765:8765"  # Marimo port
    environment:
      - MCP_PORT=8381
      - MARIMO_PORT=8765
    volumes:
      - ./src/cohezion/mcp/servers/report:/app/mcp/report:ro
      - marimo-reports:/app/reports
    restart: unless-stopped
    networks:
      - mcp-network

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok-mcp
    ports:
      - "4040:4040"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: >
      http 
      --domain=${NGROK_DOMAIN:-bmad-mcp-local.ngrok.io}
      --region=us
      http://bmad-mcp:8361
    depends_on:
      - bmad-mcp
    restart: unless-stopped
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
  ollama-data:
    driver: local
  marimo-reports:
    driver: local
