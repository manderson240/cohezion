# Model Profiles — CostAwareRouter config
# Version: 2.0.0 | Updated: 2026-04-11
# Architecture: Lemonade-first + Ollama Pro Cloud (Quarter-on-a-String Protocol)

# ─────────────────────────────────────────────────────────────────
# TIER ROUTING — CostAwareRouter reads these to select models by tier
# instead of hardcoded model names. Transitional: maps to legacy names
# until the 40-ref algorithm refactor is complete.
# ─────────────────────────────────────────────────────────────────
tier_routing:
  # Simple queries → fastest, cheapest model (Lemonade NPU/Hybrid, $0)
  tier_simple: "Phi-4-mini-instruct-Hybrid"
  tier_simple_legacy: "phi3:mini"  # Pre-migration Ollama name (removed)

  # Medium queries → balanced quality/speed (Lemonade Hybrid, $0)
  tier_medium: "Qwen3-8B-Hybrid"
  tier_medium_legacy: "qwen3-coder:32b"  # Pre-migration Ollama name (removed)

  # Complex queries → highest quality (Lemonade Hybrid/GPU, $0)
  tier_complex: "Qwen3-14B-Hybrid"
  tier_complex_legacy: "deepseek-r1:8b"  # Pre-migration Ollama name (removed)

# Model Profiles — Empirically-measured quality/speed/latency for CostAwareRouter
#
# Two inference tiers:
#   1. Lemonade (local, $0, gfx1151-optimized): 105+ models across CPU/NPU/GPU
#   2. Ollama Pro Cloud ($20/mo flat): 20+ frontier models via :cloud suffix
#
# Orchestration tier (NOT routed by CostAwareRouter):
#   - Claude Code Max 20x (Opus 4.6 / Sonnet 4.6 / Haiku 4.5)
#   - Gemini Pro CLI (gemini-2.5-pro)
#
# Source: vendor/lemonade/resources/server_models.json (105+ models)
# Pi agent: gets 1 dedicated Ollama Cloud slot + own Lemonade instance

