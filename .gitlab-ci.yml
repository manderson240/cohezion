stages:
  - lint
  - test
  - typecheck

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

default:
  tags:
    - cohezion

# Cache uv dependencies between pipeline runs
cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .cache/uv/
    - .venv/

# Install dependencies once per job
.uv-setup: &uv-setup
  before_script:
    - uv sync --frozen --quiet

# ── Lint ─────────────────────────────────────────────────────

lint:format:
  stage: lint
  <<: *uv-setup
  script:
    - uv run ruff format --check src/ tests/

lint:check:
  stage: lint
  <<: *uv-setup
  script:
    - uv run ruff check src/ tests/

# ── Test ─────────────────────────────────────────────────────

test:unit:
  stage: test
  <<: *uv-setup
  script:
    - uv run pytest tests/unit/ -v --tb=short --junitxml=report.xml
  artifacts:
    reports:
      junit: report.xml
    when: always

# ── Typecheck ────────────────────────────────────────────────

typecheck:mypy:
  stage: typecheck
  <<: *uv-setup
  script:
    - uv run mypy src/cohezion/ --ignore-missing-imports
  allow_failure: true
