[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloud-vault-mcp"
version = "0.1.0"
description = "Cloud Obsidian Vault MCP Server for Compound Engineering"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "pyyaml>=6.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
    "watchdog>=4.0",
    "anthropic>=0.40.0",
    "httpx>=0.27.0",
    "pocket-tts>=0.1.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=4.0",
    "ruff>=0.8.0",
    "mypy>=1.0",
    "black>=23.0",
    "flake8>=6.0",
]

[project.scripts]
cloud-vault-mcp = "mcp_server.main:main"
inbox-processor = "mcp_server.inbox_main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[tool.ruff]
target-version = "py311"
line-length = 120

# Linting configuration
[tool.ruff.lint]
# Enable comprehensive rule set
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "W",     # pycodestyle warnings
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "S",     # flake8-bandit (security)
    "B",     # flake8-bugbear
    "A",     # flake8-builtins
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "TCH",   # flake8-type-checking
    "RUF",   # Ruff-specific rules
]

ignore = [
    # Security: informational warnings — SurrealDB uses string queries by design
    "S608",   # hardcoded SQL — SurrealDB query strings are intentional
    "S311",   # pseudo-random generators — non-crypto usage
    "S607",   # partial executable path — controlled environment
    "S603",   # subprocess without shell=True — safe default
    "S108",   # hardcoded /tmp — acceptable in dev/test
    "S310",   # suspicious URL open — HTTP client code
    "S324",   # insecure hash — checksums, not security
    "S301",   # pickle usage — model serialization
    "S110",   # try-except-pass — intentional non-blocking ops
    "S113",   # request without timeout — handled at higher level
    # Naming: math/matrix conventions
    "N806",   # non-lowercase variable
    "N807",   # dunder function name
    "N803",   # invalid argument name
    # Unicode: smart quotes in docstrings
    "RUF001", # ambiguous unicode in strings
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
    "RUF012", # mutable class default — Pydantic handles this
    # Simplification: readability preferences
    "SIM105", # suppressible exception
    "SIM108", # ternary preference
    "SIM117", # multiple with statements
    "SIM102", # collapsible if
    # Async patterns
    "RUF006", # asyncio dangling task
    # Variable naming
    "E741",   # ambiguous variable name
    # Default arguments
    "B008",   # function call in default arg
    # Builtins shadowing
    "A001",   # builtin-variable-shadowing
    "A002",   # builtin-argument-shadowing
    # Security: low-noise
    "S107",   # hardcoded password defaults
    "S103",   # bad file permissions
    "S604",   # call with shell=True
    "S101",   # assert in scripts
]

# Per-file customization
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # Allow assert in tests
    "S105",   # Allow hardcoded passwords in tests
    "S106",   # Allow hardcoded passwords in tests
    "S107",   # Allow hardcoded password defaults
    "B018",   # Allow useless expressions in tests
    "E402",   # Allow late imports in tests
]
"src/mcp_server/config.py" = [
    "S104",  # Allow binding to all interfaces (0.0.0.0) for server config
]
"src/mcp_server/inbox_processor.py" = [
    "E501",  # Long lines in prompt string constants are intentional
]

# Import sorting configuration
[tool.ruff.lint.isort]
known-first-party = ["mcp_server"]
force-single-line = false
lines-after-imports = 2

# Formatter configuration (replaces Black)
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# Type checking with mypy
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
