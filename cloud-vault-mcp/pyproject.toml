[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloud-vault-mcp"
version = "0.1.0"
description = "Cloud Obsidian Vault MCP Server for Compound Engineering"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "pyyaml>=6.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "black>=24.0",
    "ruff>=0.5.0",
]

[project.scripts]
cloud-vault-mcp = "mcp_server.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
