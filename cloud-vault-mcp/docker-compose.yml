services:
  mcp-server:
    build: .
    container_name: cloud-vault-mcp
    restart: unless-stopped
    env_file: .env
    environment:
      - VAULT_PATH=/vault
    volumes:
      - vault-data:/vault
    ports:
      - "${MCP_PORT:-8360}:8360"
    networks:
      - vault-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8360/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: cloud-vault-nginx
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      mcp-server:
        condition: service_healthy
    networks:
      - vault-net

  git-sync:
    build: .
    container_name: cloud-vault-git-sync
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        cd /vault
        git config --global user.email "vault-sync@cloud-vault"
        git config --global user.name "Cloud Vault Sync"
        git config --global --add safe.directory /vault

        while true; do
          if [ -n "$$(git status --porcelain)" ]; then
            git add -A
            git commit -m "auto-sync: $$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if [ -n "$${GIT_REMOTE_URL}" ]; then
              git push origin main 2>/dev/null || true
            fi
          fi
          sleep $${GIT_SYNC_INTERVAL:-300}
        done
    env_file: .env
    environment:
      - GIT_SYNC_INTERVAL=${GIT_SYNC_INTERVAL:-300}
    volumes:
      - vault-data:/vault
    networks:
      - vault-net

volumes:
  vault-data:
    driver: local

networks:
  vault-net:
    driver: bridge
