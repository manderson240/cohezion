name: test_driven_development
description: "Test-driven development workflow with Mycelium test generation and CodeReviewAgent review"
version: "1.0"
author: cohezion-meta-generator

agents:
  - name: mycelium
    type: Mycelium
    config:
      model: "qwen2.5-coder:7b"
      priority: 7

  - name: code_reviewer
    type: CodeReviewAgent
    config:
      model: "phi3:mini"
      priority: 6

steps:
  - name: generate_tests
    agent: mycelium
    input:
      file: "{{ source_file }}"
    output: "test_file"

  - name: review_tests
    agent: code_reviewer
    input:
      code: "${steps.generate_tests.output}"
      focus_areas: ["test_quality", "coverage", "edge_cases"]
    output: "review_report"

  - name: fix_tests
    agent: mycelium
    input:
      file: "${steps.generate_tests.output}"
      feedback: "${steps.review_tests.output}"
    output: "fixed_tests"

data_flow:
  - from: generate_tests
    to: review_tests
    field: "output"
  - from: review_tests
    to: fix_tests
    field: "output"

quality_gates:
  - step: review_tests
    metric: "overall_score"
    threshold: 0.8
    action: "stop"

outputs:
  - name: "final_tests"
    source: "${steps.fix_tests.output}"
