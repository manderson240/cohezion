name: create-branch
description: "Creates a new branch in the git repository."

instructions:
  - step: 1
    goal: "Get the branch name"
    ask: "Please provide a branch name:"
    output:
      branch_name: "{{user_input}}"

  - step: 2
    goal: "Create the new branch"
    invoke-task: "bmad/core/tasks/git-create-branch.xml"
    input:
      branch_name: "{{branch_name}}"
