name: check-command
description: "Checks if a command is appropriate for the Cloud Shell environment."

instructions:
  - step: 1
    goal: "Check the command"
    invoke-task: "bmad/core/tasks/check-command.xml"
    input:
      command: "{{command}}"
    output:
      is_appropriate: "{{is_appropriate}}"
      reason: "{{reason}}"

  - step: 2
    goal: "Return the result"
    action: "echo {{reason}}"
