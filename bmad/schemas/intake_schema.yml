type: object
properties:
  original_request:
    type: string
    description: The original natural language request from the user.
  summarized_intent:
    type: string
    description: A concise summary of the user's intent.
  entities:
    type: array
    description: A list of key entities extracted from the request.
    items:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        value:
          type: string
      required:
        - name
        - type
        - value
  keywords:
    type: array
    description: A list of key keywords extracted from the request.
    items:
      type: string
  suggested_workflow:
    type: string
    description: A suggestion for which workflow to execute based on the user's request.
required:
  - original_request
  - summarized_intent
  - entities
  - keywords
  - suggested_workflow
