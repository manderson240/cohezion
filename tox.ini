[tox]
envlist = py312,lint,type,cov
skip_missing_interpreters = true

[testenv]
description = Run Phase 4A tests
deps =
    pytest
    pytest-cov
    pytest-timeout
commands =
    pytest -q tests/ --tb=short

[testenv:lint]
description = Check code with ruff
skip_install = true
deps = ruff
commands =
    ruff check src/ tests/ --select=E,W,F
    ruff format src/ tests/ --check

[testenv:type]
description = Type check with basedpyright
skip_install = true
deps = basedpyright
commands =
    basedpyright src/

[testenv:cov]
description = Generate coverage report
deps =
    pytest
    pytest-cov
commands =
    pytest -q tests/ --cov=src --cov-report=html --cov-report=term-missing --cov-fail-under=90

[testenv:format]
description = Format code with ruff
skip_install = true
deps = ruff
commands =
    ruff format src/ tests/
    ruff check src/ tests/ --fix
