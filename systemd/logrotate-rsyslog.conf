# Cohezion rsyslog rotation policy
# Install: sudo cp systemd/logrotate-rsyslog.conf /etc/logrotate.d/rsyslog
# Test:    sudo logrotate -d /etc/logrotate.d/rsyslog
# Force:   sudo logrotate -f /etc/logrotate.d/rsyslog
#
# Rationale: Default config rotates weekly with 4 rotations. During the
# Feb 2026 SurrealDB crash-loop incident, syslog grew to 813MB between
# rotations (weekly schedule). Adding maxsize 100M triggers early rotation
# when any log file exceeds 100MB, preventing runaway growth. Increasing
# rotate to 8 retains more history (compressed rotations are small: ~7-18MB).
#
# Changes from default:
# - Added maxsize 100M (early rotation when file exceeds 100MB)
# - Changed rotate from 4 to 8 (keep more history, compressed files are small)

/var/log/syslog
/var/log/mail.log
/var/log/kern.log
/var/log/auth.log
/var/log/user.log
/var/log/cron.log
{
	rotate 8
	weekly
	maxsize 100M
	missingok
	notifempty
	compress
	delaycompress
	sharedscripts
	postrotate
		/usr/lib/rsyslog/rsyslog-rotate
	endscript
}
