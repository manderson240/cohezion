# Cohezion journald retention policy
# Install: sudo cp systemd/journald-cohezion.conf /etc/systemd/journald.conf.d/cohezion.conf
# Apply:   sudo systemctl restart systemd-journald
#
# Rationale: Default journald has no explicit retention limits. During the
# Feb 2026 SurrealDB crash-loop incident (129K restarts), the journal grew
# to 1.2GB and contributed to journald crashing. A panic vacuum then
# deleted historical logs needed for diagnostics. These settings prevent
# both extremes: unbounded growth AND loss of diagnostic history.

[Journal]
# Cap total disk usage at 2GB (prevents unbounded growth from crash loops)
SystemMaxUse=2G

# Keep at least 4GB free on disk (safety valve)
SystemKeepFree=4G

# Individual journal files max 128MB (easier rotation)
SystemMaxFileSize=128M

# Retain 30 days of history (prevents panic vacuum from destroying diagnostics)
MaxRetentionSec=30day

# Rate-limit burst logging (crash loops generate thousands of entries/minute)
RateLimitIntervalSec=30s
RateLimitBurst=1000
